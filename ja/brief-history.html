  .bh-legend-item:not(.active) { opacity: .7; }
  /* 종목 색은 티커 글자가 맡는다 — 네모는 체크박스 본연의 모양으로만 둔다.
     네모까지 종목 색으로 칠했더니 작은 화면에서 그냥 색점으로 보여서

  .bh-legend-label { color: var(--sym-color, var(--ez-text2)); }

    width: 17px; height: 17px; border-radius: 4px; flex: none; box-sizing: border-box;

    content: ''; width: 8px; height: 4px; margin-top: -2px;
    border-left: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(-45deg); opacity: 0; transition: opacity .1s;
  }
  .bh-legend-item.active .bh-legend-check::after { opacity: 1; }
  .bh-legend-shake { animation: bh-shake .4s; }
  @keyframes bh-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }

  .bh-zoom-btns {

  }
  .bh-zoom-btns button:hover { background: var(--ez-border2); }

  .bh-draw-toolbar {
    position: absolute; left: 8px; top: 8px; z-index: 6;
    display: flex; flex-direction: column; gap: 4px;
  }
  .bh-draw-btn {
    width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--ez-border);
    background: var(--ez-card2); color: var(--ez-text2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .bh-draw-btn:hover { background: var(--ez-border2); }
  .bh-draw-btn.active { background: var(--ez-blue); color: #fff; border-color: var(--ez-blue); }
  .bh-draw-sep { height: 1px; background: var(--ez-border); margin: 2px 4px; }
  /* 그림 도구가 그려지는 오버레이 캔버스 — 평소엔 pointer-events:none이라 차트 조작(팬·줌·
     이슈 마커 클릭)을 그대로 통과시키고, 도구를 선택했을 때만 JS로 auto 전환해 클릭을 받는다.
     touch-action:none은 도구 활성화(pointer-events:auto) 상태에서 손가락 드래그가 브라우저
     기본 스크롤/팬으로 새는 걸 막는다 — 평소(none)엔 캔버스가 애초에 터치를 안 받아 무해. */
  .bh-draw-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; touch-action: none; }
  /* 그림 하나를 탭/클릭하면 그 위치 근처에 뜨는 개별 삭제(휴지통) 버튼 — 전체 지우기와 별개 */
  .bh-draw-delete-btn {

    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .bh-draw-delete-btn:hover { background: var(--ez-red); color: #fff; }
  /* 모바일 — 범례 5개·기간버튼 6개를 한 줄에 고정. 폰트는 사이트 14px 하한선을 유지하고

  @media (max-width: 640px) {
    /* 좁은 화면에서는 알약 테두리·배경을 걷어낸다. 체크박스와 색 있는 티커만으로
       이미 '켜고 끄는 것'이 읽히고, 그 껍데기를 지운 만큼 다섯 종목이 한 줄에
       들어간다(테두리+좌우 여백만 종목당 12px 였다). 세로 여백은 오히려 늘려서
       손가락 표적을 44px 로 확보한다 — 세로는 줄 수에 영향이 없다. */
    .bh-legend { gap: 2px; }
    .bh-legend-item {
      gap: 3px; font-size: 14px; padding: 0;
      background: none; border: none; border-radius: 0; min-height: 44px;

    .bh-legend-check { width: 15px; height: 15px; border-radius: 4px; }

    .bh-range-btn { padding: 5px 7px; }

  .bh-filter-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: var(--ez-text2); }

  /* 날짜로 이동 — 버튼을 누르면 우측에 날짜 입력칸이 나타난다(기본값 오늘) */
  .bh-goto-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

    width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--ez-border);

    font-size: 15px; font-weight: 600; color: var(--ez-text); background: var(--ez-surface);

  /* ── 이벤트 패널 ── */
  .bh-events-card { padding: 18px 20px 20px; }

  .bh-event-item {
    padding: 16px 16px; border-radius: var(--ez-rs); border: 1px solid var(--ez-border2);
    background: var(--ez-card2); margin-bottom: 12px; scroll-margin-top: 90px;
  }
  .bh-event-item.highlight { outline: 2px solid var(--ez-blue); background: var(--ez-blue-dim); }
  /* 누르면 차트가 그 날짜로 이동한다 — 누를 수 있다는 걸 보이게 한다. */
  .bh-event-item { cursor: pointer; }
  .bh-event-item:active { transform: scale(.995); }
  @media (prefers-reduced-motion: reduce) { .bh-event-item:active { transform: none; } }
  .bh-event-item .bh-event-link { cursor: pointer; }
  .bh-event-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .bh-event-date { font-size: 14px; font-weight: 700; color: var(--ez-text2); }
  .bh-badge { font-size: 14px; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: #fff; }
  .bh-badge.major { background: var(--ez-blue); }
  .bh-badge.notable { background: var(--ez-text3); }
  /* 기록 = 그날 올라간 글. 이슈(핵심·주요)와 무게가 다르므로 테두리만 쓴다. */
  .bh-badge.log { background: transparent; color: var(--ez-text2); border: 1px solid var(--ez-border); font-weight: 600; }
  .bh-dot-notable { background: var(--ez-text3); }
  .bh-dot-log { background: var(--ez-text3); opacity: .45; }
  /* 그날의 글 목록 — 제목이 곧 링크다 */
  .bh-article-list { list-style: none; margin: 0 0 10px; padding: 0; }
  .bh-article-list li { position: relative; padding-left: 13px; margin-bottom: 4px; line-height: 1.55; }
  .bh-article-list li:last-child { margin-bottom: 0; }
  .bh-article-list li::before { content: '·'; position: absolute; left: 0; top: 0; color: var(--ez-text2); font-weight: 800; }
  .bh-article-list a { font-size: 15px; color: var(--ez-text2); text-decoration: none; }
  .bh-article-list a:hover { color: var(--ez-blue); text-decoration: underline; }
  .bh-article-head { font-size: 15px; font-weight: 700; color: var(--ez-text); margin: 2px 0 4px; }
  .bh-more-row { display: flex; justify-content: center; padding: 6px 0 2px; }
  .bh-more-btn {
    font-size: 15px; font-weight: 600; color: var(--ez-text2); background: var(--ez-card2);
    border: 1px solid var(--ez-border); border-radius: 999px; padding: 9px 20px; cursor: pointer;
  }
  .bh-more-btn:hover { color: var(--ez-blue); }

  /* 소제목 + 닷블릿 리스트 구조 요약 (2024-10-29 이후 이슈) */
  .bh-event-groups { margin-bottom: 10px; }

  .bh-event-group-list li::before { content: '·'; position: absolute; left: 0; top: 0; color: var(--ez-text2); font-weight: 800; }
  .bh-event-moves { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 9px; }
  .bh-move-pill { font-size: 14px; font-weight: 700; padding: 3px 9px; border-radius: 6px; }
  .bh-move-pill.up { color: var(--ez-green); background: color-mix(in srgb, var(--ez-green) 14%, transparent); }
  .bh-move-pill.down { color: var(--ez-red); background: color-mix(in srgb, var(--ez-red) 14%, transparent); }
  .bh-event-foot { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--ez-text2); }

</style>
</head>

<script>
(function(){
  const T = window.BH_T;
  const BH_DATA = window.BH_DATA;
  const fmt = (tpl, vars) => String(tpl).replace(/\{(\w+)\}/g, (_, k) => vars[k]);
  const IS_DARK = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const IS_MOBILE = window.matchMedia('(max-width: 640px)').matches;
  const COLORS = {
    QQQ:  IS_DARK ? '#0A84FF' : '#0071E3',
    SPY:  IS_DARK ? '#BF5AF2' : '#8944AB',
    SOXX: IS_DARK ? '#FF9F0A' : '#C77700',
    TSLA: IS_DARK ? '#5AC8C8' : '#0F8B8D',
    NVDA: IS_DARK ? '#FF6482' : '#C2185B',
    green: IS_DARK ? '#30D158' : '#1A7F37',
    red:   IS_DARK ? '#FF453A' : '#D92A2A',
    // 기록용 — 같은 색을 배경 쪽으로 눌러 이슈 마커와 무게를 구분한다
    greenDim: IS_DARK ? '#1E7A38' : '#8FC6A2',
    redDim:   IS_DARK ? '#8C2C26' : '#E9A3A0',
  };
  const SYMBOL_LABELS = { QQQ: 'QQQ', SPY: 'SPY', SOXX: 'SOXX', TSLA: 'TSLA', NVDA: 'NVDA' };
  // 화면에는 티커만 표시(공간 절약). 설명은 title/aria-label 툴팁으로만 제공.
  const SYMBOL_FULL_LABELS = T.symbolFull;
  const SYMBOLS = ['QQQ', 'SPY', 'SOXX', 'TSLA', 'NVDA'];

  let chartData = null, eventsData = [];
  let chart;
  let markerHostSeries; // 이슈 마커 전용 숨은 기준선 — 가격축과 무관하게 항상 날짜에 고정
  const seriesRefs = {};
  /* 처음엔 QQQ 하나만. 여러 선을 한꺼번에 켜두면 세로축이 가장 큰 종목에
     맞춰져 나머지가 바닥에 눌려 붙는다 — 볼 것을 직접 고르게 둔다. */
  const seriesVisible = { QQQ: true, SPY: false, SOXX: false, TSLA: false, NVDA: false };
  let selectedDate = null;
  let calYear, calMonth; // 0-indexed month
  let majorOnly = false;  // 기본값: 전부 표시 (체크박스 checked 속성과 동기화)
  const LIST_PAGE = 120;  // 전체 목록을 끊어서 그리는 단위
  let listShown = LIST_PAGE;
  /* 기록 점을 찍을지는 '몇 개월치냐'가 아니라 '점 하나에 몇 픽셀이 돌아가느냐'로
     정한다. 같은 6개월이라도 PC 는 1,100px, 폰은 350px 라서 봉 개수로 재면 폰에서만
     점이 서로 붙어 띠가 된다(실제로 그렇게 나왔다). 점 지름이 5px 안팎이니
     8px 은 확보돼야 서로 구분되고 손가락으로도 겨냥할 수 있다. */
  const PX_PER_BAR_FOR_ALL  = 8;    // 이만큼 여유가 있으면 그날의 글(기록)까지
  const PX_PER_BAR_FOR_SOSA = 3.5;  // 그 아래로는 이슈(핵심+주요)만
  let markerTier = 'major';         // 'major' | 'sosa' | 'all' — 그보다 좁으면 핵심만
  let currentRangeMonths = null;   // 현재 적용된 기간(개월) — 줌 계산 기준. null = 전체
  let currentCenterDate = null;    // 현재 기간의 중심 날짜 — null이면 최신일 기준
  let chartOK = false;             // 차트가 실제로 그려졌는가 (외부 라이브러리 의존)

  const eventsByDate = {};
  let chartDateSet = new Set();   // 차트가 실제로 가진 거래일 — 마커를 걸 수 있는 날짜

  /* 번역본이 아직 안 구워졌거나 실패한 경우의 안전망 — 한국어 원본으로 대신
     그린다. 화면이 통째로 죽는 것보다 낫다. 다만 이때도 원문 링크는 걷어낸다:
     유료 한국어 구독 콘텐츠라 비한국어 방문자가 눌러도 읽을 수 없다. */
  const KO_DATA = '/data/brief-history.json';
  function stripLinks(list) {
    return list.map(e => {
      const c = Object.assign({}, e);
      delete c.link;
      if (c.articles) c.articles = c.articles.map(a => ({ t: a.t }));
      if (c.moreArticles) c.moreArticles = c.moreArticles.map(a => ({ t: a.t }));
      return c;
    });
  }
  const loadEvents = fetch(BH_DATA)
    .then(r => { if (!r.ok) throw new Error('no ' + BH_DATA); return r.json(); })
    .catch(() => {
      if (BH_DATA === KO_DATA) throw new Error('원본도 못 읽었다');
      console.warn('[이슈] 번역본을 못 읽어 한국어 원본으로 대체한다');
      return fetch(KO_DATA).then(r => r.json()).then(stripLinks);
    });

  Promise.all([
    fetch('/data/brief-history-chart.json').then(r => r.json()),
    loadEvents
  ]).then(([chartJson, eventsJson]) => {
    chartData = chartJson;
    chartDateSet = new Set(chartData.dates);
    eventsData = eventsJson.slice().sort((a,b) => a.date < b.date ? 1 : -1); // 최신순
    // 한 날짜에 이슈와 기록이 겹칠 수 있다 — 달력 점은 그중 가장 무거운 것을 따른다.
    eventsJson.forEach(e => {
      const cur = eventsByDate[e.date];
      if (!cur || e.importance > cur.importance) eventsByDate[e.date] = e;
    });

    const last = chartData.dates[chartData.dates.length - 1];
    calYear = parseInt(last.slice(0,4), 10);
    calMonth = parseInt(last.slice(5,7), 10) - 1;

    /* 차트는 외부 라이브러리(unpkg의 LightweightCharts)에 기대고 있다.
       그게 안 뜨면 예전엔 이 블록이 통째로 예외를 던져 catch 로 빠졌고,
       화면 전체가 "데이터를 불러오지 못했습니다" 한 줄로 끝났다 —
       정작 이 페이지의 본론인 이슈 목록과 달력은 멀쩡한 로컬 데이터인데도.
       차트 실패를 목록 실패로 번지지 않게 분리한다. */
    try {
      if (typeof LightweightCharts === 'undefined') throw new Error('chart lib unavailable');
      buildLegend();
      buildChart();
      initDrawTools();
      buildRangeButtons();
      chartOK = true;
    } catch (e) {
      console.warn('[이슈] 차트를 그리지 못했다 — 목록·달력은 그대로 표시한다:', e);
      /* 카드를 통째로 지우면 그 안에 같이 들어 있는 '날짜로 이동'·필터까지
         사라져서 뒤 코드가 null 을 만진다. 차트 영역과 차트 전용 조작만
         걷어내고 나머지 조작은 그대로 남긴다. */
      var outer = document.querySelector('.bh-chart-outer');
      if (outer) {
        outer.innerHTML =
          '<div class="bh-empty">' + T.chartFail + '</div>';
      }
      ['.bh-legend', '.bh-range-btns'].forEach(function (sel) {
        var el = document.querySelector(sel);
        if (el) el.style.display = 'none';
      });
    }
    renderCalendar();
    renderEventList();

    // "핵심 이슈만 표시"는 달력쪽·차트쪽 두 군데에 있고 항상 같은 값으로 동기화된다.
    // 어느 쪽을 누르든 majorOnly 갱신 + 캘린더·목록·차트 마커(applyMarkers)까지 전부 다시 그린다.
    const majorOnlyCheckboxes = [
      document.getElementById('bh-major-only'),
    ].filter(Boolean);
    majorOnlyCheckboxes.forEach(cb => {
      cb.addEventListener('change', (e) => {
        majorOnly = e.target.checked;
        listShown = LIST_PAGE;
        majorOnlyCheckboxes.forEach(other => { other.checked = majorOnly; });
        renderCalendar();
        renderEventList();
        applyMarkers();
      });
    });
    /* 전체 목록으로 돌아가는 길 — 달력에서 이미 고른 날짜를 한 번 더 누르면
       선택이 풀린다. 별도 버튼을 두지 않는다. */
    /* 이슈 카드를 누르면 그 날짜가 차트 한가운데로 온다. 카드 안의 '원문 보기'
       링크를 누른 경우는 제외 — 그건 글을 열러 가는 동작이다. */
    var listEl = document.getElementById('bh-events-list');
    if (listEl) {
      listEl.addEventListener('click', (ev) => {
        if (ev.target.closest('a')) return;
        const card = ev.target.closest('.bh-event-item');
        if (!card || !card.dataset.date) return;
        selectDate(card.dataset.date, 'chart');
      });
    }

    document.getElementById('bh-cal-prev').addEventListener('click', () => shiftMonth(-1));
    document.getElementById('bh-cal-next').addEventListener('click', () => shiftMonth(1));
    var zin = document.getElementById('bh-zoom-in');
    var zout = document.getElementById('bh-zoom-out');
    if (zin) zin.addEventListener('click', () => { if (chartOK) zoomChart(0.6); });
    if (zout) zout.addEventListener('click', () => { if (chartOK) zoomChart(1 / 0.6); });

    // 날짜로 이동 — 버튼을 누르면 우측에 날짜 입력칸이 나타난다. 기본값은 오늘 날짜.
    const gotoBtn = document.getElementById('bh-goto-btn');
    const gotoInput = document.getElementById('bh-goto-input');
    gotoInput.value = new Date().toISOString().slice(0, 10);
    gotoBtn.addEventListener('click', () => {
      const willShow = gotoInput.style.display === 'none';
      gotoInput.style.display = willShow ? 'inline-block' : 'none';
      gotoBtn.classList.toggle('active', willShow);
      if (willShow) {
        gotoInput.focus();
        if (typeof gotoInput.showPicker === 'function') {
          try { gotoInput.showPicker(); } catch (e) {}
        }
      }
    });
    gotoInput.addEventListener('change', (e) => {
      if (e.target.value) selectDate(e.target.value, 'chart');
    });
  }).catch(err => {
    document.getElementById('bh-events-list').innerHTML =
      '<div class="bh-empty">' + T.loadFail + '</div>';
    console.error(err);
  });

  function buildLegend() {
    document.getElementById('bh-legend').innerHTML = SYMBOLS.map(sym =>
      `<button type="button" class="bh-legend-item${seriesVisible[sym] ? ' active' : ''}" data-sym="${sym}" ` +
      `style="--sym-color:${COLORS[sym]}" role="checkbox" aria-checked="${seriesVisible[sym]}" ` +
      `title="${SYMBOL_FULL_LABELS[sym]}" aria-label="${SYMBOL_FULL_LABELS[sym]} ${T.show}">` +
      `<span class="bh-legend-check"></span><span class="bh-legend-label">${SYMBOL_LABELS[sym]}</span></button>`
    ).join('');
    document.querySelectorAll('.bh-legend-item').forEach(btn => {
      btn.addEventListener('click', () => toggleSeries(btn.dataset.sym));
    });
  }

  function shakeLegendBtn(sym) {
    const btn = document.querySelector(`.bh-legend-item[data-sym="${sym}"]`);
    if (btn) {
      btn.classList.add('bh-legend-shake');
      setTimeout(() => btn.classList.remove('bh-legend-shake'), 400);
    }
  }

  function toggleSeries(sym) {
    const visibleCount = Object.values(seriesVisible).filter(Boolean).length;
    if (seriesVisible[sym] && visibleCount <= 1) {
      // 최소 1개는 항상 볼 수 있어야 함 — 마지막 하나는 끌 수 없음. 5개 중 어느 것을
      // 마지막으로 남기든 상관없음(이슈 마커는 별도의 숨은 기준선에 고정돼 있어
      // 어떤 종목을 끄고 켜도 항상 그대로 보임 — buildChart의 markerHost 참조)
      shakeLegendBtn(sym);
      return;
    }
    seriesVisible[sym] = !seriesVisible[sym];
    if (seriesRefs[sym]) seriesRefs[sym].applyOptions({ visible: seriesVisible[sym] });
    buildLegend();
  }

  function buildChart() {
    const el = document.getElementById('bh-chart');
    chart = LightweightCharts.createChart(el, {
      autoSize: true,
      layout: {
        background: { type: 'solid', color: IS_DARK ? '#1C1C1E' : '#FFFFFF' },
        textColor: IS_DARK ? '#8E8E93' : '#3C3C3E',
        fontSize: 12,
      },
      grid: {
        vertLines: { color: IS_DARK ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)' },
        horzLines: { color: IS_DARK ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)' },
      },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.08, bottom: 0.08 } },
      timeScale: { borderVisible: false, timeVisible: false },
      localization: {
        // 크로스헤어 하단 날짜 표기 — 항상 YYYY-MM-DD 전체 표기
        timeFormatter: (time) => timeToDateStr(time) || '',
      },
      /* 터치에서 세로 스와이프는 차트가 가져가지 않는다(vertTouchDrag: false).
         폰에서는 차트가 화면 대부분을 덮기 때문에, 차트 위에서 위아래로 쓸면
         페이지가 안 내려가고 차트만 움직였다 — 읽던 사람이 갇히는 상황이다.
         가로 스와이프(기간 이동)와 핀치 줌은 그대로 둔다. 라이브러리가 첫
         움직임의 방향을 보고 세로면 손을 떼므로 브라우저가 페이지를 스크롤한다. */
      handleScroll: {
        mouseWheel: true,
        pressedMouseMove: true,
        horzTouchDrag: true,
        vertTouchDrag: false,
      },
      handleScale: true,
    });

    // 정규화 지수값이라 소수점이 의미 없다(운영 피드백) — 우측 축·크로스헤어 라벨 모두
    // 정수로 표시. 자릿수가 "800.00"(6자)→"800"(3자)로 줄면서 축 폭 자체도 함께 줄어든다
    // (LightweightCharts는 축 폭을 라벨 텍스트 길이 기준으로 자동 계산 — 별도 폭 설정 불필요).
    const IDX_PRICE_FORMAT = { type: 'price', precision: 0, minMove: 1 };
    seriesRefs.TSLA = chart.addLineSeries({ color: COLORS.TSLA, lineWidth: 1.6, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: true, visible: seriesVisible.TSLA, priceFormat: IDX_PRICE_FORMAT });
    seriesRefs.NVDA = chart.addLineSeries({ color: COLORS.NVDA, lineWidth: 1.6, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: true, visible: seriesVisible.NVDA, priceFormat: IDX_PRICE_FORMAT });
    seriesRefs.SOXX = chart.addLineSeries({ color: COLORS.SOXX, lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: true, visible: seriesVisible.SOXX, priceFormat: IDX_PRICE_FORMAT });
    seriesRefs.SPY  = chart.addLineSeries({ color: COLORS.SPY,  lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: true, visible: seriesVisible.SPY, priceFormat: IDX_PRICE_FORMAT });
    seriesRefs.QQQ  = chart.addLineSeries({ color: COLORS.QQQ,  lineWidth: 2.5, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: true, visible: seriesVisible.QQQ, priceFormat: IDX_PRICE_FORMAT });

    const toPoints = (arr) => chartData.dates.map((d, i) => ({ time: d, value: arr[i] }));
    SYMBOLS.forEach(sym => seriesRefs[sym].setData(toPoints(chartData[sym])));

    // 이슈 마커 전용 숨은 기준선 — 5개 종목 중 어느 것을 켜고 끄든(가격 축이 서로 달라도)
    // 마커는 항상 날짜(가로축) 위치에 고정돼 보이도록, 화면에 보이지 않는 별도 오버레이
    // 가격축에 이 라인을 얹어서 마커 호스트로만 쓴다. 실제 가격값은 의미 없음(항상 0).
    // scaleMargins를 top 크게·bottom 작게 잡아서, 이 라인(값 0, 전 구간 동일)이 차트
    // 하단(가로축=시간축 바로 위)에 딱 붙게 만든다 — 예전엔 오버레이 스케일 기본 여백
    // 때문에 마커가 차트 중간쯤에 붕 떠 보였음(운영자 스크린샷 지적사항).
    markerHostSeries = chart.addLineSeries({
      lineVisible: false, priceLineVisible: false, lastValueVisible: false,
      crosshairMarkerVisible: false, priceScaleId: 'bh-marker-overlay', visible: true,
    });
    markerHostSeries.priceScale().applyOptions({
      visible: false,
      scaleMargins: { top: 0.9, bottom: 0.03 },
    });
    markerHostSeries.setData(chartData.dates.map(d => ({ time: d, value: 0 })));

    /* 이슈(핵심·주요)는 항상 찍고, 기록(그날의 글)은 화면이 좁혀졌을 때만 찍는다.
       기록은 거의 매 거래일에 하나씩 있어서, 1년치를 한 화면에 놓으면 점이
       서로 붙어 시간축 위에 띠 하나가 생긴다 — 정보가 아니라 잡음이 된다. */
    chart.timeScale().subscribeVisibleLogicalRangeChange(updateMarkerDensity);
    // 화면 회전·창 크기 변경도 픽셀 여유를 바꾼다 — 같은 기준으로 다시 판정한다.
    new ResizeObserver(updateMarkerDensity).observe(el);
    applyMarkers();

    // 모바일에서 핀치줌·드래그 같은 터치 조작이 클릭으로 오인되어 바로 아래 이슈로
    // 스크롤 이동해버리는 문제가 있었다 — 이제 "등락 포인트(마커)"를 정확히 눌렀을
    // 때만(hoveredObjectId로 판별) 이슈를 연다. 그 외 차트 조작은 아무 반응 없음.
    // 누른 순간엔 그 마커만 잠깐 커지고 강조색으로 바뀌어(터치 피드백) 눌렸다는 게
    // 눈에 보이고, 동시에 그 날짜의 이슈로 바로 스크롤 이동한다.
    //
    // 커서 모드(drawMode===null)일 땐 이 클릭이 그림(추세선·가격범위) 위를 눌렀는지도
    // 먼저 확인한다 — 그림 위 클릭이면 그 그림 옆에 개별 삭제(휴지통) 버튼을 띄우고
    // 이슈 마커 로직은 건너뛴다. 오버레이 캔버스(#bh-draw-canvas)는 커서 모드일 땐
    // pointer-events:none이라 이 클릭이 캔버스를 거치지 않고 곧장 여기(차트 자체의
    // subscribeClick)로 들어오므로, 별도 캔버스 클릭 리스너 없이도 그림 히트테스트가 가능하다.
    chart.subscribeClick((param) => {
      if (drawMode === null && param.point) {
        const hit = hitTestDrawings(param.point.x, param.point.y);
        if (hit) { showDeleteButton(hit, param.point.x, param.point.y); return; }
      }
      hideDeleteButton();
      /* 팬·핀치줌이 클릭으로 오인되면 차트를 만질 때마다 화면이 튄다 —
         끌기 끝이 우연히 마커 위여도 마찬가지다. 실제 탭일 때만 반응한다. */
      if (!wasTap()) return;
      if (param.hoveredObjectId) { flashMarkerAndSelect(param.hoveredObjectId); return; }

      /* 마커를 정확히 누르기는 손가락으로 쉽지 않다 — 빗나가도 누른 자리의
         날짜를 읽어 가장 가까운 이슈로 보낸다. 그림 도구를 쥐고 있을 때는
         건너뛴다 — 그땐 클릭이 점 찍기다. */
      if (drawMode !== null) return;
      const clicked = timeToDateStr(param.time);
      if (!clicked) return;
      const near = nearestEventDate(clicked);
      if (near) flashMarkerAndSelect(near);
    });

    watchTapGesture(el);
  }

  /* 탭인가 끌기인가 — 누른 지점에서 8px 이상 움직였거나 0.4초 넘게 눌렀으면
     차트를 조작한 것으로 본다. LightweightCharts 의 클릭 이벤트는 이 둘을
     구분하지 않아서, 예전엔 모바일에서 차트를 넘길 때마다 목록이 튀었다. */
  let tapOK = false;
  function wasTap() { return tapOK; }
  function watchTapGesture(el) {
    let sx = 0, sy = 0, st = 0, moved = false;
    el.addEventListener('pointerdown', (e) => {
      sx = e.clientX; sy = e.clientY; st = Date.now(); moved = false; tapOK = false;
    }, true);
    el.addEventListener('pointermove', (e) => {
      if (!st) return;
      if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) moved = true;
    }, true);
    el.addEventListener('pointerup', (e) => {
      tapOK = !moved && (Date.now() - st) < 400;
      st = 0;
    }, true);
    el.addEventListener('pointercancel', () => { tapOK = false; st = 0; }, true);
  }

  /* 누른 날짜에서 가장 가까운 이슈 날짜. 한 달 넘게 떨어져 있으면 포기한다 —
     엉뚱한 시점으로 끌고 가는 것보다 아무 일도 안 일어나는 게 낫다. */
  function nearestEventDate(dateStr) {
    const t = new Date(dateStr + 'T00:00:00Z').getTime();
    let best = null, bestGap = Infinity;
    eventsData.forEach(e => {
      const gap = Math.abs(new Date(e.date + 'T00:00:00Z').getTime() - t);
      if (gap < bestGap) { bestGap = gap; best = e.date; }
    });
    return bestGap <= 31 * 86400000 ? best : null;
  }

  function timeToDateStr(t) {
    if (typeof t === 'string') return t;
    if (typeof t === 'object' && t && 'year' in t) {
      return `${t.year}-${String(t.month).padStart(2,'0')}-${String(t.day).padStart(2,'0')}`;
    }
    if (typeof t === 'number') {
      return new Date(t * 1000).toISOString().slice(0, 10);
    }
    return null;
  }

  function buildMarkers(pool) {
    /* 한 날짜에 이슈와 기록이 겹치면 마커는 하나만 찍는다 — 같은 시각에 마커를
       겹쳐 넣으면 라이브러리가 뒤엣것으로 덮어써서 무게가 뒤바뀐다. */
    const perDate = new Map();
    pool.forEach(e => {
      if (!chartDateSet.has(e.date)) return;   // 차트에 없는 날짜는 마커를 못 건다
      const minImp = markerTier === 'all' ? 1 : (markerTier === 'sosa' ? 2 : 3);
      if (e.importance < minImp) return;
      const cur = perDate.get(e.date);
      if (!cur || e.importance > cur.importance) perDate.set(e.date, e);
    });
    return Array.from(perDate.values())
      .map(e => {
        const moves = e.moves || {};
        const vals = Object.values(moves).filter(v => typeof v === 'number');
        const avg = vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : 0;
        const up = avg >= 0;
        // 기록(1)은 이슈(2·3)보다 눈에 덜 띄게 — 같은 색 계열이되 작고 옅게.
        const log = e.importance === 1;
        return {
          time: e.date,
          id: e.date, // subscribeClick의 hoveredObjectId 판별용
          position: 'aboveBar',
          color: log ? (up ? COLORS.greenDim : COLORS.redDim) : (up ? COLORS.green : COLORS.red),
          shape: e.importance === 3 ? (up ? 'arrowUp' : 'arrowDown') : 'circle',
          size: e.importance === 3 ? 1.1 : (e.importance === 2 ? 0.6 : 0.35),
        };
      })
      .sort((a,b) => a.time < b.time ? -1 : 1);
  }

  /* 차트 마커는 '핵심'만 걸러내지 않는다 — 전체 이슈를 다 찍는다.
     달력·목록의 '핵심 이슈만 표시'는 그대로 두되(읽을 목록은 추릴 이유가 있다),
     차트는 그날 무슨 일이 있었는지 한눈에 훑는 자리라 빠뜨릴수록 손해다. */
  function currentPool() {
    return eventsData;
  }

  /* 지금 보이는 폭에서 점 하나에 몇 픽셀이 돌아가는지 재서, 기록 점을 켤지 끈다.
     넓게 볼 땐 이슈(핵심·주요)만, 기간을 좁혀 들어가면 그날의 글까지 다 나온다. */
  function updateMarkerDensity() {
    if (!chartOK && !markerHostSeries) return;
    const lr = chart.timeScale().getVisibleLogicalRange();
    const bars = lr ? Math.max(1, lr.to - lr.from) : Infinity;
    const width = document.getElementById('bh-chart').clientWidth || 0;
    if (!width) return;
    const px = width / bars;
    const tier = px >= PX_PER_BAR_FOR_ALL ? 'all'
               : px >= PX_PER_BAR_FOR_SOSA ? 'sosa'
               : 'major';
    if (tier !== markerTier) { markerTier = tier; applyMarkers(); }
  }

  function applyMarkers() {
    /* 판정 기준은 chartOK 가 아니라 마커 호스트의 실재 여부다.
       chartOK 는 buildChart() 가 **끝난 뒤**에 켜지는데, 최초 마커는 buildChart()
       안에서 찍는다 — chartOK 로 막으면 첫 화면에서 마커가 하나도 안 나온다
       (증상: 차트는 그려지는데 등락 포인트만 전부 사라짐). 목록·달력이 차트
       실패에 휘말리지 않게 하려던 가드가 마커까지 같이 껐던 자리. */
    if (!markerHostSeries) return;
    // 이슈 마커는 특정 종목의 가격(세로축)이 아니라 markerHostSeries(숨은 오버레이
    // 기준선)에 표시한다. 종목마다 가격 축이 서로 달라 마커가 종목 조합에 따라
    // 들쭉날쭉해 보이던 문제를 해결 — 5개 중 무엇을 켜고 끄든 마커는 항상 같은 자리다.
    markerHostSeries.setMarkers(buildMarkers(currentPool()));
  }

  // 마커를 터치했을 때: 그 마커만 잠깐 커지고 강조색으로 바뀌어 "눌렸다"는 느낌을
  // 준 뒤(약 0.25초), 원래 모양으로 되돌린다. 동시에 그 날짜의 이슈로 바로 이동.
  function flashMarkerAndSelect(dateStr) {
    const flashColor = IS_DARK ? '#FFFFFF' : '#0A84FF';
    const markers = buildMarkers(currentPool()).map(m =>
      m.id === dateStr ? { ...m, size: 2.0, color: flashColor } : m
    );
    markerHostSeries.setMarkers(markers);
    selectDate(dateStr);
    setTimeout(applyMarkers, 260);
  }

  // ── 차트 그림 도구(추세선·가격범위 측정) ──────────────────────────────────
  // LightweightCharts 자체엔 TradingView 정식 위젯 같은 드로잉 툴바가 없어서(무료
  // 임베드 위젯과 이 커스텀 라이브러리는 서로 다른 제품 — 이슈 마커·정규화 비교 기능을
  // 유지하려면 이 라이브러리를 계속 써야 함), 차트 위에 별도 <canvas> 오버레이를 얹고
  // 좌표 변환만 라이브러리 API(priceToCoordinate/coordinateToPrice, timeScale의
  // timeToCoordinate/coordinateToTime)로 위임해 직접 그린다. 평소엔 이 캔버스가
  // pointer-events:none이라 팬·줌·이슈 마커 클릭 등 기존 차트 조작을 그대로 통과시키고,
  // 도구를 선택한 동안만 클릭을 받도록 전환한다.
  //
  // (운영자 2차 피드백 반영) 가격범위도 처음엔 드래그(mousedown~mouseup) 방식이었는데
  // PC에서 불편하고, 특히 모바일에서는 손가락 드래그가 차트 자체의 팬(스크롤) 제스처와
  // 충돌해 그림이 전혀 안 그려지고 차트만 움직였다 — 추세선과 똑같이 "1번째 탭으로
  // 점A 확정 → 2번째 탭으로 점B 확정" 클릭-클릭 방식으로 통일해 두 문제를 한번에 해결.
  // 모바일 터치는 mousedown/mousemove가 신뢰성 있게 안 뜨는 경우가 있어 touchstart/
  // touchmove를 별도로 붙이고(preventDefault로 브라우저 기본 스크롤 억제), 두 이벤트
  // 모두 같은 handlePointDown/handlePointMove 로직을 공유한다.
  let drawMode = null;      // null(커서) | 'trendline' | 'measure'
  let drawings = [];        // {type, p1:{time,price}, p2:{time,price}}
  let pendingP1 = null;     // 1번째 점 확정 후 2번째 점 대기 — 추세선·가격범위 공용
  let drawCanvas, drawCtx;
  let deleteBtn, deleteTarget = null; // 그림 하나를 탭했을 때 뜨는 개별 삭제(휴지통) 버튼

  function initDrawTools() {
    drawCanvas = document.getElementById('bh-draw-canvas');
    drawCtx = drawCanvas.getContext('2d');
    deleteBtn = document.getElementById('bh-draw-delete-btn');

    const btnCursor = document.getElementById('bh-draw-cursor');
    const btnTrend = document.getElementById('bh-draw-trendline');
    const btnMeasure = document.getElementById('bh-draw-measure');
    const btnClear = document.getElementById('bh-draw-clear');
    const toolBtns = { cursor: btnCursor, trendline: btnTrend, measure: btnMeasure };

    function setDrawMode(mode) {
      drawMode = mode;
      pendingP1 = null;
      hideDeleteButton();
      Object.entries(toolBtns).forEach(([key, btn]) => {
        btn.classList.toggle('active', key === (mode || 'cursor'));
      });
      drawCanvas.style.pointerEvents = mode ? 'auto' : 'none';
      drawCanvas.style.cursor = mode ? 'crosshair' : 'default';
      redrawDrawings();
    }

    btnCursor.addEventListener('click', () => setDrawMode(null));
    btnTrend.addEventListener('click', () => setDrawMode(drawMode === 'trendline' ? null : 'trendline'));
    btnMeasure.addEventListener('click', () => setDrawMode(drawMode === 'measure' ? null : 'measure'));
    btnClear.addEventListener('click', () => { drawings = []; hideDeleteButton(); redrawDrawings(); });
    // 개별 삭제 — 그림을 탭하면 뜨는 휴지통 버튼(전체 지우기와 별개, chart.subscribeClick의
    // 히트테스트에서 표시됨). 이 버튼 자체는 일반 <button>이라 모바일 탭도 따로 처리할 필요 없음.
    deleteBtn.addEventListener('click', () => {
      if (deleteTarget) drawings = drawings.filter(d => d !== deleteTarget);
      hideDeleteButton();
      redrawDrawings();
    });

    function eventXY(ev) {
      const rect = drawCanvas.getBoundingClientRect();
      return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
    }
    function touchXY(ev) {
      const t = ev.touches[0] || ev.changedTouches[0];
      const rect = drawCanvas.getBoundingClientRect();
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }

    function handlePointDown(x, y) {
      if (!drawMode) return;
      const pt = pxToPoint(x, y);
      if (!pt) return;
      if (!pendingP1) {
        pendingP1 = pt;
      } else {
        drawings.push({ type: drawMode, p1: pendingP1, p2: pt });
        setDrawMode(null);
      }
      redrawDrawings();
    }
    function handlePointMove(x, y) {
      if (!drawMode || !pendingP1) return;
      const from = pointToPx(pendingP1);
      if (!from) return;
      if (drawMode === 'trendline') {
        redrawDrawings({ line: [from, { x, y }], isPreview: true });
      } else if (drawMode === 'measure') {
        const pt = pxToPoint(x, y);
        if (pt) redrawDrawings({ measure: [pendingP1, pt, from, { x, y }] });
      }
    }

    drawCanvas.addEventListener('mousedown', (ev) => { const { x, y } = eventXY(ev); handlePointDown(x, y); });
    drawCanvas.addEventListener('mousemove', (ev) => { const { x, y } = eventXY(ev); handlePointMove(x, y); });
    drawCanvas.addEventListener('touchstart', (ev) => {
      ev.preventDefault();
      const { x, y } = touchXY(ev);
      handlePointDown(x, y);
    }, { passive: false });
    drawCanvas.addEventListener('touchmove', (ev) => {
      ev.preventDefault();
      const { x, y } = touchXY(ev);
      handlePointMove(x, y);
    }, { passive: false });

    function resizeDrawCanvas() {
      const w = drawCanvas.clientWidth || document.getElementById('bh-chart').clientWidth;
      const h = drawCanvas.clientHeight || document.getElementById('bh-chart').clientHeight;
      if (!w || !h) return;
      const dpr = window.devicePixelRatio || 1;
      drawCanvas.width = Math.round(w * dpr);
      drawCanvas.height = Math.round(h * dpr);
      drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      hideDeleteButton();
      redrawDrawings();
    }
    resizeDrawCanvas();
    new ResizeObserver(resizeDrawCanvas).observe(document.getElementById('bh-chart'));
    // 팬·줌(범위버튼·확대축소버튼 포함) 때마다 좌표가 바뀌므로 다시 그린다. 삭제 버튼은
    // 이전 좌표 기준으로 떠 있던 것이라 범위가 바뀌면 위치가 어긋나므로 함께 숨긴다.
    chart.timeScale().subscribeVisibleLogicalRangeChange(() => { hideDeleteButton(); redrawDrawings(); });
  }

  function pxToPoint(x, y) {
    const time = chart.timeScale().coordinateToTime(x);
    const price = seriesRefs.QQQ.coordinateToPrice(y);
    if (time == null || price == null) return null;
    return { time: timeToDateStr(time) || time, price };
  }

  function pointToPx(pt) {
    const x = chart.timeScale().timeToCoordinate(pt.time);
    const y = seriesRefs.QQQ.priceToCoordinate(pt.price);
    if (x == null || y == null) return null;
    return { x, y };
  }

  // 그림 하나를 탭/클릭했을 때 판별하는 히트테스트 — 추세선은 선분까지의 거리,
  // 가격범위는 박스 안쪽(여유 패딩 포함) 여부로 판정. 여러 그림이 겹치면 나중에
  // 그려진(=배열 뒤쪽) 것을 우선한다.
  const DELETE_HIT_PADDING = 10;

  function distToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = ax + t * dx, cy = ay + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  function hitTestDrawings(x, y) {
    for (let i = drawings.length - 1; i >= 0; i--) {
      const d = drawings[i];
      const a = pointToPx(d.p1), b = pointToPx(d.p2);
      if (!a || !b) continue;
      if (d.type === 'trendline') {
        if (distToSegment(x, y, a.x, a.y, b.x, b.y) <= DELETE_HIT_PADDING) return d;
      } else if (d.type === 'measure') {
        const x0 = Math.min(a.x, b.x) - DELETE_HIT_PADDING, x1 = Math.max(a.x, b.x) + DELETE_HIT_PADDING;
        const y0 = Math.min(a.y, b.y) - DELETE_HIT_PADDING, y1 = Math.max(a.y, b.y) + DELETE_HIT_PADDING;
        if (x >= x0 && x <= x1 && y >= y0 && y <= y1) return d;
      }
    }
    return null;
  }

  function showDeleteButton(drawing, x, y) {
    if (!deleteBtn) return;
    deleteTarget = drawing;
    deleteBtn.style.left = Math.round(x - 15) + 'px';
    deleteBtn.style.top = Math.round(y - 45) + 'px'; // 누른 지점 바로 위 — 손가락에 안 가려지게
    deleteBtn.style.display = 'flex';
  }

  function hideDeleteButton() {
    deleteTarget = null;
    if (deleteBtn) deleteBtn.style.display = 'none';
  }

  const DRAW_LINE_COLOR = IS_DARK ? '#0A84FF' : '#0071E3'; // QQQ와 동일 톤 — 새 색 추가 없이 기존 팔레트 재사용

  function drawTrendLine(a, b, isPreview) {
    if (!a || !b) return;
    drawCtx.save();
    drawCtx.strokeStyle = DRAW_LINE_COLOR;
    drawCtx.lineWidth = 2;
    if (isPreview) drawCtx.setLineDash([5, 4]);
    drawCtx.beginPath();
    drawCtx.moveTo(a.x, a.y);
    drawCtx.lineTo(b.x, b.y);
    drawCtx.stroke();
    drawCtx.setLineDash([]);
    drawCtx.fillStyle = DRAW_LINE_COLOR;
    [a, b].forEach(p => {
      drawCtx.beginPath();
      drawCtx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
      drawCtx.fill();
    });
    drawCtx.restore();
  }

  function drawMeasureBox(p1, p2, apx, bpx) {
    if (!apx || !bpx) return;
    const pctChange = p1.price !== 0 ? ((p2.price - p1.price) / Math.abs(p1.price)) * 100 : 0;
    const d1 = new Date((typeof p1.time === 'string' ? p1.time : timeToDateStr(p1.time)) + 'T00:00:00Z');
    const d2 = new Date((typeof p2.time === 'string' ? p2.time : timeToDateStr(p2.time)) + 'T00:00:00Z');
    const days = Math.abs(Math.round((d2 - d1) / 86400000));
    const up = pctChange >= 0;
    const color = up ? COLORS.green : COLORS.red;
    const x0 = Math.min(apx.x, bpx.x), x1 = Math.max(apx.x, bpx.x);
    const y0 = Math.min(apx.y, bpx.y), y1 = Math.max(apx.y, bpx.y);
    drawCtx.save();
    drawCtx.fillStyle = color + '26';
    drawCtx.fillRect(x0, y0, x1 - x0, y1 - y0);
    drawCtx.strokeStyle = color;
    drawCtx.lineWidth = 1.5;
    drawCtx.setLineDash([4, 3]);
    drawCtx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    drawCtx.setLineDash([]);
    const label = `${up ? '+' : ''}${pctChange.toFixed(2)}%  ${days}${T.dayUnit}`;
    drawCtx.font = '700 13px -apple-system, BlinkMacSystemFont, sans-serif';
    const tw = drawCtx.measureText(label).width;
    const labelX = (bpx.x >= apx.x) ? Math.max(x0 + 6, x1 - tw - 6) : x0 + 6;
    const labelY = (bpx.y <= apx.y) ? y0 + 16 : y1 - 6;
    drawCtx.fillStyle = color;
    drawCtx.fillText(label, labelX, labelY);
    drawCtx.restore();
  }

  function redrawDrawings(preview) {
    if (!drawCtx) return;
    const w = drawCanvas.clientWidth, h = drawCanvas.clientHeight;
    drawCtx.clearRect(0, 0, w, h);
    drawings.forEach(d => {
      if (d.type === 'trendline') drawTrendLine(pointToPx(d.p1), pointToPx(d.p2));
      else if (d.type === 'measure') drawMeasureBox(d.p1, d.p2, pointToPx(d.p1), pointToPx(d.p2));
    });
    if (preview && preview.line) drawTrendLine(preview.line[0], preview.line[1], preview.isPreview);
    if (preview && preview.measure) drawMeasureBox(preview.measure[0], preview.measure[1], preview.measure[2], preview.measure[3]);
  }

  function buildRangeButtons() {
    const ranges = [6, 12, 24, 36, 48, null].map((m, i) => ({ label: T.ranges[i], months: m }));
    // 모바일은 화면이 좁아 1년 기본값이면 차트가 너무 촘촘해 보인다 — 기본 6개월로 완화
    const defaultMonths = IS_MOBILE ? 6 : 12;
    const wrap = document.getElementById('bh-range-btns');
    wrap.innerHTML = ranges.map((r) =>
      `<button class="bh-range-btn${r.months === defaultMonths ? ' active' : ''}" data-months="${r.months === null ? '' : r.months}">${r.label}</button>`
    ).join('');
    wrap.querySelectorAll('.bh-range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('.bh-range-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const months = btn.dataset.months ? parseInt(btn.dataset.months, 10) : null;
        applyRange(months, selectedDate);
      });
    });
    applyRange(defaultMonths, null);
  }

  function monthsBetween(d1, d2) {
    const a = new Date(d1 + 'T00:00:00Z'), b = new Date(d2 + 'T00:00:00Z');
    return Math.max(1, (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + (b.getUTCMonth() - a.getUTCMonth()));
  }

  function addMonths(dateStr, delta) {
    const d = new Date(dateStr + 'T00:00:00Z');
    d.setUTCMonth(d.getUTCMonth() + delta);
    return d.toISOString().slice(0, 10);
  }

  function findIdxForDate(targetDate) {
    const dates = chartData.dates;
    if (targetDate <= dates[0]) return 0;
    if (targetDate >= dates[dates.length - 1]) return dates.length - 1;
    for (let i = 0; i < dates.length; i++) {
      if (dates[i] >= targetDate) return i;
    }
    return dates.length - 1;
  }

  function applyRange(months, centerDate) {
    currentRangeMonths = months;
    currentCenterDate = centerDate || null;
    const dates = chartData.dates;
    if (months === null) {
      chart.timeScale().setVisibleRange({ from: dates[0], to: dates[dates.length - 1] });
      return;
    }
    const centerStr = centerDate || dates[dates.length - 1];
    let fromStr, toStr;
    if (centerDate) {
      const half = months / 2;
      fromStr = addMonths(centerStr, -half);
      toStr = addMonths(centerStr, half);
    } else {
      fromStr = addMonths(centerStr, -months);
      toStr = centerStr;
    }
    const fromIdx = Math.max(0, findIdxForDate(fromStr));
    const toIdx = Math.min(dates.length - 1, findIdxForDate(toStr));
    chart.timeScale().setVisibleRange({ from: dates[fromIdx], to: dates[toIdx] });
  }

  function zoomChart(factor) {
    const dates = chartData.dates;
    const fullSpanMonths = monthsBetween(dates[0], dates[dates.length - 1]);
    let months = currentRangeMonths === null ? fullSpanMonths : currentRangeMonths;
    months = Math.max(1, Math.min(fullSpanMonths, Math.round(months * factor)));
    document.querySelectorAll('.bh-range-btn').forEach(b => b.classList.remove('active'));
    applyRange(months, currentCenterDate);
  }

  function shiftMonth(delta) {
    calMonth += delta;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  }

  function renderCalendar() {
    document.getElementById('bh-cal-title').textContent =
      fmt(T.calTitle, { y: calYear, m: T.months[calMonth] });

    const first = new Date(Date.UTC(calYear, calMonth, 1));
    const startDow = first.getUTCDay();
    const daysInMonth = new Date(Date.UTC(calYear, calMonth + 1, 0)).getUTCDate();
    const todayStr = new Date().toISOString().slice(0,10);

    let cells = '';
    for (let i = 0; i < startDow; i++) cells += '<div class="bh-cal-cell empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const ev = eventsByDate[dateStr];
      const show = ev && (!majorOnly || ev.importance === 3);
      const isToday = dateStr === todayStr;
      const isSelected = dateStr === selectedDate;
      let dotHtml = '';
      if (show) {
        const cls = ev.importance === 3 ? '' : (ev.importance === 2 ? ' bh-dot-notable' : ' bh-dot-log');
        const style = ev.importance === 3 ? ' style="background:var(--ez-blue)"' : '';
        dotHtml = `<span class="bh-cal-dots"><span class="bh-cal-dot-mark${cls}"${style}></span></span>`;
      }
      cells += `<div class="bh-cal-cell${show ? ' has-event' : ''}${isSelected ? ' selected' : ''}" data-date="${dateStr}">
        <span class="${isToday ? 'bh-cal-today' : ''}">${d}</span>${dotHtml}
      </div>`;
    }
    const grid = document.getElementById('bh-cal-grid');
    grid.innerHTML = cells;
    grid.querySelectorAll('.bh-cal-cell.has-event').forEach(cell => {
      cell.addEventListener('click', () => {
        if (cell.dataset.date === selectedDate) { clearSelection(); return; }
        selectDate(cell.dataset.date);
      });
    });
  }

  function clearSelection() {
    selectedDate = null;
    listShown = LIST_PAGE;
    renderCalendar();
    renderEventList();
  }

  /* dateStr 날짜를 차트 한가운데에 놓고 달력·목록도 그 날짜로 맞춘다.
     scrollTo 로 어디를 보여줄지 고른다 — 목록에서 눌렀으면 차트를 보여줘야
     하고(그게 누른 이유다), 차트 마커나 달력에서 눌렀으면 목록을 보여준다. */
  function selectDate(dateStr, scrollTo) {
    selectedDate = dateStr;
    const d = new Date(dateStr + 'T00:00:00Z');
    calYear = d.getUTCFullYear();
    calMonth = d.getUTCMonth();
    renderCalendar();
    renderEventList();
    if (chartOK) applyRange(6, dateStr);   // 6개월 창의 정중앙에 그 날짜가 온다
    document.querySelectorAll('.bh-range-btn').forEach(b => b.classList.remove('active'));
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var behavior = calm ? 'auto' : 'smooth';
    setTimeout(() => {
      if (scrollTo === 'chart') {
        const card = document.querySelector('.bh-chart-card');
        if (card) card.scrollIntoView({ behavior: behavior, block: 'start' });
        return;
      }
      const item = document.querySelector(`.bh-event-item[data-date="${dateStr}"]`);
      if (item) item.scrollIntoView({ behavior: behavior, block: 'center' });
    }, 50);
  }

  function fmtPct(v) {
    if (typeof v !== 'number') return '';
    const sign = v >= 0 ? '+' : '';
    return `${sign}${v.toFixed(2)}%`;
  }

  function renderMoves(moves) {
    if (!moves) return '';
    return Object.entries(moves).map(([sym, v]) => {
      if (typeof v !== 'number') return '';
      const cls = v >= 0 ? 'up' : 'down';
      return `<span class="bh-move-pill ${cls}">${sym} ${fmtPct(v)}</span>`;
    }).join('');
  }

  /* 그날 올라간 글 목록. 제목이 곧 링크다 — 카드 아래 '원문 보기'를 여러 개
     늘어놓는 것보다 무엇을 여는지가 분명하다. */
  function renderArticleList(items, heading) {
    if (!items || !items.length) return '';
    const head = heading ? `<div class="bh-article-head">${escapeHtml(heading)}</div>` : '';
    // 링크가 없는 판(번역본)에서는 글자만 남긴다 — href="undefined" 를 만들지 않는다
    const li = items.map(a => a.u
      ? `<li><a href="${a.u}" target="_blank" rel="noopener">${escapeHtml(a.t)}</a></li>`
      : `<li>${escapeHtml(a.t)}</li>`
    ).join('');
    return `${head}<ul class="bh-article-list">${li}</ul>`;
  }

  function renderEventCard(e, highlight) {
    const badge = e.importance === 3
      ? '<span class="bh-badge major">' + T.badgeMajor + '</span>'
      : e.importance === 2
        ? '<span class="bh-badge notable">' + T.badgeNotable + '</span>'
        : '<span class="bh-badge log">' + T.badgeLog + '</span>';
    // 그날 글이 하나뿐이면 제목줄이 곧 그 글이다 — 목록으로 한 번 더 쓰지 않고
    // 아래 '원문 보기'만 붙인다. 둘 이상일 때만 목록이 의미가 있다.
    const many = e.articles && e.articles.length > 1;
    const showFootLink = e.link && !many;
    const sourceTag = showFootLink
      ? `<a class="bh-event-link" href="${e.link}" target="_blank" rel="noopener">${T.readOriginal}</a>`
      : '';
    // 2024-10-29 이후 이슈는 summaryGroups(소제목+닷블릿) 구조로 표시,
    // 그 이전 이슈는 기존 한 문장 요약(summary) 그대로 유지
    const bodyHtml = (e.summaryGroups && e.summaryGroups.length)
      ? renderSummaryGroups(e.summaryGroups)
      : (e.summary ? `<div class="bh-event-summary">${escapeHtml(e.summary)}</div>` : '');
    const articlesHtml = (many ? renderArticleList(e.articles) : '')
      + renderArticleList(e.moreArticles, T.otherArticles);
    // 등락은 날짜 바로 아래에 둔다 — 그날을 고른 이유가 대개 '얼마나 움직였나'라
    // 제목보다 먼저 눈에 들어와야 한다. 값이 없는 날은 빈 줄을 만들지 않는다.
    const moves = renderMoves(e.moves);
    /* 여러 건이 한 날에 몰린 기록 카드의 제목은 데이터가 아니라 사전에서 만든다.
       '이 날의 글 2건' 같은 자동 생성 문구를 번역기에 태우면 언어마다 제각각으로
       돌아온다(실제로 일본어판에 영어가 섞였다). 숫자는 화면이 세면 된다. */
    const title = (many && e.source === 'own_archive')
      ? fmt(T.dayLog, { n: e.articles.length })
      : e.title;
    return `<div class="bh-event-item${highlight ? ' highlight' : ''}" data-date="${e.date}">
      <div class="bh-event-top">
        <span class="bh-event-date">${e.date}</span>
        ${badge}
      </div>
      ${moves ? `<div class="bh-event-moves">${moves}</div>` : ''}
      <div class="bh-event-title">${escapeHtml(title)}</div>
      ${bodyHtml}
      ${articlesHtml}
      ${sourceTag ? `<div class="bh-event-foot">${sourceTag}</div>` : ''}
    </div>`;
  }

  function renderSummaryGroups(groups) {
    const groupsHtml = groups.map(g => {
      const titleHtml = g.heading ? `<div class="bh-event-group-title">${escapeHtml(g.heading)}</div>` : '';
      const pointsHtml = (g.points || []).map(p => `<li>${escapeHtml(p)}</li>`).join('');
      return `<div class="bh-event-group">${titleHtml}<ul class="bh-event-group-list">${pointsHtml}</ul></div>`;
    }).join('');
    return `<div class="bh-event-groups">${groupsHtml}</div>`;
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderEventList() {
    const listEl = document.getElementById('bh-events-list');
    const titleEl = document.getElementById('bh-events-title');
    const countEl = document.getElementById('bh-events-count');
    let pool = majorOnly ? eventsData.filter(e => e.importance === 3) : eventsData;

    if (selectedDate) {
      // 전후 1일씩, 총 3일치만 — 더 넓게 훑어보고 싶으면 아래 달력으로 다른 날짜를 고르면 된다.
      const target = new Date(selectedDate + 'T00:00:00Z').getTime();
      const nearby = pool.filter(e => {
        const t = new Date(e.date + 'T00:00:00Z').getTime();
        return Math.abs(t - target) <= 1 * 86400000;
      }).sort((a,b) => Math.abs(new Date(a.date)-target) - Math.abs(new Date(b.date)-target));
      titleEl.textContent = fmt(T.nearTitle, { date: selectedDate });
      countEl.textContent = fmt(T.nearCount, { n: nearby.length });
      listEl.innerHTML = nearby.length
        ? nearby.map(e => renderEventCard(e, e.date === selectedDate)).join('')
        : '<div class="bh-empty">' + T.emptyNear + '</div>';
      return;
    }

    titleEl.textContent = T.allTitle;
    countEl.textContent = fmt(T.countUnit, { n: pool.length });
    /* 전체 목록은 수백 건이라 한 번에 다 그리면 첫 화면이 늦어진다(특히 모바일).
       최신분부터 끊어서 보여주고, 더 보고 싶을 때만 이어 붙인다. */
    const shown = Math.min(listShown, pool.length);
    listEl.innerHTML = pool.slice(0, shown).map(e => renderEventCard(e, false)).join('')
      + (shown < pool.length
        ? `<div class="bh-more-row"><button type="button" class="bh-more-btn" id="bh-more-btn">${fmt(T.moreBtn, { n: pool.length - shown })}</button></div>`
        : '');
    const moreBtn = document.getElementById('bh-more-btn');
    if (moreBtn) moreBtn.addEventListener('click', () => { listShown += LIST_PAGE; renderEventList(); });
  }
})();
</script>

</body>
</html>
