  Q9:{id:'Q9',cluster:3,cname:'정보 소비',text:'특정 유명 투자자나 펀드가 좋은 성과를 냈다는 이유로 그들의 포트폴리오나 추천 종목을 모방해 매수한 경험이 있는가.',lowLabel:'전혀 없다',highLabel:'자주 있다',reverse:false,next:()=>'Q10',score:(v)=>v,label:'스타 매니저 추종',tip:"그들의 과거 성과는 당신의 미래 수익이 아니다. 공개된 포트폴리오는 이미 '이전 분기'의 것이고, 추종하는 순간 당신은 후행 매수자가 된다.",show:(v)=>v>=3},
  Q10:{id:'Q10',cluster:4,cname:'포트폴리오 구조',text:'현재 내 계좌에 보유 중인 종목 또는 ETF가 10개 이상이며, 그 중 일부는 왜 샀는지 지금 즉시 설명하기 어려운 것들이 포함되어 있는가.',lowLabel:'전혀 아니다',highLabel:'매우 그렇다',reverse:false,next:(v)=>v>=4?'Q11':'Q13',score:(v)=>v,label:'포트폴리오 과부하',tip:'10개가 넘어가면 분산투자가 아니라 혼돈이다. 왜 샀는지 모르는 종목은 언제 팔아야 할지도 모른다는 뜻이고, 보통 가장 나쁜 타이밍에 팔게 된다.',show:(v)=>v>=3},
  Q11:{id:'Q11',cluster:4,cname:'포트폴리오 구조',text:'연 10% 이상의 월배당을 지급하는 상품(QYLD, JEPI, JEPQ 등)을 보유 중이거나, 그 배당률이 매력적으로 느껴져 매수를 고려한 적이 있는가.',lowLabel:'전혀 없다',highLabel:'매우 그렇다',reverse:false,next:(v)=>v>=4?'Q12':'Q13',score:(v)=>v,label:'커버드콜·고배당 착시',tip:'연 10% 배당은 원금의 10%를 매년 조각내서 돌려주는 구조일 수 있다. 배당을 받는 동안 NAV(순자산가치)가 같은 속도로 낮아지는지 먼저 확인해야 한다.',show:(v)=>v>=3},
  Q12:{id:'Q12',cluster:4,cname:'포트폴리오 구조',text:'3배 레버리지 ETF(TQQQ, SOXL 등)를 장기 적립식으로 모으면 결국 이길 수 있다고 생각하거나, 실제로 그렇게 실행하고 있는가.',lowLabel:'전혀 아니다',highLabel:'그렇게 한다',reverse:false,next:()=>'Q13',score:(v)=>Math.round(v*1.2),label:'레버리지 장기 적립',tip:"변동성 감쇠(volatility decay)라는 수학적 현실이 있다. 지수가 -50% 후 +100% 회복하면 원금이지만, 3배 레버리지는 -150%가 되어 회복 자체가 불가능하다. '장기 적립하면 된다'는 말이 통하는 상품이 아니다.",show:(v)=>v>=3},
  Q13:{id:'Q13',cluster:5,cname:'리스크 관리 기초',text:'갑작스러운 실직·병원비·예상치 못한 지출이 발생해도, 주식을 팔지 않고 6개월 이상 생활 가능한 현금 또는 예금이 지금 있는가.',lowLabel:'전혀 없다',highLabel:'충분히 있다',reverse:true,next:()=>'Q15',score:(v)=>6-v,label:'현금 버퍼 부재',tip:'폭락장에서 손절하는 사람들 중 상당수는 시황 판단이 아니라 생활비가 없어서 어쩔 수 없이 파는 경우다. 현금 버퍼가 없으면 최악의 타이밍에 강제 매도가 발생한다.',show:(v)=>v<=2},
  Q15:{id:'Q15',cluster:5,cname:'리스크 관리 기초',text:'보유 자산별로 "이 상황이 오면 추가 매수한다" 또는 "이 상황이 오면 매도한다"는 행동 기준을 문서나 노트로 작성해둔 것이 있는가.',lowLabel:'전혀 없다',highLabel:'잘 갖춰져 있다',reverse:true,next:()=>'RESULT',score:(v)=>6-v,label:'투자 지침 미기록',tip:'패닉은 반드시 온다. 규칙이 없으면 감정이 결정한다. 폭락장 한가운데에서 냉정한 기준을 세울 수 있는 사람은 거의 없다. 기준은 평온할 때 써두어야 한다.',show:(v)=>v<=2}
};

// ================================================================
// 상태
// ================================================================
let S={};
function reset(){S={current:null,history:[],answers:{},scoreMap:{},patterns:[],total:0};}

// ================================================================
// 점수
// ================================================================
function applyScore(qid,val){
  const q=BANK[qid];
  if(S.scoreMap[qid]!==undefined){S.total-=S.scoreMap[qid];S.patterns=S.patterns.filter(p=>p.qid!==qid);delete S.scoreMap[qid];}
  const pts=q.score(val);S.scoreMap[qid]=pts;S.total+=pts;
  if(q.show(val)){S.patterns.push({qid,label:q.label,tip:q.tip});}
}
function removeScore(qid){
  if(S.scoreMap[qid]!==undefined){S.total-=S.scoreMap[qid];S.patterns=S.patterns.filter(p=>p.qid!==qid);delete S.scoreMap[qid];}
  delete S.answers[qid];
}

// ================================================================
// 네비게이션
// ================================================================
function startQuiz(){
  reset();S.current='Q1';
  document.getElementById('prog-rail').style.display='block';
  document.getElementById('back-btn').style.display='flex';
  transit(()=>renderQ('Q1'));
}
function goBack(){
  if(S.history.length===0){
    document.getElementById('prog-rail').style.display='none';
    document.getElementById('back-btn').style.display='none';
    document.getElementById('prog-fill').style.width='0%';
    transit(()=>renderIntro());return;
  }
  removeScore(S.current);const prev=S.history.pop();S.current=prev;updateProg();transit(()=>renderQ(prev));
}
function submit(qid,val){
  S.answers[qid]=val;applyScore(qid,val);
  const next=BANK[qid].next(val);updateProg();
  if(next==='RESULT'){
    document.getElementById('back-btn').style.display='none';
    document.getElementById('prog-fill').style.width='100%';
    setTimeout(()=>transit(()=>renderResult()),170);return;
  }
  S.history.push(qid);S.current=next;
  setTimeout(()=>transit(()=>renderQ(next)),200);
}
function updateProg(){document.getElementById('prog-fill').style.width=Math.min(((S.history.length+1)/18)*93,93)+'%';}

function transit(fn){
  const app=document.getElementById('app');const old=app.querySelector('.screen');
  if(old){old.classList.add('exit');setTimeout(()=>fn(),210);}else fn();
}

// ================================================================
// 렌더: 도입
// ================================================================
function renderIntro(){
  window.scrollTo({top:0,behavior:'instant'});
  document.getElementById('app').innerHTML=`
<div class="screen">
  <p class="i-badge">투자 행동 자가진단</p>
  <h1 class="i-title">나는 얼마나<br>위험한<br>투자자인가</h1>
  <p class="i-sub">솔직하게 답해도 됩니다. 계좌는 이미 알고 있습니다.<br>투자 실패의 대부분은 종목 선택이 아니라 행동 오작동에서 시작됩니다.</p>
  <button class="btn-start" onclick="startQuiz()">진단 시작하기</button>
  <p class="i-meta">약 3~6분 &nbsp;·&nbsp; 9~18개 질문 &nbsp;·&nbsp; 결과 저장 없음</p>
</div>`;
}

// ================================================================
// 렌더: 질문
// ================================================================
function renderQ(qid){
  window.scrollTo({top:0,behavior:'instant'});
  const q=BANK[qid];const pv=S.answers[qid];
  let dots='';
  for(let i=1;i<=5;i++){
    const isActive=pv===i;
    const ac=isActive?(q.reverse?'rev-active':'active'):'';
    dots+=`<button class="scale-btn ${ac}" onclick="handleScale('${qid}',${i},this,${q.reverse})">${i}</button>`;
  }
  document.getElementById('app').innerHTML=`
<div class="screen">
  <p class="q-cluster">클러스터 ${q.cluster} — ${q.cname}</p>
  <p class="q-text">${q.text}</p>
  <div class="scale-wrap">
    <div class="scale-labels"><span>${q.lowLabel}</span><span>${q.highLabel}</span></div>
    <div class="scale-row">${dots}</div>
  </div>
</div>`;
}
function handleScale(qid,val,btn,isReverse){
  const row=btn.parentElement;
  row.querySelectorAll('.scale-btn').forEach(b=>{b.classList.remove('active','rev-active');b.style.pointerEvents='none';});
  btn.classList.add(isReverse?'rev-active':'active');submit(qid,val);
}

// ================================================================
// 지배 클러스터 감지 (클러스터 5 제외 — 필수 역산 문항이라 거의 모두 높음)
// ================================================================
function getDominantCluster(){
  const branchMap={Q2:1,Q3:1,Q5:2,Q6:2,Q8:3,Q9:3,Q11:4,Q12:4};
  const gateMap={Q1:1,Q4:2,Q7:3,Q10:4};
  const branches={1:0,2:0,3:0,4:0};
  const gScores={1:0,2:0,3:0,4:0};
  Object.keys(S.answers).forEach(qid=>{if(branchMap[qid]) branches[branchMap[qid]]++;});
  Object.entries(S.scoreMap).forEach(([qid,pts])=>{if(gateMap[qid]) gScores[gateMap[qid]]=pts;});
  const maxBr=Math.max(...Object.values(branches));
  if(maxBr>0) return +Object.entries(branches).sort((a,b)=>b[1]-a[1]||+a[0]-+b[0])[0][0];
  return +Object.entries(gScores).sort((a,b)=>b[1]-a[1]||+a[0]-+b[0])[0][0];
}

// ================================================================
// 렌더: 결과
// ================================================================
function renderResult(){
  const score = S.total;
  const MAX = 71;

  // 등급 결정 (5단계: 0-14 / 15-24 / 25-35 / 36-50 / 51+)
  let gIdx;
  if(score<=14) gIdx=0;
  else if(score<=24) gIdx=1;
  else if(score<=35) gIdx=2;
  else if(score<=50) gIdx=3;
  else gIdx=4;
  const G = GRADES[gIdx];

  const domCluster = getDominantCluster();
  const gradeName = G.typeNames[domCluster];

  // ── 백분위 동적 계산 (5단계 분포 기반) ──
  let pctText;
  if(gIdx===0){
    const topPct = Math.max(1, Math.round(1 + (score/14)*7));
    pctText = `진단 참여자 상위 ${topPct}% 수준의 투자 행동 안정성`;
  } else if(gIdx===1){
    const pct = 100 - Math.round(8 + ((score-15)/9)*22);
    pctText = `진단 참여자의 약 ${pct}%보다 안정적인 행동 수준`;
  } else if(gIdx===2){
    const pct = Math.round(30 + ((score-25)/10)*35);
    pctText = `진단 참여자의 약 ${pct}%보다 위험한 투자 행동 수준`;
  } else if(gIdx===3){
    const pct = Math.round(65 + ((score-36)/14)*25);
    pctText = `진단 참여자의 약 ${pct}%보다 위험한 투자 행동 패턴`;
  } else {
    const pct = Math.min(99, Math.round(90 + ((score-51)/20)*9));
    pctText = `진단 참여자의 약 ${pct}%보다 위험한 고위험 투자 행동`;
  }

  // ── 게이지 SVG 생성 (5등분 존 방식 — 56px × 5 = 280px) ──
  const ZW5 = 56;
  const zC = ['#34C759','#7AB829','#FF9F0A','#FF6B2B','#FF3B30'];
  const zL = ['안정형','경계형','주의형','위험형','고위험형'];
  let markerX;
  if(gIdx===0)      markerX = Math.round((score/14)*ZW5);
  else if(gIdx===1) markerX = ZW5   + Math.round(((score-15)/9)*ZW5);
  else if(gIdx===2) markerX = 2*ZW5 + Math.round(((score-25)/10)*ZW5);
  else if(gIdx===3) markerX = 3*ZW5 + Math.round(((score-36)/14)*ZW5);
  else              markerX = 4*ZW5 + Math.min(Math.round(((score-51)/20)*ZW5), ZW5-2);
  markerX = Math.max(4, Math.min(markerX, 278));
  const mc = zC[gIdx];
  const zoneRects = zC.map((c,i)=>`<rect x="${10+i*ZW5}" y="18" width="${ZW5}" height="10" rx="0" fill="${c}" opacity="0.13"/>`).join('');
  const dividers  = [1,2,3,4].map(i=>`<rect x="${10+i*ZW5}" y="14" width="1.5" height="17" fill="white" opacity="0.9"/>`).join('');
  const zTexts    = zC.map((c,i)=>`<text x="${10+i*ZW5+ZW5/2}" y="48" text-anchor="middle" font-size="9" font-weight="700" fill="${c}" font-family="Pretendard,-apple-system,sans-serif">${zL[i]}</text>`).join('');

  const gaugeSVG = `
<svg class="gauge-svg" viewBox="0 0 300 52" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="18" width="280" height="10" rx="5" fill="#E5E5EA" opacity="0.5"/>
  ${zoneRects}
  <rect x="10" y="18" width="${markerX}" height="10" rx="5" fill="${mc}"/>
  ${dividers}
  <circle cx="${10+markerX}" cy="23" r="8" fill="white" stroke="${mc}" stroke-width="2.5"/>
  <circle cx="${10+markerX}" cy="23" r="3" fill="${mc}"/>
  ${zTexts}
</svg>`;

  // ── 분포 차트 (5단계 시뮬레이션) ──
  const distData = [
    {id:'g1', label:'안정형',   pct: 8, data:'~8%'},
    {id:'g2', label:'경계형',   pct:22, data:'~22%'},
    {id:'g3', label:'주의형',   pct:35, data:'~35%'},
    {id:'g4', label:'위험형',   pct:25, data:'~25%'},
    {id:'g5', label:'고위험형', pct:10, data:'~10%'},
  ];

  let distHTML = distData.map(d=>{
    const isMe = d.id === G.id;
    return `
<div class="dist-row">
  <span class="dist-label ${d.id}">${d.label}</span>
  <div class="dist-bar-track">
    <div class="dist-bar-fill ${d.id} ${isMe?'':'dim'}" style="width:0%" data-target="${d.pct}%">
      <span class="dist-bar-pct">${d.data}</span>
    </div>
  </div>
  <span class="dist-you">${isMe?'← 나':''}</span>
</div>`;
  }).join('');

  // ── 감지 패턴 ──
  let pHTML='';
  if(S.patterns.length===0){
    pHTML=`<div class="no-pattern">진단 범위 내에서 감지된 행동 오작동이 없다. 5가지 영역 모두 안정적인 패턴을 보이고 있다.</div>`;
  }else{
    S.patterns.forEach(p=>{pHTML+=`<div class="pattern-card"><p class="pattern-name">${p.label}</p><p class="pattern-tip">${p.tip}</p></div>`;});
  }

  // ── 다른 타입들 섹션 ──
  const clusterLabels={1:'감정 반응',2:'거래 행동',3:'정보 소비',4:'포트폴리오',5:'리스크 관리'};
  const reviewHTML = GRADES.map(g=>{
    const isMyGrade = g.id === G.id;
    const typesHTML = Object.entries(g.typeNames).map(([c,name])=>`
<div class="review-name-row">
  <span class="review-opt" style="${isMyGrade&&+c===domCluster?'background:var(--bl-s);color:var(--bl);':''}">${clusterLabels[c]}</span>
  <div>
    <div class="review-name-text" style="${isMyGrade&&+c===domCluster?'color:var(--bl);':''}">${name}${isMyGrade&&+c===domCluster?' ← 나':''}</div>
  </div>
</div>`).join('');
    return `
<div class="review-grade-card">
  <div class="review-grade-header">
    <span class="review-grade-badge ${g.id}">${g.label}</span>
    <span class="review-grade-range">${g.range}</span>
  </div>
  <div class="review-name-list">${typesHTML}</div>
  <div class="review-callout-box">
    <div class="review-callout-label">핵심 한 줄</div>
    <div class="review-callout-text">"${g.callout}"</div>
  </div>
</div>`;
  }).join('');

  // ── 최종 렌더 ──
  document.getElementById('app').innerHTML=`
<div class="screen">

  <!-- 히어로 등급 카드 -->
  <div class="r-hero ${G.id}">
    <p class="r-badge ${G.id}">${G.label}</p>
    <h2 class="r-grade">${gradeName}</h2>
    <p class="r-pct-line">${pctText}</p>
  </div>

  <!-- 게이지 -->
  <div class="gauge-wrap">
    <p class="gauge-title">위험 점수 위치 &nbsp;/&nbsp; ${score}점</p>
    ${gaugeSVG}
  </div>

  <!-- 분포 차트 -->
  <div class="dist-wrap">
    <p class="dist-title">다른 응답자들은? (시뮬레이션 기준)</p>
    ${distHTML}
  </div>

  <!-- 핵심 한 줄 -->
  <div class="r-callout ${G.id}">"${G.callout}"</div>

  <!-- 설명 -->
  <p class="r-desc">${G.desc}</p>

  <div class="r-divider"></div>
  <p class="r-section">감지된 행동 패턴</p>
  ${pHTML}

  <!-- 버튼 -->
  <button class="btn-retry" onclick="retryQuiz()">다시 진단하기</button>

  <!-- 크리에이터 검토 섹션 -->
  <button class="review-toggle" onclick="toggleReview(this)">
    <span>다른 등급들은 어떤 타입들이 있을까?</span>
    <span class="review-toggle-arrow">▾</span>
  </button>
  <div class="review-panel" id="review-panel">
    ${reviewHTML}
  </div>

</div>`;

  // 분포 바 애니메이션 (DOM 생성 후 실행)
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      document.querySelectorAll('.dist-bar-fill').forEach(el=>{
        el.style.width = el.dataset.target;
      });
    });
  });

  window.scrollTo({top:0,behavior:'instant'});
}

function toggleReview(btn){
  btn.classList.toggle('open');
  document.getElementById('review-panel').classList.toggle('open');
}

function retryQuiz(){
  document.getElementById('prog-rail').style.display='none';
  document.getElementById('back-btn').style.display='none';
  document.getElementById('prog-fill').style.width='0%';
  transit(()=>renderIntro());
}

reset();renderIntro();
</script>
