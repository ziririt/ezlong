<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
body{background:#070B18}
.card{
  background:
    radial-gradient(72% 56% at 90% 98%, rgba(154,74,58,.50) 0%, rgba(154,74,58,0) 68%),
    radial-gradient(120% 95% at 72% 2%, #26375F 0%, #141F3E 42%, #060A16 100%);
  color:#fff;
}
.copy{width:640px;padding-left:78px}
.eyebrow{color:#8FB6F2}
.title{font-size:74px;line-height:1.06;margin-bottom:28px}
.desc{color:rgba(255,255,255,.82);font-size:30px;max-width:572px;line-height:1.52}
.dot{background:#7FB2FF}
.stage{right:52px;top:56px}
.p-back{
  position:absolute;right:218px;top:66px;
  width:222px;height:480px;border-radius:34px;overflow:hidden;
  box-shadow:0 24px 56px rgba(0,0,0,.55);
  opacity:.30;filter:saturate(.55) brightness(.62);
}
.p-back img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
.p-main{width:316px;height:684px}
.hem{position:absolute;left:0;right:0;bottom:0;height:104px;z-index:4;
  background:linear-gradient(to bottom, rgba(6,10,22,0), rgba(6,10,22,.94))}
</style></head><body>
<div class="card">
  <div class="copy">
    <div class="eyebrow">시계 · 스탠바이 · 알람</div>
    <div class="title">Long Time,<br>Easy Life</div>
    <div class="desc">충전기에 꽂아 세워두면 큼직한 플립시계.<br>음악이 서서히 커지며 깨워 줍니다.</div>
    <div class="foot"><span class="dot"></span>ezlong.com/longtime</div>
  </div>
  <div class="stage">
    <div class="p-back"><img src="../../app/shots/lt-3.jpg"></div>
    <div class="phone p-main"><img src="../../app/shots/lt-1.jpg"></div>
  </div>
  <div class="hem"></div>
</div></body></html>
