<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
body{background:#0A1020}
.card{
  background:
    radial-gradient(60% 46% at 92% 92%, rgba(37,99,235,.34) 0%, rgba(37,99,235,0) 70%),
    radial-gradient(115% 90% at 20% 0%, #1D2A4C 0%, #121B33 44%, #080D1B 100%);
  color:#fff;
}
.copy{width:632px}
.eyebrow{color:#8FB6F2}
.title{font-size:72px;margin-bottom:34px}
.foot{color:#fff}
.dot{background:#7FB2FF}
.applist{display:flex;flex-direction:column;gap:20px}
.approw{display:flex;align-items:center;gap:18px}
.appico{width:60px;height:60px;border-radius:14px;flex:0 0 auto;
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
.appname{font-size:29px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.appkind{display:block;font-size:24px;font-weight:500;color:rgba(255,255,255,.62);margin-top:3px}
.stage{right:34px;top:66px;display:flex;gap:24px;align-items:flex-start}
.p{width:242px;height:526px;border-radius:38px;overflow:hidden;
  box-shadow:0 34px 74px rgba(0,0,0,.5), 0 0 0 1.5px rgba(255,255,255,.14)}
.p.lift{margin-top:-30px}
.p.light{border:6px solid #16223A;box-shadow:0 34px 74px rgba(0,0,0,.55)}
.p img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
.hem{position:absolute;left:0;right:0;bottom:0;height:88px;z-index:4;
  background:linear-gradient(to bottom, rgba(8,13,27,0), rgba(8,13,27,.92))}
</style></head><body>
<div class="card">
  <div class="copy">
    <div class="eyebrow">설치 없이 웹에서 바로</div>
    <div class="title" style="font-size:64px">EZLONG이 만든 앱</div>
    <div class="applist">
      <div class="approw">
        <img class="appico" src="../../time/icons/pwa-512.png">
        <div class="appname">Long Time, Easy Life<span class="appkind">큼직한 플립시계 · 기상 알람</span></div>
      </div>
      <div class="approw">
        <img class="appico" src="../../skybluenote/web/icons/Icon-512.png">
        <div class="appname">Skyblue Note<span class="appkind">AI 답변을 정리하는 노트</span></div>
      </div>
    </div>
    <div class="foot"><span class="dot"></span>ezlong.com/app</div>
  </div>
  <div class="stage">
    <div class="p lift"><img src="../../app/shots/lt-1.jpg"></div>
    <div class="p light"><img src="../../app/shots/sn-android.png"></div>
  </div>
  <div class="hem"></div>
</div></body></html>
