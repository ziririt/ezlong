    {
      "@type": "Question",
      "name": "연금저축과 IRP 중 어느 계좌가 세금 혜택이 더 크나요?",

        "@type": "Answer",

      }
    },
    {
      "@type": "Question",
      "name": "55세 이전에 연금저축을 해지하면 세금이 얼마나 나오나요?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "연금저축을 55세 이전에 중도 해지하면 세액공제 받은 납입금과 운용 수익 전체에 대해 기타소득세 16.5%(지방소득세 포함)가 부과됩니다. 세액공제를 받지 않은 원금 부분은 과세 대상에서 제외됩니다. 예를 들어 1,000만원을 납입해 세액공제를 받았고 수익이 200만원이라면, 1,200만원에 16.5%인 198만원을 세금으로 납부해야 합니다."

/* ─── BASE ───────────────────────────────────────────── */
html,body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--t1);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
/* 2026-07-04: overflow-x:hidden을 html,body에서 제거 — body 직계 자식인 .ez-nav의
   position:sticky가 깨지는 원인이었음. 가로 스크롤 방지는 body 바로 다음 wrapper div로 이전. */
a{text-decoration:none;color:inherit}
button,input,select{font-family:var(--font)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:3px}

/* ─── NAV ────────────────────────────────────────────── */
.nav{
  height:var(--nav-h);
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--bd);
  position:sticky;
  top:0;
  z-index:100;
}
@media(prefers-color-scheme:dark){.nav{background:rgba(28,28,30,.92)}}
.nav-inner{
  max-width:1120px;
  margin:0 auto;
  padding:0 24px;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.nav-logo img{height:28px;width:auto;display:block}
.nav-back{
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--bl);
  font-size:15px;
  font-weight:600;
  transition:opacity .15s;
}
.nav-back:hover{opacity:.75}
.nav-back svg{width:14px;height:14px;flex-shrink:0}
@media(max-width:560px){
  .nav-inner{padding:0 16px}
  .nav-back span{display:none}
}

/* ─── PAGE WRAPPER ───────────────────────────────────── */
.page{max-width:1120px;margin:0 auto;padding:0 24px 96px}
@media(max-width:560px){.page{padding:0 16px 72px}}

/* ─── HERO ───────────────────────────────────────────── */
.hero{padding:44px 0 36px}
.hero-eyebrow{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 12px;
  border-radius:100px;
  background:var(--pu-s);
  border:1px solid var(--pu-m);
  color:var(--pu);
  font-size:13px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:18px;
}
.hero-title{
  font-size:clamp(30px,5.5vw,52px);
  font-weight:900;
  letter-spacing:-.045em;
  line-height:1.08;
  color:var(--t1);
  margin-bottom:14px;
}
.hero-desc{
  font-size:16px;
  color:var(--t1);
  line-height:1.7;
}
.hero-desc+.hero-desc{margin-top:8px}

}

.panel-hd{

  align-items:center;

}

.panel-hd-title{

.ctrl{

  const sign = manwon < 0 ? '-' : '';
  const n = Math.abs(manwon);
  if (n >= 10000) return `${sign}${(n / 10000).toFixed(1).replace(/\.0$/, '')}억`;
  return `${sign}${(n / 1000).toFixed(1).replace(/\.0$/, '')}천만원`;
}

/* ─── ALLOCATION ─────────────────────────────────────── */
function getAllocation(capital, liquidity){
  const alloc = {pension:0, irp:0, isa:0, direct:0};
  if (liquidity === 'high') {
    alloc.isa = Math.min(capital, 2000);
    alloc.direct = Math.max(0, capital - alloc.isa);
  } else if (liquidity === 'normal') {
    alloc.pension = Math.min(capital, 600);
    alloc.isa = Math.min(Math.max(0, capital - alloc.pension), 2000);
    alloc.direct = Math.max(0, capital - alloc.pension - alloc.isa);
  } else {
    alloc.pension = Math.min(capital, 600);
    alloc.irp = Math.min(Math.max(0, capital - alloc.pension), 300);
    alloc.isa = Math.min(Math.max(0, capital - alloc.pension - alloc.irp), 2000);
    alloc.direct = Math.max(0, capital - alloc.pension - alloc.irp - alloc.isa);
  }
  return alloc;
}

/* ─── SIMULATION ENGINES ─────────────────────────────── */
function simulateDirect(schedule, totalReturn, dividendYield){
  const divTax = 0.154, capitalGainTax = 0.22, basicDeduction = 250;
  const priceGrowth = Math.max(-0.99, totalReturn - dividendYield);
  const yearly = [];
  let value = 0, basis = 0;
  for (let y = 1; y <= schedule.length; y++){
    const annual = schedule[y-1] || 0;
    value += annual; basis += annual;
    value = value * (1 + priceGrowth + dividendYield * (1 - divTax));
    const gain = Math.max(0, value - basis - basicDeduction);
    const afterTax = value - gain * capitalGainTax;
    yearly.push({year:y, gross:value, afterTax, tax:value-afterTax, basis});
  }
  return yearly;
}

function simulatePension(schedule, age, creditRate, totalReturn, dividendYield, liquidity){
  const yearly = [];
  let value = 0, contributionBasis = 0, creditedBasis = 0;
  const taxCreditCap = 900;
  for (let y = 1; y <= schedule.length; y++){
    const annual = schedule[y-1] || 0;
    const credited = Math.min(annual, taxCreditCap);
    const refund = credited * creditRate;
    value += annual + refund;
    contributionBasis += annual; creditedBasis += credited;
    value = value * (1 + totalReturn);
    const reaches55 = age + y >= 55;
    const forcedEarlyExit = liquidity !== 'low' && !reaches55;
    let afterTax, tax;
    if (forcedEarlyExit){
      const nonPenaltyBasis = Math.max(0, contributionBasis - creditedBasis);
      const taxableBase = Math.max(0, value - nonPenaltyBasis);
      tax = taxableBase * 0.165;
      afterTax = value - tax;
    } else {
      tax = value * 0.055;
      afterTax = value - tax;
    }
    yearly.push({year:y, gross:value, afterTax, tax, basis:contributionBasis});
  }
  return yearly;
}

function simulateIsa(schedule, totalReturn){
  const taxFree = 200, separateTax = 0.099;
  const yearly = [];
  let value = 0, basis = 0;
  for (let y = 1; y <= schedule.length; y++){
    const annual = schedule[y-1] || 0;
    value += annual; basis += annual;
    value = value * (1 + totalReturn);
    const gain = Math.max(0, value - basis - taxFree);
    const tax = gain * separateTax;
    yearly.push({year:y, gross:value, afterTax:value-tax, tax, basis});
  }
  return yearly;
}

function combineRows(rows){
  const years = rows.reduce((max, row) => Math.max(max, row.length), 0);
  return Array.from({length:years}, (_, i) => ({
    year:i+1,
    afterTax:rows.reduce((sum, row) => sum + (row[i]?.afterTax||0), 0),
    tax:rows.reduce((sum, row) => sum + (row[i]?.tax||0), 0),
    gross:rows.reduce((sum, row) => sum + (row[i]?.gross||0), 0),
    basis:rows.reduce((sum, row) => sum + (row[i]?.basis||0), 0)
  }));
}

/* ─── STAGE HELPERS ──────────────────────────────────── */
function makeDefaultStages(age, targetAge, count, amount){
  const totalYears = Math.max(1, targetAge - age + 1);
  return Array.from({length:count}, (_, i) => {
    const startOffset = Math.floor(totalYears * i / count);
    const endOffset   = Math.floor(totalYears * (i+1) / count) - 1;
    return {
      endAge: i === count-1 ? targetAge : age + Math.max(startOffset, endOffset),
      amount
    };
  });
}

function splitStageAtMidpoint(age, targetAge, stages, index){
  if (stages.length >= 4) return stages;
  const startAge = index === 0 ? age : stages[index-1].endAge + 1;
  const endAge   = stages[index].endAge;
  if (endAge <= startAge) return stages;
  const splitAge = Math.floor((startAge + endAge) / 2);
  const next = [];
  stages.forEach((stage, i) => {
    if (i === index){
      next.push({endAge:splitAge, amount:stage.amount});
      next.push({endAge, amount:stage.amount});
    } else {
      next.push({...stage});
    }
  });
  next[next.length-1].endAge = targetAge;
  return next;
}

function normalizeStages(age, targetAge, count, rawStages, amount){
  const defaults = makeDefaultStages(age, targetAge, count, amount);
  let minEnd = age;
  return defaults.map((stage, i) => {
    const raw    = rawStages[i] || {};
    const maxEnd = i === count-1 ? targetAge : targetAge - (count-i-1);
    const endAge = i === count-1 ? targetAge : clamp(Number(raw.endAge ?? stage.endAge), minEnd, maxEnd);
    minEnd = endAge + 1;
    return {endAge, amount:Number(raw.amount ?? stage.amount)};
  });
}

function scheduleFromStages(age, years, stages){
  return Array.from({length:years}, (_, i) => {
    const currentAge = age + i;
    return stages.find(s => currentAge <= s.endAge)?.amount || stages.at(-1)?.amount || 0;
  });
}

/* ─── SCENARIO BUILDER ───────────────────────────────── */
function buildScenario({age, schedule, income, liquidity, totalReturnPct, dividendPct}){
  const totalReturn   = totalReturnPct / 100;
  const dividendYield = dividendPct / 100;
  const creditRate    = income === 'low' ? 0.165 : 0.132;
  const firstAnnual   = schedule[0] || 0;
  const alloc         = getAllocation(firstAnnual, liquidity);

  const directOnly  = simulateDirect(schedule, totalReturn, dividendYield);
  const pensionOnly = simulatePension(schedule, age, creditRate, totalReturn, dividendYield, liquidity);

  const isaSchedule     = schedule.map(a => Math.min(a, 2000));
  const isaRestSchedule = schedule.map(a => Math.max(0, a - 2000));
  const isaOnly = combineRows([
    simulateIsa(isaSchedule, totalReturn),
    simulateDirect(isaRestSchedule, totalReturn, dividendYield)
  ]);

  const pensionSched = [], isaBlendSched = [], directBlendSched = [];
  schedule.forEach(annual => {
    const y = getAllocation(annual, liquidity);
    pensionSched.push(y.pension + y.irp);
    isaBlendSched.push(y.isa);
    directBlendSched.push(y.direct);
  });
  const blend = combineRows([
    simulateDirect(directBlendSched, totalReturn, dividendYield),
    simulatePension(pensionSched, age, creditRate, totalReturn, dividendYield, liquidity),
    simulateIsa(isaBlendSched, totalReturn)
  ]);

  return {alloc, directOnly, pensionOnly, isaOnly, blend, creditRate};
}

/* ─── CHART ──────────────────────────────────────────── */
function Chart({series, years}){
  const [vw, setVw] = useState(() => typeof window !== 'undefined' ? window.innerWidth : 900);
  useEffect(()=>{
    const fn = () => setVw(window.innerWidth);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);

  const mobile = vw < 600;
  const w      = mobile ? 480 : 900;
  const h      = mobile ? 460 : 580;
  const pad    = mobile ? {l:50,r:82,t:20,b:42} : {l:58,r:105,t:26,b:46};
  const axisFS = mobile ? 15 : 13;
  const endFS  = mobile ? 17 : 15;
  const minGap = mobile ? 26 : 34;
  const ptR    = mobile ? 4  : 4.5;

  const innerW = w - pad.l - pad.r;
  const innerH = h - pad.t - pad.b;
  const allValues = series.flatMap(s => s.rows.map(r => r.afterTax));
  const maxV = Math.max(1000, ...allValues) * 1.08;
  const cx = yr  => pad.l + (yr - 1) / Math.max(1, years - 1) * innerW;
  const cy = val => pad.t + innerH - (val / maxV) * innerH;
  const pathFor = rows => rows.map((r,i) => `${i?'L':'M'}${cx(r.year).toFixed(1)},${cy(r.afterTax).toFixed(1)}`).join(' ');
  const ticks = [0,.25,.5,.75,1].map(t => Math.round(maxV * t));
  const endLabels = series.map((s,i) => {
    const last = s.rows[s.rows.length-1];
    return {s, i, last, baseY:cy(last.afterTax)};
  }).sort((a,b) => a.baseY - b.baseY);
  for (let i=1; i<endLabels.length; i++){
    if (endLabels[i].baseY - endLabels[i-1].baseY < minGap)
      endLabels[i].baseY = endLabels[i-1].baseY + minGap;
  }
  const labelByKey = Object.fromEntries(endLabels.map(item => [item.s.key, item]));
  return (
    <svg viewBox={`0 0 ${w} ${h}`} role="img" aria-label="계좌별 세후 자산 추이 비교">
      {ticks.map(tick => (
        <g key={tick}>
          <line className="grid-line" x1={pad.l} x2={w-pad.r} y1={cy(tick)} y2={cy(tick)} />
          <text className="axis-label" style={{fontSize:axisFS}} x={pad.l-6} y={cy(tick)+4} textAnchor="end">{fmtShort(tick)}</text>
        </g>
      ))}
      {[1, Math.ceil(years/2), years].filter((y,i,arr) => arr.indexOf(y)===i).map(yr => (
        <text key={yr} className="axis-label" style={{fontSize:axisFS}} x={cx(yr)} y={h-8} textAnchor="middle">{yr}년</text>
      ))}
      {series.map(s => (
        <path key={`${s.key}-area`} className="area"
          d={`${pathFor(s.rows)} L${cx(years)},${cy(0)} L${cx(1)},${cy(0)} Z`}
          fill={s.color} />
      ))}
      {series.map(s => (
        <path key={s.key} className="line" d={pathFor(s.rows)} stroke={s.color} />
      ))}
      {series.map(s => {
        const last  = s.rows[s.rows.length-1];
        const label = labelByKey[s.key];
        const ly    = Math.min(h-pad.b+5, Math.max(pad.t+10, label.baseY+8));
        return (
          <g key={`${s.key}-pt`}>
            <circle className="point" cx={cx(years)} cy={cy(last.afterTax)} r={ptR} fill={s.color} />
            <text className="end-label" style={{fill:s.color, fontSize:endFS}} x={cx(years)+10} y={ly}>{fmtCompact(last.afterTax)}</text>
          </g>
        );
      })}
    </svg>
  );
}

                <span className="ctrl-value">{returnPct.toFixed(1)}%</span>
              </div>
              <input type="range" min="5" max="40" step=".5" value={returnPct}
                onChange={e=>setReturnPct(Number(e.target.value))} />
              <div className="range-ends"><span>5%</span><span>40%</span></div>
              <p className="ctrl-note">주가 상승과 배당을 합친 연간 기대 수익률입니다.</p>
            </div>

            {/* 배당수익률 */}
            <div className="ctrl">
              <div className="ctrl-top">
                <span className="ctrl-label">배당수익률</span>
                <span className="ctrl-value">{divUnknown ? '모르겠음' : `${divPct.toFixed(1)}%`}</span>
              </div>
              <label className="chk-row">
                <input type="checkbox" checked={divUnknown}
                  onChange={e=>setDivUnknown(e.target.checked)} />
                모르겠음 — 배당 없음으로 계산
              </label>
              {!divUnknown && (
                <>
                  <input type="range" min="0" max="6" step=".1" value={divPct}
                    onChange={e=>setDivPct(Number(e.target.value))} />
                  <div className="range-ends"><span>0%</span><span>6%</span></div>
                </>
              )}
              <p className="ctrl-note">
                {divUnknown
                  ? '배당은 따로 없다고 보고 계산합니다.'
                  : '투자금 대비 연간 배당금 비율입니다. 1,000만원 투자 시 배당금 20만원이면 2%입니다.'}
              </p>
            </div>

          </div>{/* panel-body */}
        </aside>

        {/* ── RESULTS ──────────────────────────────── */}
        <section className="results">

          {/* ── RECOMMENDATION CARD ───────────────── */}
          <div className="rec-card">
            <div className="rec-card-hd">
              <div className="rec-card-num">2</div>
              <div className="rec-card-title">추천 계좌 조합</div>
            </div>

            {/* 추천안 빅 카드 */}
            <div className="rec-hero">
              <div className="rec-hero-chip">추천안</div>
              <div className="rec-big-num">{fmtWon(lastBlend.afterTax)}</div>
              <div className="rec-big-sub">추천안대로 {years}년 투자 시 세후 예상 금액</div>
              <div className={`rec-hero-badge ${earlyExitRisk ? 'risk' : 'safe'}`}>
                {earlyExitRisk
                  ? '55세 전 중도해지 세금 16.5% 적용'
                  : '55세 이후 연금소득세 5.5% 적용'}
              </div>
            </div>

            {/* 배분 시각화 */}
            <div className="rec-alloc">
              <div className="rec-section-label">
                {staged ? '첫해 기준' : '연간'} 투자금 배분 — {allocSummary}
              </div>
              <div className="alloc-bar-track">
                {allocRows.map(([name,amt,color]) => (
                  <div key={name} className="alloc-bar-seg" style={{
                    background:color,
                    width:`${firstAnnual ? amt/firstAnnual*100 : 0}%`,
                    minWidth:amt ? '4px' : '0'
                  }} />
                ))}
              </div>
              <div className="alloc-items">
                {allocRows.map(([name,amt,color]) => (
                  <div className="alloc-item" key={name}>
                    <div className="alloc-item-bar" style={{background:color}} />
                    <div className="alloc-item-name">{name}</div>
                    <div className="alloc-item-amt">{fmtWon(amt)}</div>
                    <div className="alloc-item-pct">{firstAnnual ? (amt/firstAnnual*100).toFixed(1) : 0}%</div>
                  </div>
                ))}
              </div>
            </div>

            {/* 비교 카드 3개 */}
            <div className="compare-row">
              <div className="cmp-card pension">
                <div className="cmp-label">전액 연금 계좌라면</div>
                <div className="cmp-amount">{fmtWon(lastPension.afterTax)}</div>
                <div className="cmp-note">{earlyExitRisk ? '중도해지세 반영' : '연금소득세 5.5% 반영'}</div>
              </div>
              <div className="cmp-card isa">
                <div className="cmp-label">ISA부터 채우면</div>
                <div className="cmp-amount">{fmtWon(lastIsa.afterTax)}</div>
                <div className="cmp-note">연 2천만원 한도 가정</div>
              </div>
              <div className="cmp-card direct">
                <div className="cmp-label">미국주식 직투만 하면</div>
                <div className="cmp-amount">{fmtWon(lastDirect.afterTax)}</div>
                <div className="cmp-note">250만원 공제 후 양도세 22%</div>
              </div>
            </div>
          </div>

          {/* ── CHART CARD ────────────────────────── */}
          <div className="chart-card">
            <div className="chart-hd">
              <div className="chart-title">투자 기간별 세후 자산 추이</div>
              <div className="chart-legend">
                {scenarioRows.map(s => (
                  <span key={s.key} className="legend-item">
                    <i className="legend-dot" style={{background:s.color}} />
                    {s.name}
                  </span>
                ))}
              </div>
            </div>
            <div className="chart-svg-wrap">
              <Chart series={scenarioRows} years={years} />
            </div>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>기간</th>
                    <th>추천안</th>
                    <th>전액 연금</th>
                    <th>ISA 먼저</th>
                    <th>직투만</th>
                    <th>직투 대비</th>
                  </tr>
                </thead>
                <tbody>
                  {tableRows.map(row => (
                    <tr key={row.year}>
                      <td>{row.year}년</td>
                      <td>{fmtCompact(row.blend.afterTax)}</td>
                      <td>{fmtCompact(row.pension.afterTax)}</td>
                      <td>{fmtCompact(row.isa.afterTax)}</td>
                      <td>{fmtCompact(row.direct.afterTax)}</td>
                      <td className={row.blend.afterTax-row.direct.afterTax>=0?'positive':'negative'}>
                        {row.blend.afterTax-row.direct.afterTax>=0?'+':''}{fmtCompact(row.blend.afterTax-row.direct.afterTax)}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* ── ASSUMPTIONS ───────────────────────── */}
          <div className="assumptions-card">
            <div className="assumptions-hd">계산 가정</div>
            <div className="assumptions-grid">
              <div className="assumption-item">
                <div className="assumption-title">미국주식 직투</div>
                <div className="assumption-body">매년 배당세 15.4%를 빼고 재투자합니다. 마지막 해에 전부 판다고 보고, 총 수익에서 250만원을 뺀 뒤 남은 이익에 22% 양도세를 뺍니다.</div>
              </div>
              <div className="assumption-item">
                <div className="assumption-title">연금저축 · IRP</div>
                <div className="assumption-body">세액공제 환급액은 재투자하고, 55세 전 현금화 시 과세 대상 금액에 16.5% 페널티 세율을 적용합니다.</div>
              </div>
              <div className="assumption-item">
                <div className="assumption-title">ISA</div>
                <div className="assumption-body">연 2,000만원 한도, 손익통산 후 200만원 비과세, 초과 수익에 9.9% 분리과세를 단순 적용합니다.</div>
              </div>
              <div className="assumption-item">
                <div className="assumption-title">주의사항</div>
                <div className="assumption-body">교육용 추정 모델입니다. 실제 세금은 상품 종류, 금융소득 규모, 법령 변경에 따라 달라질 수 있습니다.</div>
              </div>
              <div className="assumption-item">
                <div className="assumption-title">더 알아보기</div>
                <div className="assumption-body">나스닥100 10년 적립식 투자 기준 직투 vs ISA 세후 실수령액을 실제 세율로 계산한 글 — <a href="isa-irp-us-stock-tax-comparison.html" style={{color:'var(--bl)'}}>ISA·IRP로 미국주식 절세 투자하면 세후 수익 얼마나 차이날까? →</a></div>
              </div>
            </div>
          </div>

        </section>{/* results */}
      </div>{/* main-grid */}
    </div>/* page */
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
