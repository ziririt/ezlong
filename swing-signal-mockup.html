// ── 컬러·레이블 ─────────────────────────────────────────────────────────────
function getFGColor(s) {
  if (s >= 60) return '#0a84ff';
  if (s >= 40) return '#ff8c00';
  if (s >= 20) return '#e09400';
  return '#c0392b';
}
function getFGLabel(s) {
  if (s >= 90) return '초과열구간';
  if (s >= 80) return '과열구간';
  if (s >= 60) return '온기구간';
  if (s >= 40) return '미온구간';
  if (s >= 20) return '냉각구간';
  if (s >= 10) return '과냉구간';
  return '초과냉구간';
}

// ── 선형 회귀 ────────────────────────────────────────────────────────────────
function calcSlope(pts) {
  if (!pts || pts.length < 2) return 0;
  const n = pts.length;
  const sumT = pts.reduce((a,p)=>a+p.t,0), sumV = pts.reduce((a,p)=>a+p.v,0);
  const sumTT = pts.reduce((a,p)=>a+p.t*p.t,0), sumTV = pts.reduce((a,p)=>a+p.t*p.v,0);
  const d = n*sumTT - sumT*sumT;
  return d===0 ? 0 : (n*sumTV - sumT*sumV)/d;
}

    {from:40,to:60,color:'#8b99a8',short:'미온'},    // 중립 회색
    {from:60,to:80,color:'#f97316',short:'온기'},    // 오렌지
    {from:80,to:90,color:'#ff2200',short:'과열'},    // 순수 레드오렌지 - 선명한 열기
    {from:90,to:100,color:'#e60000',short:'초과열'}, // 순수 레드 - 브라운 제로
  ];
  const toX = s => BX+(s/100)*BW;
  const absSlope = Math.abs(slope);
  const isD = slope < -SLOPE_THRESHOLD, isI = slope > SLOPE_THRESHOLD;
  const t = Math.min((absSlope-SLOPE_THRESHOLD)/(MAX_SLOPE-SLOPE_THRESHOLD),1);
  const ext = (isD||isI) ? MIN_EXT + t*(MAX_EXT-MIN_EXT) : 0;

  const yT = x => { const r=(x-BX)/BW; return isD?BY-(ext/2)*r:isI?BY-(ext/2)*(1-r):BY; };
  const yB = x => { const r=(x-BX)/BW; return isD?BY+BH+(ext/2)*r:isI?BY+BH+(ext/2)*(1-r):BY+BH; };

  const BR=5; let segs='';
  ZONES.forEach((z,i)=>{
    const x1=toX(z.from),x2=toX(z.to);
    const active=score>=z.from&&(i===ZONES.length-1?score<=100:score<z.to);
    const t1=yT(x1),b1=yB(x1),t2=yT(x2),b2=yB(x2);
    let d;
    if(!isD&&!isI){
      if(i===0) d=`M ${x1+BR},${BY} H ${x2} V ${BY+BH} H ${x1+BR} Q ${x1},${BY+BH} ${x1},${BY+BH-BR} V ${BY+BR} Q ${x1},${BY} ${x1+BR},${BY} Z`;
      else if(i===ZONES.length-1) d=`M ${x1},${BY} H ${x2-BR} Q ${x2},${BY} ${x2},${BY+BR} V ${BY+BH-BR} Q ${x2},${BY+BH} ${x2-BR},${BY+BH} H ${x1} Z`;
      else d=`M ${x1},${BY} H ${x2} V ${BY+BH} H ${x1} Z`;
    } else { d=`M ${x1},${t1} L ${x2},${t2} L ${x2},${b2} L ${x1},${b1} Z`; }
    segs+=`<path d="${d}" fill="${z.color}" fill-opacity="${active?1:0.3}"/>\n`;
    const lx=(x1+x2)/2, ly=(yT(lx)+yB(lx))/2, fs=(x2-x1)<36?7:8.5;
    segs+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-weight="${active?800:600}" fill="#fff" opacity="${active?0.95:0.55}">${z.short}</text>\n`;
  });

  let divs='';
  [10,20,40,60,80,90].forEach(s=>{
    const x=toX(s);
    divs+=`<line x1="${x}" y1="${yT(x)}" x2="${x}" y2="${yB(x)}" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>`;
  });

  let prevMark='';
  if(oldestScore!=null&&(isD||isI)){
    const px=Math.max(2,Math.min(BW-2,toX(oldestScore)));
    prevMark=`<line x1="${px}" y1="${yT(px)}" x2="${px}" y2="${yB(px)}" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-dasharray="2.5,2.5"/>`;
  }

  const mx=Math.max(7,Math.min(BW-7,toX(score)));
  const mTop=yT(mx), TW=9, TH=8;
  const needle=`<polygon points="${mx},${mTop} ${mx-TW/2},${mTop-TH} ${mx+TW/2},${mTop-TH}" fill="${scoreColor}" filter="drop-shadow(0 1px 2px rgba(0,0,0,.35))"/>
    <line x1="${mx}" y1="${mTop}" x2="${mx}" y2="${yB(mx)}" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>`;

  const textX=mx<70?mx+4:mx>BW-70?mx-4:mx;
  const anchor=mx<70?'start':mx>BW-70?'end':'middle';
  const baseY=Math.max(16,mTop-TH-5);
  let dirIcon='';
  if(isD||isI) dirIcon = slope<0?' ▼':' ▲';

  const scoreLine=`<text x="${textX}" y="${baseY}" text-anchor="${anchor}" font-size="12" font-weight="800" fill="${scoreColor}" letter-spacing="-0.01em">${score}점 · ${fgLabel}${dirIcon}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;overflow:visible;">${segs}${divs}${prevMark}${needle}${scoreLine}</svg>`;
}

// ── 볼카운터 ────────────────────────────────────────────────────────────────
function renderBalls(buy, sell, hold) {
  function col(label, n, color, glowCls, hints) {
    const balls = [0,1,2].map(i=>{
      const lit=i<n;
      return `<span class="bi-ball${lit?' lit '+glowCls:''}" style="color:${color};"></span>`;
    }).join('');
    return `<div class="bi-col"><span class="bi-label" style="color:${color};">${label}</span><div class="bi-balls">${balls}</div><span class="bi-hint">${hints[n]}</span></div>`;
  }
  function holdCol(n) {
    if(n===0){
      const balls=[0,1,2].map(()=>`<span class="bi-ball lit gb" style="color:#5AC8FA;"></span>`).join('');
      return `<div class="bi-col"><span class="bi-label" style="color:#5AC8FA;">HOLD</span><div class="bi-balls">${balls}</div><span class="bi-hint">보유하기 좋음</span></div>`;
    }
    const balls=[0,1,2].map((_, i)=>{
      const lit=i<n;
      return `<span class="bi-ball${lit?' lit gr':''}" style="color:#FF453A;"></span>`;
    }).join('');
    const hints=['','익절 검토 구간','비중 축소 권장','레버리지 즉시 정리'];
    return `<div class="bi-col"><span class="bi-label" style="color:#FF453A;">HOLD</span><div class="bi-balls">${balls}</div><span class="bi-hint">${hints[n]}</span></div>`;
  }
  document.getElementById('ball-bar').innerHTML =
    col('BUY', buy, '#FFB300','gy',['최적 매수','소량 가능','주의 구간','매수 자제'])
    + col('SELL',sell,'#30D158','gg',['과매도·보유','부분 익절','차익 실현','적극 익절'])
    + holdCol(hold);
}

// ── 렌더 ────────────────────────────────────────────────────────────────────
let currentScenario = 0;

function render() {
  const sc = SCENARIOS[currentScenario];

  // 점수 오버라이드 적용
  const override = parseInt(document.getElementById('score-override').value);
  const hist = [...sc.history];
  hist[hist.length-1] = override;

  // 선형 회귀 계산
  const pts = hist.map((v,i)=>({t:i,v}));
  const slope = calcSlope(pts);
  const oldest = hist[0];
  const period = hist.length - 1;
  const score  = hist[hist.length-1];
  const fgLabel = getFGLabel(score);
  const color   = getFGColor(score);

  document.getElementById('score-disp').textContent = score;

  // 볼카운터
  renderBalls(sc.buy, sc.sell, sc.hold);

  // 카드
  const card = document.getElementById('action-card');
  card.className = 'action-card ' + sc.cls;

  document.getElementById('gauge-wrap').innerHTML =
    makeSwingGaugeSVG(score, fgLabel, color, slope, period, oldest);

  document.getElementById('card-title').textContent = sc.title;
  document.getElementById('card-desc').innerHTML    = sc.desc;

  // pills
  const pillsEl = document.getElementById('card-pills');
  pillsEl.innerHTML = sc.pills.map(p=>
    `<span class="action-pill" style="background:${p.bg};color:${p.color};">${p.text}</span>`
  ).join('');

  // options bar
  const optEl = document.getElementById('card-options');
  if(sc.options){
    optEl.innerHTML = `<div class="options-bar">
      <div class="options-bar-title">옵션 시장 현황</div>
      <div class="options-bar-row" style="color:${sc.options.color};">${sc.options.icon} ${sc.options.text}</div>
    </div>`;
  } else { optEl.innerHTML=''; }
}

// 시나리오 초기값 슬라이더 세팅
function initSlider() {
  const sc = SCENARIOS[currentScenario];
  const last = sc.history[sc.history.length-1];
  const slider = document.getElementById('score-override');
  slider.value = last;
  document.getElementById('score-disp').textContent = last;
}

document.getElementById('scenario-sel').addEventListener('change', e=>{
  currentScenario = parseInt(e.target.value);
  initSlider();
  render();
});
document.getElementById('score-override').addEventListener('input', render);

initSlider();
render();
</script>
