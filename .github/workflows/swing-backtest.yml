name: swing-backtest
on:
  push:
    branches: [feature/swing-backtest]
    paths: ['backtest/**', '.github/workflows/swing-backtest.yml']
  workflow_dispatch:
concurrency:
  group: swing-backtest
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install yfinance pandas numpy
      - name: Fetch data
        run: python backtest/fetch_history.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/data/
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "backtest: history data $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')"
            git push origin feature/swing-backtest
          fi
