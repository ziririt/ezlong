name: Naver Content Sync

on:
  # 주 트리거는 여전히 cron-job.org 다(하루 5회, KST 08:59·13:35·18:35·21:10·23:01).
  # GitHub 내부 cron 은 수 시간 밀리거나 통째로 건너뛰므로 그것만 믿지 않는다.
  #
  # 그럼에도 아래 슬롯을 두는 이유: cron-job.org 계정이 멎으면 이 파이프라인은
  # 트리거가 하나도 남지 않는다. 매일 아침 한 번은 깃허브 자체 예약으로도
  # 돌게 해서 경로를 둘로 나눈다. 밀려도 그날 안에는 돈다.
  # 세 번째 안전망은 감시견(watchdog)이다 — 하루 넘게 갱신이 없으면 재실행한다.
  schedule:
    - cron: '5 0 * * *'    # 00:05 UTC = 09:05 KST — 본실행
    - cron: '35 1 * * *'   # 01:35 UTC = 10:35 KST — 보조(본실행이 밀렸을 때)
  workflow_dispatch:

# 동시 실행 방지 — 이전 실행 중이면 새 것으로 교체
concurrency:
  group: naver-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (최신 main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape Naver Premium Content
        run: node scripts/sync-naver.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 소사(A Brief History)의 날짜축에 새 글을 얹는다. 손으로 쓴 소사는 건드리지
      # 않고, source=own_archive 항목만 매번 다시 만든다(멱등).
      # 이 단계가 깨져도 원래 있던 naver-content.json 갱신은 그대로 커밋되게 둔다 —
      # 새로 붙인 기능이 기존 파이프라인을 같이 죽이면 안 된다.
      - name: 소사에 새 글 반영
        continue-on-error: true
        run: python3 scripts/merge-naver-archive.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # git reset --hard 금지 (CLAUDE.md Rule 2/16) — tracked 파일 소멸 위험
          # actions/checkout@v4가 이미 올바른 상태. 추가 fetch/reset 불필요.
          git add data/naver-content.json data/naver-archive.json data/brief-history.json
          if git diff --staged --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: naver content sync $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
            git push origin main || (git fetch origin main && git merge -X ours origin/main --no-edit && git push origin main)
          fi
