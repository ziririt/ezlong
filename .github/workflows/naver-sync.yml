name: Naver Content Sync

on:
  # 주 트리거는 여전히 cron-job.org 다(하루 5회, KST 08:59·13:35·18:35·21:10·23:01).
  # GitHub 내부 cron 은 수 시간 밀리거나 통째로 건너뛰므로 그것만 믿지 않는다.
  #
  # 그럼에도 아래 슬롯을 두는 이유: cron-job.org 계정이 멎으면 이 파이프라인은
  # 트리거가 하나도 남지 않는다. 매일 아침 한 번은 깃허브 자체 예약으로도
  # 돌게 해서 경로를 둘로 나눈다. 밀려도 그날 안에는 돈다.
  # 세 번째 안전망은 감시견(watchdog)이다 — 하루 넘게 갱신이 없으면 재실행한다.
  schedule:
    - cron: '5 0 * * *'    # 00:05 UTC = 09:05 KST — 본실행
    - cron: '35 1 * * *'   # 01:35 UTC = 10:35 KST — 보조(본실행이 밀렸을 때)
  workflow_dispatch:

# 동시 실행 방지 — 이전 실행 중이면 새 것으로 교체
concurrency:
  group: naver-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (최신 main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape Naver Premium Content
        run: node scripts/sync-naver.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 가격 곡선을 먼저 최신으로 — 이슈의 등락 수치가 이 파일에서 계산된다.
      # 이 단계가 밀리면 최근 며칠 이슈가 차트에 점도 못 찍고 등락도 비게 된다.
      - name: 이슈 차트 데이터 갱신
        continue-on-error: true
        run: |
          pip install yfinance --quiet 2>/dev/null || pip install yfinance
          python3 scripts/fetch-brief-history-chart.py

      # 이슈(A Brief History)의 날짜축에 새 글을 얹는다. 손으로 쓴 항목은 건드리지
      # 않고, source=own_archive 만 매번 다시 만든다(멱등).
      # 아래 단계들이 깨져도 원래 있던 naver-content.json 갱신은 그대로 커밋되게
      # 둔다 — 새로 붙인 기능이 기존 파이프라인을 같이 죽이면 안 된다.
      - name: 이슈에 새 글 반영
        continue-on-error: true
        run: python3 scripts/merge-naver-archive.py

      # 그날 글의 공개 본문을 읽어 소제목+닷블릿 브리핑으로 압축한다.
      # 제목만 따오면 '그날 무슨 일이 있었나'가 헤드라인 한 줄로 끝난다.
      # merge 가 매번 항목을 새로 만들므로 반드시 그 뒤에 온다(캐시로 재적용).
      # 한 번에 100일까지만 — 첫 채우기가 워크플로를 붙잡고 있지 않게.
      - name: 이슈 브리핑 생성
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/brief-history-briefings.mjs --limit 100

      # 판단 원장(그날 AI 가 뭐라고 했나)을 날짜축으로 편다. 원장 파일은 15개로
      # prune 되므로 git 이력을 훑어 복원한다 — 새 데이터 소스가 필요 없다.
      - name: AI 판단 타임라인 복원
        continue-on-error: true
        run: |
          git fetch --deepen=400 origin main 2>/dev/null || true
          python3 scripts/extract-judgment-timeline.py

      # 새로 붙은 항목만 번역한다(원문 해시 캐시). 첫 실행만 무겁고 그 뒤로는
      # 하루 두세 건이라 호출이 거의 없다. 키가 없으면 조용히 건너뛴다.
      - name: 이슈 다국어 번역
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/translate-brief-history.mjs

      # 번역판 페이지는 한국어 원본에서 굽는다 — 손으로 여섯 벌을 관리하지 않는다.
      - name: 이슈 번역판 페이지 생성
        continue-on-error: true
        run: python3 scripts/build-brief-history-i18n.py

      - name: Commit updated data (if changed)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # git reset --hard 금지 (CLAUDE.md Rule 2/16) — tracked 파일 소멸 위험
          # actions/checkout@v4가 이미 올바른 상태. 추가 fetch/reset 불필요.
          # 새 글이 실제로 생겼는가 — naver-content.json 은 updatedAt 때문에 매번
          # 달라지므로 신선도 판정에는 쓸 수 없다. 목록·소사가 바뀌었는지로 본다.
          git add data/naver-archive.json data/brief-history.json data/brief-history-*.json \
                  data/brief-history-chart.json data/brief-history-verdicts.json \
                  en/brief-history.html ja/brief-history.html zh/brief-history.html \
                  es/brief-history.html pt/brief-history.html
          if git diff --staged --quiet; then
            echo "새 글 없음"
            echo "fresh=no" >> "$GITHUB_OUTPUT"
          else
            echo "새 글 반영됨"
            echo "fresh=yes" >> "$GITHUB_OUTPUT"
          fi

          # 번역 캐시 — 이게 안 실리면 매일 463건×5개 언어를 처음부터 다시
          # 번역한다(약 195회 호출·40분). 캐시가 커밋돼야 다음날 두세 건만 돈다.
          # 신선도 판정에는 넣지 않는다 — 캐시만 바뀐 날에 배포할 이유가 없다.
          git add data/.cache/brief-history-i18n.json data/.cache/brief-history-briefings.json \
                  data/naver-content.json
          if git diff --staged --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: naver content sync $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
            git push origin main || bash scripts/naver-sync-rebase.sh
          fi

      # 봇(GITHUB_TOKEN) push 는 firebase-hosting.yml 을 트리거하지 않는다(깃허브 정책).
      # 새 글이 실제로 생긴 날만 직접 배포한다 — 그래야 아침에 확인한 글이
      # 몇 시간 뒤 다른 워크플로의 배포를 기다리지 않고 바로 화면에 뜬다.
      - name: 새 글이 있으면 배포
        if: steps.commit.outputs.fresh == 'yes'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools --quiet
          firebase deploy --only hosting --project ezlong-541a8 --token "$FIREBASE_TOKEN" || true
