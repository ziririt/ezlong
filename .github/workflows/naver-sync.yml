name: Naver Content Sync

on:
  # 매일 08:59 KST (= 23:59 UTC 전날)
  # 매일 23:59 KST (= 14:59 UTC)
  schedule:
    - cron: '59 23 * * *'
    - cron: '59 14 * * *'
        - cron: '37 11 * * *'
  # 수동 실행용 (Actions 탭 → Run workflow)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape Naver Premium Content
        run: node scripts/sync-naver.mjs

      - name: Commit updated data (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/naver-content.json; then
            echo "변경 없음, 커밋 생략"
          else
            git add data/naver-content.json
            git commit -m "chore: naver content sync $(date +'%Y-%m-%d %H:%M KST')"
            git push origin main
          fi
