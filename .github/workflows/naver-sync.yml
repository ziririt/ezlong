name: Naver Content Sync

on:
  # GitHub Actions 내부 schedule 제거 — cron-job.org가 외부에서 정확히 트리거
  # (GitHub 내부 cron은 수 시간 지연/스킵 가능 → 신뢰 불가)
  workflow_dispatch:

# 동시 실행 방지 — 이전 실행 중이면 새 것으로 교체
concurrency:
  group: naver-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (최신 main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape Naver Premium Content
        run: node scripts/sync-naver.mjs

      # 소사(A Brief History)의 날짜축에 새 글을 얹는다. 손으로 쓴 소사는 건드리지
      # 않고, source=own_archive 항목만 매번 다시 만든다(멱등).
      - name: 소사에 새 글 반영
        run: python3 scripts/merge-naver-archive.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # git reset --hard 금지 (CLAUDE.md Rule 2/16) — tracked 파일 소멸 위험
          # actions/checkout@v4가 이미 올바른 상태. 추가 fetch/reset 불필요.
          git add data/naver-content.json data/naver-archive.json data/brief-history.json
          if git diff --staged --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: naver content sync $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
            git push origin main || (git fetch origin main && git merge -X ours origin/main --no-edit && git push origin main)
          fi
