name: Fetch Stocks Data

on:
  schedule:
    # 매일 22:00 UTC (KST 07:00) — 미장 마감(16:00 ET) 후 약 2시간 여유
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # 수동 실행 허용

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance --break-system-packages 2>/dev/null || pip install yfinance

      - name: Run fetch-stocks-data.py
        run: python scripts/fetch-stocks-data.py

      - name: Commit stocks-data.json
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks-data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "data: stocks-data.json 업데이트 ${KST}"
            git push origin main || (git fetch origin main && git merge --no-ff -m "chore: merge origin/main after push conflict" origin/main && git push origin main)
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Firebase Hosting
        if: steps.commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZLONG_541A8 }}'
          channelId: live
          projectId: ezlong-541a8
