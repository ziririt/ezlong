name: TimesFM 예측 범위 — 일 1회

# 구글 TimesFM 2.5(200M) 제로샷 분위수 예측 (2026-08-14 신설).
# 장 마감 확정 종가로 하루 한 번이면 충분하다 — 일봉 모델이라 장중에 다시
# 돌려도 입력이 같아 결과가 같다. 05:40 KST = 20:40 UTC(서머타임 마감 20:00 직후).
# 화~토 KST = 월~금 미국 거래일. 겨울(EST)엔 마감이 21:00 UTC라 이 시각엔
# 아직 안 닫혔지만, 그날 아침 09:00 보조 슬롯이 확정 종가로 덮는다.
on:
  schedule:
    - cron: '40 20 * * 1-5'   # 05:40 KST 화~토 — 본실행 (EDT 마감 직후)
    - cron: '0 0 * * 2-6'     # 09:00 KST 화~토 — 보조 (EST 기간 확정 종가 보정)
  workflow_dispatch:

concurrency:
  group: timesfm-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # cache: pip 은 requirements.txt 가 있어야 동작한다(없으면 스텝 실패).
          # 이 저장소는 요구사항 파일을 안 두므로 pip 캐시는 생략 — 설치 ~2분은 감수.

      # torch는 CPU 휠로 고정 — 기본 휠(CUDA 포함)은 1GB가 넘고 러너에 GPU도 없다.
      - name: Install deps (torch CPU + timesfm)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet timesfm yfinance

      # HuggingFace 체크포인트(~800MB)를 러너 캐시에 보관 — 매일 새로 받지 않게.
      - name: Cache TimesFM checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm-2.5-200m-pytorch-v1

      - name: Run forecast
        run: python scripts/fetch-timesfm-forecast.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/timesfm-forecast.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "data: TimesFM 예측 대역 ${KST}"
            git push origin main || (git fetch origin main && git rebase origin/main && git push origin main)
          fi

      # 봇 push는 firebase-hosting.yml을 트리거하지 않는다(16항) — 직접 배포.
      - name: Deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools --quiet
          firebase deploy --only hosting --project ezlong-541a8 --token "$FIREBASE_TOKEN" || true
