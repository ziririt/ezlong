name: 긍정vs부정 카드 교차 감사

# 61항 — 여러 장을 나란히 놓아야 보이는 병을 찾는다.
#
# 기존 검사 열다섯 개는 전부 카드 한 장을 만드는 순간에만 돈다. 같은 주제가 반나절 만에
# 편을 갈아타는 것, 점수는 고정인데 이유만 바뀌는 것은 그 순간에는 안 보인다.
# 2026-08-17에 그걸 찾은 건 코드가 아니라 사람이었다. 그 훑는 일을 여기서 대신한다.
#
# fetch-depth: 0 이 필수다 — 원장을 git 이력에서 복원하기 때문이다. 얕게 받으면
# 카드 몇 장밖에 못 보고, 교차 검사는 그 순간 의미를 잃는다.

on:
  schedule:
    - cron: '0 22 * * *'    # KST 07:00 — 아침에 열어보기 좋은 시각
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scorecard-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (전체 이력 — 원장 복원에 필요)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 이 감사는 아무것도 고치지 않는다. 발견만 하고 리포트를 남긴다.
      # 그래서 실패해도 사이트는 아무 영향이 없다 — 다만 조용히 죽는 건 막는다.
      - name: 교차 감사 실행
        run: python3 scripts/audit-scorecard-history.py

      - name: 리포트 커밋
        run: |
          git config user.name  "ezlong-bot"
          git config user.email "bot@ezlong.com"
          git add data/scorecard-audit.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "교차 감사 리포트 갱신 (61항)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin main && exit 0
            echo "재시도 $i"
            sleep 5
          done
          echo "::warning::리포트 푸시 실패 — 다음 실행에서 다시 시도한다"
