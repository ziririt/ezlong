name: 한국주식 실시간 가격 수집

# ─── 목적 ────────────────────────────────────────────────────────────────────
# KRX 장중(KST 09:00~15:30 = UTC 00:00~06:30)에 10분마다 한국 주식 현재가를
# yfinance로 수집해 data/kr-prices.json 에 저장한다.
#
# chart-analysis.html 이 이 파일을 로드해 분석 스냅샷 위에 실시간 가격을 덮어쓴다.
# (분석 AI는 하루 4회 실행 — 이 워크플로는 가격만 고빈도로 갱신)
#
# ─── 스케줄 ──────────────────────────────────────────────────────────────────
#   */10 0-6 * * 1-5  — UTC 00:00~06:59 (KST 09:00~15:59), 월~금
#   KRX 정규장(KST 09:00~15:30) 을 약간 여유 있게 커버. 장마감 후 30분도 포함
#   (마감 직후 데이터가 야후에 반영되는 시간 고려)

on:
  schedule:
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:

# 동시 실행 방지 — 이전 실행 중이면 건너뜀 (fetch-market-data 와 별도 큐)
concurrency:
  group: fetch-kr-prices
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance --quiet

      - name: Fetch KR prices
        run: python3 scripts/fetch-kr-prices.py

      # git add/commit/push — CLAUDE.md Rule 16 준수
      # git reset --hard / git rebase / git add -A 절대 금지
      - name: Commit and push kr-prices.json
        run: |
          git config user.name  "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"

          git add data/kr-prices.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
            exit 0
          fi
          KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          git commit -m "chore: 한국주식 가격 갱신 ${KST}"
          git push origin main || (git fetch origin main && git merge -X ours origin/main --no-edit && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: echo "::error::한국주식 가격 수집 실패. yfinance 요청 오류 확인 필요."
