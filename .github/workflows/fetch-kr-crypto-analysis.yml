name: 한국주식 차트 분석 생성

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# KST(UTC+9) 기준 한국 정규장 시간 매시 1회 실행
# 장 시작 5분 후(9:05 KST) ~ 장마감 5분 후(15:35 KST)
# → 9:05 · 10:05 · 11:05 · 12:05 · 13:05 · 14:05 · 15:05 · 15:35 KST (8회/일)
#
# KST → UTC 변환 (UTC+9):
#   09:05 KST = 00:05 UTC
#   15:35 KST = 06:35 UTC
#
# 암호화폐는 fetch-crypto-analysis.yml 워크플로에서 별도 처리
# 한국 주식/ETF: 평일(월~금) + 공휴일 아닌 날만 실행
#

on:
  schedule:
    - cron: '5 0 * * *'    # KST 09:05
    - cron: '5 1 * * *'    # KST 10:05
    - cron: '5 2 * * *'    # KST 11:05
    - cron: '5 3 * * *'    # KST 12:05
    - cron: '5 4 * * *'    # KST 13:05
    - cron: '5 5 * * *'    # KST 14:05
    - cron: '5 6 * * *'    # KST 15:05
    - cron: '35 6 * * *'   # KST 15:35 (장마감 5분 후)

  workflow_dispatch:
    inputs:
      force_kr:
        description: '한국주식 강제 실행 (공휴일/주말에도)'
        required: false
        default: 'false'

jobs:
  analyze:
    runs-on: ubuntu-latest

    concurrency:
      group: kr-crypto-analysis
      cancel-in-progress: false

    steps:
      # ── 1. 저장소 체크아웃 ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js 설치 ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --production

      # ── 3. 한국 거래일 여부 판단 ──────────────────────────────────────
      - name: Check Korean trading day
        id: kr_check
        run: |
          DATE_TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          DAY_OF_WEEK=$(TZ=Asia/Seoul date +%u)   # 1=월 ~ 7=일

          # 2026년 한국 공휴일 (임시공휴일은 정부 발표 후 수동 추가 필요)
          KR_HOLIDAYS=(
            "2026-01-01"  # 신정
            "2026-02-16"  # 설날 연휴
            "2026-02-17"  # 설날
            "2026-02-18"  # 설날 연휴
            "2026-03-01"  # 삼일절
            "2026-05-05"  # 어린이날
            "2026-05-25"  # 석가탄신일
            "2026-06-06"  # 현충일
            "2026-08-15"  # 광복절
            "2026-09-24"  # 추석 연휴
            "2026-09-25"  # 추석
            "2026-09-26"  # 추석 연휴
            "2026-10-03"  # 개천절
            "2026-10-09"  # 한글날
            "2026-12-25"  # 크리스마스
          )

          IS_HOLIDAY="false"
          for hd in "${KR_HOLIDAYS[@]}"; do
            if [ "$DATE_TODAY" = "$hd" ]; then
              IS_HOLIDAY="true"
              break
            fi
          done

          FORCE_KR="${{ github.event.inputs.force_kr }}"

          if [ "$FORCE_KR" = "true" ]; then
            echo "run_kr=true" >> $GITHUB_OUTPUT
            echo "한국주식 강제 실행 모드"
          elif [ "$DAY_OF_WEEK" -ge 6 ] || [ "$IS_HOLIDAY" = "true" ]; then
            echo "run_kr=false" >> $GITHUB_OUTPUT
            echo "한국주식 건너뜀: 주말(${DAY_OF_WEEK}요일) 또는 공휴일(${DATE_TODAY})"
          else
            echo "run_kr=true" >> $GITHUB_OUTPUT
            echo "한국주식 실행: ${DATE_TODAY} (평일)"
          fi

      # ── 4. 한국 주식/ETF 차트 분석 ───────────────────────────────────
      - name: Run Korean stocks/ETFs chart analysis
        if: steps.kr_check.outputs.run_kr == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-chart-analysis.js kr

      # ── 5. 변경사항 커밋 및 푸시 ─────────────────────────────────────
      - name: Commit and push analysis data
        if: steps.kr_check.outputs.run_kr == 'true'
        run: |
          git config user.name "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"

          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음. 커밋 건너뜀."
            exit 0
          fi

          git commit -m "chore: 한국주식 차트 분석 업데이트 $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push 재시도 $i/3..."
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::한국주식 차트 분석 실패. GitHub Actions 로그에서 오류를 확인하세요."
          echo "::error::Yahoo Finance 응답 오류 또는 Gemini API 키 문제일 수 있습니다."
