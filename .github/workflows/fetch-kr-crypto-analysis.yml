name: 한국주식 차트 분석 생성

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# 평일(월~금) 4회 실행 (장중 3회 + 장마감 직후 1회)
# 목표 실행 시각 (KST 기준):
#   09:35 KST — 장 시작 후    = 00:35 UTC
#     (2026-08-04 개정: 기존 09:05는 야후가 아직 전일 세션 스냅샷을 반환하는
#      시간대라 "오늘 09시 데이터"로 위장된 전일 등락률이 노출됐다 — 실측 사고.
#      세션 롤 완료 + kr-prices 첫 갱신 시점에 맞춰 09:35로 이동)
#   12:05 KST — 장중           = 03:05 UTC
#   14:05 KST — 장중           = 05:05 UTC
#   15:35 KST — 장마감 5분 후  = 06:35 UTC
#
# 공휴일·주말은 kr_check 스텝에서 자동 필터링
# 비용 절감: 8회/일 → 4회/일 (50% 절감)
#

on:
  schedule:
    - cron: '35 0 * * *'   # KST 09:35 (야후 세션 롤 이후 — 상단 스케줄 설명 참조)
    - cron: '5 3 * * *'    # KST 12:05
    - cron: '5 5 * * *'    # KST 14:05
    - cron: '35 6 * * *'   # KST 15:35 (장마감 5분 후)

  workflow_dispatch:
    inputs:
      force_kr:
        description: '한국주식 강제 실행 (공휴일/주말에도)'
        required: false
        default: 'false'

jobs:
  analyze:
    runs-on: ubuntu-latest

    concurrency:
      group: kr-crypto-analysis
      cancel-in-progress: false

    steps:
      # ── 1. 저장소 체크아웃 ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js 설치 ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --production

      # ── 3. 한국 거래일 여부 판단 ──────────────────────────────────────
      - name: Check Korean trading day
        id: kr_check
        run: |
          DATE_TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          DAY_OF_WEEK=$(TZ=Asia/Seoul date +%u)   # 1=월 ~ 7=일

          # 2026년 한국 공휴일 (임시공휴일은 정부 발표 후 수동 추가 필요)
          KR_HOLIDAYS=(
            "2026-01-01"  # 신정
            "2026-02-16"  # 설날 연휴
            "2026-02-17"  # 설날
            "2026-02-18"  # 설날 연휴
            "2026-03-01"  # 삼일절
            "2026-05-05"  # 어린이날
            "2026-05-25"  # 석가탄신일
            "2026-06-06"  # 현충일
            "2026-08-15"  # 광복절
            "2026-09-24"  # 추석 연휴
            "2026-09-25"  # 추석
            "2026-09-26"  # 추석 연휴
            "2026-10-03"  # 개천절
            "2026-10-09"  # 한글날
            "2026-12-25"  # 크리스마스
          )

          IS_HOLIDAY="false"
          for hd in "${KR_HOLIDAYS[@]}"; do
            if [ "$DATE_TODAY" = "$hd" ]; then
              IS_HOLIDAY="true"
              break
            fi
          done

          FORCE_KR="${{ github.event.inputs.force_kr }}"

          if [ "$FORCE_KR" = "true" ]; then
            echo "run_kr=true" >> $GITHUB_OUTPUT
            echo "한국주식 강제 실행 모드"
          elif [ "$DAY_OF_WEEK" -ge 6 ] || [ "$IS_HOLIDAY" = "true" ]; then
            echo "run_kr=false" >> $GITHUB_OUTPUT
            echo "한국주식 건너뜀: 주말(${DAY_OF_WEEK}요일) 또는 공휴일(${DATE_TODAY})"
          else
            echo "run_kr=true" >> $GITHUB_OUTPUT
            echo "한국주식 실행: ${DATE_TODAY} (평일)"
          fi

      # ── 4. 한국 주식/ETF 차트 분석 ───────────────────────────────────
      - name: Run Korean stocks/ETFs chart analysis
        if: steps.kr_check.outputs.run_kr == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-chart-analysis.js kr

      # ── 5. 변경사항 커밋 및 푸시 ─────────────────────────────────────
      - name: Commit and push analysis data
        if: steps.kr_check.outputs.run_kr == 'true'
        run: |
          git config user.name "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"

          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음. 커밋 건너뜀."
            exit 0
          fi

          git commit -m "chore: 한국주식 차트 분석 업데이트 $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          git push origin main || (git fetch origin main && git merge -X ours origin/main --no-edit && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::한국주식 차트 분석 실패. GitHub Actions 로그에서 오류를 확인하세요."
          echo "::error::Yahoo Finance 응답 오류 또는 Gemini API 키 문제일 수 있습니다."
