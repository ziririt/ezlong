name: Firebase Hosting 자동 배포

# main 브랜치에 push될 때마다 Firebase에 자동 배포

on:
  push:
    branches:
      - main

  # 수동 실행 허용
  workflow_dispatch:
  
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZLONG_541A8 }}'
          channelId: live
          projectId: ezlong-541a8
