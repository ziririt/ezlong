name: Market Regime (BFRS)

# 미국장 마감 뒤 하루 한 번. 16:00 ET 마감이므로 21:30 UTC(06:30 KST)에 돌린다.
# 깃허브 예약은 밀리거나 통째로 건너뛴다(CLAUDE.md 40항). 그래서 슬롯을 둘 두고,
# 그래도 안 되면 수동 실행(workflow_dispatch)으로 받는다.
on:
  schedule:
    - cron: '30 21 * * 1-5'   # 21:30 UTC = 06:30 KST — 본실행
    - cron: '0 0 * * 2-6'     # 00:00 UTC = 09:00 KST — 보조(본실행이 밀렸을 때)
  workflow_dispatch:

concurrency:
  group: market-regime
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (최신 main)
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 엔진 의존성. 무겁지 않다 — 설치에 1분이 안 걸린다.
      - name: 의존성 설치
        run: pip install --quiet "httpx>=0.27,<1" "numpy>=2,<3" "pandas>=2.2,<4" "pyarrow>=17,<24" "pydantic>=2.8,<3" "python-dotenv>=1,<2" "PyYAML>=6,<7"

      # 원시 데이터는 저장소에 두지 않는다(파케이를 커밋하면 매일 통째로 다시
      # 실려 저장소가 하루 수 MB씩 불어난다). 매 실행마다 다시 받는다.
      # 심볼 12종·경제지표 4종이라 전 구간을 받아도 몇 분이면 끝난다.
      - name: 시장 데이터 수집
        env:
          PYTHONPATH: scripts
        run: |
          python -m bfrs.cli init
          python -m bfrs.cli fetch-market --start 2004-10-18

      - name: 경제 데이터 수집
        env:
          PYTHONPATH: scripts
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::FRED_API_KEY 시크릿이 없다 — 신용·실질금리 점수를 계산할 수 없어 중단한다"
            exit 1
          fi
          python -m bfrs.cli fetch-fred --start 2004-01-01

      # 결측을 조용히 메우지 않는다. 검사에 걸리면 그 자리에서 멈춘다.
      - name: 데이터 검증
        env:
          PYTHONPATH: scripts
        run: python -m bfrs.cli validate-data --strict

      - name: 분석·스냅샷 생성
        env:
          PYTHONPATH: scripts
        run: |
          python -m bfrs.cli analyze
          python -m bfrs.cli build-snapshot --output .bfrs-work/bfrs-snapshot.json

      # 2.2MB 스냅샷을 화면이 읽을 두 파일로 나눈다(오늘 판정 18KB · 히스토리 288KB).
      - name: 화면용 데이터 만들기
        run: python3 scripts/build-market-regime.py --snapshot .bfrs-work/bfrs-snapshot.json

      # 과거가 통째로 흔들렸는지 본다. 매일 전 구간을 다시 받으므로, 공급자가
      # 과거 값을 손대면 어제와 오늘의 히스토리가 크게 달라진다 — 그건 갱신이
      # 아니라 사고다. 마지막 하루를 뺀 나머지가 크게 바뀌면 멈춘다.
      - name: 과거 값이 흔들렸는지 확인
        run: python3 scripts/check-market-regime-drift.py

      - name: Commit updated data (if changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-regime.json data/market-regime-history.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            echo "fresh=no" >> "$GITHUB_OUTPUT"
          else
            KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "data: 시장 국면 진단 ${KST}"
            git push origin main || (git fetch origin main && git merge --ff-only origin/main && git push origin main)
            echo "fresh=yes" >> "$GITHUB_OUTPUT"
          fi

      # 봇 push 는 firebase-hosting.yml 을 트리거하지 않는다(깃허브 정책).
      # 값이 바뀐 날만 직접 배포한다.
      - name: 갱신됐으면 배포
        if: steps.commit.outputs.fresh == 'yes'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools --quiet
          firebase deploy --only hosting --project ezlong-541a8 --token "$FIREBASE_TOKEN" || true
