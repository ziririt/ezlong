name: Market Cycle 주봉 데이터 생성

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# 미국 정규장 마감(4PM ET) 후 1회 실행.
#
# 시점 — 장 마감 1시간 10분 후 (5:10 PM ET)
#   EDT(UTC-4): 21:10 UTC | EST(UTC-5): 22:10 UTC
#
# ※ 2026-07-03: GitHub native cron 복원.
#   배경 — cron-job.org 외부 트리거가 조용히 죽어 6/13 이후 19일간 데이터 정지 (유저 승인 하에 복원).
#   native cron은 GitHub 밖 서비스가 죽어도 계속 돈다. 주봉 데이터라 평일 1회면 충분.
#
# 주봉 데이터는 일일 변화가 미미하므로 하루 1회 실행으로 충분.
#

on:
  schedule:
    - cron: '10 21 * * 1-5'   # 21:10 UTC = 미국장 마감 후 (EDT 17:10 ET / KST 06:10)
    - cron: '10 22 * * 1-5'   # 22:10 UTC = EST(겨울) 대비 — concurrency로 중복 방지
  # 수동 실행 (비상용)
  workflow_dispatch:

jobs:
  fetch-weekly:
    runs-on: ubuntu-latest

    # 중복 실행 방지
    concurrency:
      group: market-cycle-weekly
      cancel-in-progress: false

    steps:
      # ── 1. 저장소 체크아웃 ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js 설치 ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. 주봉 데이터 수집 (재시도 3회) ──────────────────────────────
      - name: Run market cycle weekly data fetch
        run: |
          for attempt in 1 2 3; do
            echo "Market Cycle 주봉 수집 시도 ${attempt}/3..."
            if node scripts/generate-market-cycle.js; then
              echo "주봉 수집 성공 (시도 ${attempt})"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "실패. 30초 후 재시도..."
              sleep 30
            else
              echo "::error::Market Cycle 주봉 수집 3회 모두 실패"
              exit 1
            fi
          done

      # ── 4. 변경사항 커밋 및 푸시 ─────────────────────────────────────
      - name: Commit and push weekly OHLCV data
        run: |
          git config user.name "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"

          # 변경사항이 없으면 커밋 건너뜀
          # 2026-07-03 수정: 스크립트 산출물은 mc-ohlcv-*-weekly.json (6/14 mc- 접두사 개명)
          #   기존 패턴(data/ohlcv-*-weekly.json)은 다른 파이프라인 파일이라 생성물이 커밋되지 않았음
          git add data/mc-ohlcv-*-weekly.json
          if git diff --cached --quiet; then
            echo "변경 없음. 커밋 건너뜀."
            exit 0
          fi

          git commit -m "chore: Market Cycle 주봉 데이터 업데이트 $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          # git pull --rebase 금지 (CLAUDE.md Rule 16)
          git push origin main || (git fetch origin main && git merge -X ours origin/main --no-edit && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Market Cycle 주봉 데이터 수집 실패. GitHub Actions 로그에서 오류를 확인하세요."
          echo "::error::Yahoo Finance 응답 오류일 수 있습니다."
