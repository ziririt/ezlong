name: 긍정 vs 부정 몇대몇 — 자동 분석

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# 하루 5회 KST 기준 업데이트 (UTC = KST - 9h)
# ※ 차트분석 워크플로(fetch-us-chart-analysis.yml)와 Gemini API 키 공유
#   → 차트분석 실행 시간대(00:05~07:05, 17:05~23:05 KST)와 겹치지 않도록 배치
#
#   KST 08:20 = UTC 전날 23:20  → 차트분석 07:05 종료 후 안전 여유
#   KST 11:50 = UTC 02:50       → KR 차트분석 사이 간격
#   KST 16:20 = UTC 07:20       → US-open 17:05 시작 전 여유
#   KST 21:50 = UTC 12:50       → US 정규장 후 (차트분석과 일부 겹치나 허용)
#   KST 23:20 = UTC 14:20       → US 장 마감 후
#
# 주말 포함 매일 실행 (주말 시황도 선물·커뮤니티 영향 있음)
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '20 23 * * *'   # KST 08:20 (전날 23:20 UTC) — 차트분석 07:05 종료 후
    - cron: '50 2 * * *'    # KST 11:50 → KR 차트분석 사이
    - cron: '20 7 * * *'    # KST 16:20 → US-open 17:05 시작 전
    - cron: '50 12 * * *'   # KST 21:50 → US 정규장 후
    - cron: '20 14 * * *'   # KST 23:20 → US 장 마감 후

  # 수동 실행 허용 (GitHub Actions 탭 → Run workflow)
  workflow_dispatch:

jobs:
  analyze-and-update:
    runs-on: ubuntu-latest

    # 동시 실행 방지 — 같은 workflow 이미 실행 중이면 대기
    concurrency:
      group: market-scorecard
      cancel-in-progress: false

    steps:
      # ── 1. 저장소 체크아웃 ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python 설치 ────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. 의존성 설치 ────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install yfinance requests --quiet

      # ── 4. 분석 스크립트 실행 ─────────────────────────────────────────
      - name: Run market scorecard analysis
        run: python scripts/fetch-market-scorecard.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # ── 5. 변경사항 커밋 및 푸시 ──────────────────────────────────────
      # 주의: git reset --hard / git pull --rebase 절대 금지 (CLAUDE.md 규칙 16)
      - name: Commit and push JSON
        run: |
          git config user.name  "Market Scorecard Bot"
          git config user.email "scorecard-bot@ezlong.com"

          git add data/market-scorecard-data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀."
            exit 0
          fi
          KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          git commit -m "data: 긍정vs부정 분석 업데이트 ${KST}"
          git push origin main || (git fetch origin main && git merge origin/main -X ours --no-edit && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Firebase Hosting 배포 ──────────────────────────────────────
      # GITHUB_TOKEN으로 push된 커밋은 firebase-hosting.yml을 트리거하지 않음 (GitHub 정책).
      # FirebaseExtended/action-hosting-deploy 서비스 계정 인증 실패 → CI 토큰 방식으로 교체.
      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools --quiet
          OUTPUT=$(firebase deploy --only hosting --project ezlong-541a8 --token "${{ secrets.FIREBASE_CI_TOKEN }}" 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            # "이미 동일한 버전이 활성화됨" → 실질적으로 배포 성공 상태이므로 0으로 처리
            echo "$OUTPUT" | grep -q "is the current active version" && echo "이미 최신 버전 배포 중 — 정상." && exit 0
            exit $EXIT_CODE
          fi

      # ── 7. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::긍정 vs 부정 분석 실패. Gemini API 키 또는 yfinance 오류 확인 필요."
