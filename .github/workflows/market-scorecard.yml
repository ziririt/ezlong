name: 긍정 vs 부정 몇대몇 — 자동 분석

# ─── 스케줄 설명 (2026-07-31 유저 확정 개편) ─────────────────────────────────
# 하루 8회, KST 기준: 06:30(장마감+1.5h) · 09:30 · 12:00 · 15:30 · 18:00 · 21:30
#                    · 00:00 · 05:00(장마감 직후)
# 실행 조건: 한국 또는 미국 어느 한쪽이라도 평일이면 실행 (둘 다 주말이면 스킵)
#   — cron 요일 계산 대신 잡 안의 "요일 게이트" 스텝이 KST/ET 요일을 직접 판정.
#   예: 토요일 오전 KST(=미국 금요일 밤·마감 직후)는 실행, 일요일은 전부 스킵,
#       월요일 00:00·05:00 KST(=미국 일요일)는 한국이 평일이라 실행.
# 09:30 잡은 기상 후 텔레그램 TV 리포트(data/tv-inbox/) 반영 역할을 겸함(구 07:15 잡 대체).
# GitHub cron은 수 분 지연될 수 있음 — 표기 시각은 목표 시각.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '30 21 * * *'   # KST 06:30 (UTC 전날 21:30) — 장마감 후 1시간 반
    - cron: '30 0 * * *'    # KST 09:30
    - cron: '0 3 * * *'     # KST 12:00
    - cron: '30 6 * * *'    # KST 15:30
    - cron: '0 9 * * *'     # KST 18:00
    - cron: '30 12 * * *'   # KST 21:30
    - cron: '0 15 * * *'    # KST 00:00
    - cron: '0 20 * * *'    # KST 05:00 — 장마감 직후

  # 수동 실행 허용 (GitHub Actions 탭 → Run workflow)
  workflow_dispatch:

jobs:
  analyze-and-update:
    runs-on: ubuntu-latest

    # 동시 실행 방지 — 같은 workflow 이미 실행 중이면 대기
    concurrency:
      group: market-scorecard
      cancel-in-progress: false

    steps:
      # ── 1. 저장소 체크아웃 ─────────────────────────────────────────────
      - name: 요일 게이트 — 한국·미국 모두 주말이면 스킵
        id: gate
        run: |
          KR=$(TZ=Asia/Seoul date +%u); US=$(TZ=America/New_York date +%u)
          if [ "$KR" -ge 6 ] && [ "$US" -ge 6 ]; then
            echo "run=no"  >> "$GITHUB_OUTPUT"; echo "둘 다 주말(KR=$KR US=$US) — 스킵"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python 설치 ────────────────────────────────────────────────
      - name: Setup Python
        if: steps.gate.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. 의존성 설치 ────────────────────────────────────────────────
      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        run: pip install yfinance requests feedparser --quiet

      # ── 4. 분석 스크립트 실행 ─────────────────────────────────────────
      - name: Run market scorecard analysis
        if: steps.gate.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch-market-scorecard.py
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          ALPHAVANTAGE_API_KEY:  ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}

      # ── 5. 변경사항 커밋 및 푸시 ──────────────────────────────────────
      # 주의: git reset --hard / git pull --rebase 절대 금지 (CLAUDE.md 규칙 16)
      - name: Commit and push JSON
        if: steps.gate.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "Market Scorecard Bot"
          git config user.email "scorecard-bot@ezlong.com"

          git add data/market-scorecard-data.json data/judgment-history-scorecard.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀."
            exit 0
          fi
          KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          git commit -m "data: 긍정vs부정 분석 업데이트 ${KST}"
          git push origin main || (git fetch origin main && git merge origin/main -X ours --no-edit && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Firebase Hosting 배포 ──────────────────────────────────────
      # GITHUB_TOKEN으로 push된 커밋은 firebase-hosting.yml을 트리거하지 않음 (GitHub 정책).
      # 토큰을 env로 전달해 GitHub 마스킹 오작동 방지.
      - name: Deploy to Firebase Hosting
        if: steps.gate.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools --quiet
          echo "=== Firebase CLI 버전 ==="
          firebase --version
          echo "=== 배포 시작 ==="
          firebase deploy --only hosting --project ezlong-541a8 --token "$FIREBASE_TOKEN" || true
          echo "=== 배포 스텝 완료 ==="

      # ── 7. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::긍정 vs 부정 분석 실패. Gemini API 키 또는 yfinance 오류 확인 필요."
