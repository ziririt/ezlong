name: 긍정 vs 부정 몇대몇 — 자동 분석

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# 평일(월~금) 하루 5회 KST 기준 업데이트 (UTC = KST - 9h)
#   KST 06:50 = UTC 전날 21:50  → 07:00에 결과 준비 (아침 프리마켓 전)
#   KST 11:50 = UTC 02:50       → 12:00에 결과 준비
#   KST 18:20 = UTC 09:20       → 18:30에 결과 준비
#   KST 21:50 = UTC 12:50       → 22:00에 결과 준비
#   KST 23:20 = UTC 14:20       → 23:30에 결과 준비
#
# 주말(토·일)은 하루 1회만 — KST 09:00 = UTC 00:00 (2026-07-04 변경)
# 이유: 주말은 정규장이 없어 5회씩 돌릴 실익이 적음. 오전 한 번으로 축소.
#
# ⚠ cron day-of-week(dow) 요일 계산 주의 — UTC와 KST 날짜가 다를 수 있음
#   06:50 KST 잡은 UTC 기준 "전날 21:50"에 실행되므로, KST 월~금을 걸려면
#   UTC dow는 하루 당겨서 일~목(0,1,2,3,4)을 써야 한다.
#   나머지 4개 잡(11:50/18:20/21:50/23:20 KST)은 UTC 실행 시각이 같은 날짜라
#   dow가 KST 요일과 그대로 일치하므로 월~금(1-5)을 그대로 쓴다.
#   09:00 KST 주말 잡도 UTC 00:00으로 같은 날짜라 dow가 그대로 일치, 토·일(0,6).
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '15 22 * * 0,1,2,3,4'  # KST 월~금 07:15 (UTC 전날 22:15, dow는 하루 당김) → 07:15 즉시
    # 2026-07-15: 06:50(07:00준비)→07:15로 조정. 사용자가 기상(07:00) 후 텔레그램으로
    # 전달하는 TV 리포트(data/tv-inbox/)를 fetch_tv_inbox()가 반영할 시간을 확보하기 위함.
    - cron: '50 2 * * 1-5'         # KST 월~금 11:50 → 12:00 준비
    - cron: '20 9 * * 1-5'         # KST 월~금 18:20 → 18:30 준비
    - cron: '50 12 * * 1-5'        # KST 월~금 21:50 → 22:00 준비
    - cron: '20 14 * * 1-5'        # KST 월~금 23:20 → 23:30 준비
    - cron: '0 0 * * 0,6'          # KST 토·일 09:00 (UTC 00:00, 같은 날짜) → 주말 하루 1회

  # 수동 실행 허용 (GitHub Actions 탭 → Run workflow)
  workflow_dispatch:

jobs:
  analyze-and-update:
    runs-on: ubuntu-latest

    # 동시 실행 방지 — 같은 workflow 이미 실행 중이면 대기
    concurrency:
      group: market-scorecard
      cancel-in-progress: false

    steps:
      # ── 1. 저장소 체크아웃 ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python 설치 ────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. 의존성 설치 ────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install yfinance requests feedparser --quiet

      # ── 4. 분석 스크립트 실행 ─────────────────────────────────────────
      - name: Run market scorecard analysis
        run: python scripts/fetch-market-scorecard.py
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          ALPHAVANTAGE_API_KEY:  ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}

      # ── 5. 변경사항 커밋 및 푸시 ──────────────────────────────────────
      # 주의: git reset --hard / git pull --rebase 절대 금지 (CLAUDE.md 규칙 16)
      - name: Commit and push JSON
        run: |
          git config user.name  "Market Scorecard Bot"
          git config user.email "scorecard-bot@ezlong.com"

          git add data/market-scorecard-data.json data/judgment-history-scorecard.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀."
            exit 0
          fi
          KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          git commit -m "data: 긍정vs부정 분석 업데이트 ${KST}"
          git push origin main || (git fetch origin main && git merge origin/main -X ours --no-edit && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Firebase Hosting 배포 ──────────────────────────────────────
      # GITHUB_TOKEN으로 push된 커밋은 firebase-hosting.yml을 트리거하지 않음 (GitHub 정책).
      # 토큰을 env로 전달해 GitHub 마스킹 오작동 방지.
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools --quiet
          echo "=== Firebase CLI 버전 ==="
          firebase --version
          echo "=== 배포 시작 ==="
          firebase deploy --only hosting --project ezlong-541a8 --token "$FIREBASE_TOKEN" || true
          echo "=== 배포 스텝 완료 ==="

      # ── 7. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::긍정 vs 부정 분석 실패. Gemini API 키 또는 yfinance 오류 확인 필요."
