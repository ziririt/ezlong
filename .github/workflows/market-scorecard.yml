name: 긍정 vs 부정 몇대몇 — 자동 분석

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# 하루 5회 KST 기준 업데이트 (UTC = KST - 9h)
#   KST 07:00 = UTC 전날 22:00
#   KST 12:00 = UTC 03:00
#   KST 18:30 = UTC 09:30
#   KST 22:00 = UTC 13:00
#   KST 23:30 = UTC 14:30
#
# 주말 포함 매일 실행 (주말 시황도 선물·커뮤니티 영향 있음)
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '0 22 * * *'    # KST 07:00 (전날 22:00 UTC)
    - cron: '0 3 * * *'     # KST 12:00
    - cron: '30 9 * * *'    # KST 18:30
    - cron: '0 13 * * *'    # KST 22:00
    - cron: '30 14 * * *'   # KST 23:30

  # 수동 실행 허용 (GitHub Actions 탭 → Run workflow)
  workflow_dispatch:

jobs:
  analyze-and-update:
    runs-on: ubuntu-latest

    # 동시 실행 방지 — 같은 workflow 이미 실행 중이면 대기
    concurrency:
      group: market-scorecard
      cancel-in-progress: false

    steps:
      # ── 1. 저장소 체크아웃 ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python 설치 ────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. 의존성 설치 ────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install yfinance requests --quiet

      # ── 4. 분석 스크립트 실행 ─────────────────────────────────────────
      - name: Run market scorecard analysis
        run: python scripts/fetch-market-scorecard.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # ── 5. 변경사항 커밋 및 푸시 ──────────────────────────────────────
      # 주의: git reset --hard / git pull --rebase 절대 금지 (CLAUDE.md 규칙 16)
      - name: Commit and push JSON
        run: |
          git config user.name  "Market Scorecard Bot"
          git config user.email "scorecard-bot@ezlong.com"

          git add data/market-scorecard-data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀."
            exit 0
          fi
          KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          git commit -m "data: 긍정vs부정 분석 업데이트 ${KST}"
          git push origin main || (git fetch origin main && git merge --ff-only origin/main && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::긍정 vs 부정 분석 실패. Gemini API 키 또는 yfinance 오류 확인 필요."
