name: Fetch Real-time Stock Prices

on:
  # [보류 2026-10-19: 심플 주가] 예약 실행 중지. 수동 실행(workflow_dispatch)만 남긴다. 복구 절차: docs/RESTORE-stocks.md
  # schedule:
    # ── 장중·프리마켓·포스트마켓 (Mon–Fri, 3am–6pm ET = 8am–23pm UTC)
  #  - cron: '*/10 8-23 * * 1-5'
    # ── 포스트마켓 후반·나이트마켓 (Mon–Fri, 7pm–11:50pm ET = 0–4am UTC 다음날 Tue–Sat)
  #  - cron: '*/10 0-4 * * 2-6'
    # ── 정규장 종가 확정 스냅샷 (Mon–Fri, 4:05 PM ET = 20:05 UTC) — day.c 포스트마켓 오염 전
  #  - cron: '5 20 * * 1-5'
  workflow_dispatch:   # 수동 실행 허용

concurrency:
  group: stocks-prices        # 동일 워크플로우 동시 실행 방지
  cancel-in-progress: true    # 대기 중인 실행 취소 — 항상 최신 데이터만 커밋

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance --quiet

      - name: Setup Node.js for Firebase deploy
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 2026-10-16 개정: 한 번 깨어나면 정규장 동안 15분 간격으로 두 번 받는다 ──
      # 실측(10/14~10/15): 위 10분 크론은 깃허브가 거의 돌려 주지 않았다. 실제 갱신은
      # 감시견(cron-job.org, 매시 :17·:47)의 되살리기뿐이었고 기준이 45분이라
      # 사실상 한 시간에 한 번이었다. 화면은 "15분마다 업데이트"라고 말하고 있었다.
      # 감시견 기준을 12분으로 내려 30분마다 깨우고, 깨어난 실행이 정규장 중이면
      # 14분 쉬었다가 한 번 더 받는다 - 정규장 체감 주기 15분, 시간외는 30분.
      # 실패는 회차별로 따로 다룬다: 2회차 실패가 1회차 커밋을 되돌리지 않는다.
      - name: 받기 · 커밋 · 배포 (정규장이면 15분 뒤 한 번 더)
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FB_READY=""; DEPLOY_FAIL_R1=""
          T0=$(date +%s)
          for ROUND in 1 2; do
            echo "── ${ROUND}회차 $(TZ=America/New_York date '+%H:%M ET')"
            # 배포 열쇠는 수집 스크립트(및 그 의존 패키지)에 넘기지 않는다
            env -u FIREBASE_TOKEN python scripts/fetch-stocks-prices.py
            git add data/stocks-prices.json
            if git diff --staged --quiet; then
              echo "변경 없음 - 커밋 생략"
            else
              KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
              git commit -q -m "data: stocks-prices.json ${KST}"
              bash scripts/git-push-retry.sh
              if [ -z "$FB_READY" ]; then
                # 주 버전 15 고정 - firebase-hosting.yml 과 같은 이유(--token 은 16 에서 제거 예정)
                for i in 1 2 3; do
                  npm install -g firebase-tools@15 --quiet && { FB_READY=1; break; }
                  echo "::warning::firebase-tools 설치 실패 $i/3 - 20초 뒤 재시도"; sleep 20
                done
              fi
              if [ -n "$FB_READY" ] && firebase deploy --only hosting --project ezlong-541a8 --token "$FIREBASE_TOKEN"; then
                echo "${ROUND}회차 배포 완료"
              elif [ "$ROUND" = "1" ]; then
                # 1회차 실패는 숨기지 않는다 - 끝에서 잡을 빨갛게 만든다(토큰 만료 같은 사고를 메일로 받게)
                DEPLOY_FAIL_R1=1; echo "::error::1회차 배포 실패"
              else
                echo "::warning::2회차 배포 실패 - 다음 커밋의 배포가 함께 싣는다"
              fi
            fi
            [ "$ROUND" = "2" ] && break
            ET_DOW=$(TZ=America/New_York date +%u)
            ET_MIN=$(( 10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M) ))
            # 1회차 시작으로부터 14분 뒤에 두 번째를 받는다. 그때도 16:10 ET 전이어야 한다
            # (종가 확정 스냅샷은 별도 크론). 수집·배포에 걸린 시간만큼 덜 쉰다 -
            # 감시견이 30분마다 깨우므로 두 회차가 그 사이를 고르게 나눠야 15분이 된다.
            if [ "$ET_DOW" -le 5 ] && [ "$ET_MIN" -ge 570 ] && [ "$ET_MIN" -le 955 ]; then
              WAIT=$(( 840 - ( $(date +%s) - T0 ) )); [ "$WAIT" -lt 0 ] && WAIT=0
              echo "정규장 중 - ${WAIT}초 뒤 한 번 더"; sleep "$WAIT"
              git pull -q --rebase origin main || git rebase --abort || true
            else
              echo "정규장 밖 - 한 번으로 끝"; break
            fi
          done
          [ -z "$DEPLOY_FAIL_R1" ] || exit 1
