name: Fetch Real-time Stock Prices

on:
  schedule:
    # ── 장중·프리마켓·포스트마켓 (Mon–Fri, 3am–6pm ET = 8am–23pm UTC)
    - cron: '*/10 8-23 * * 1-5'
    # ── 포스트마켓 후반·나이트마켓 (Mon–Fri, 7pm–11:50pm ET = 0–4am UTC 다음날 Tue–Sat)
    - cron: '*/10 0-4 * * 2-6'
    # ── 정규장 종가 확정 스냅샷 (Mon–Fri, 4:05 PM ET = 20:05 UTC) — day.c 포스트마켓 오염 전
    - cron: '5 20 * * 1-5'
  workflow_dispatch:   # 수동 실행 허용

concurrency:
  group: stocks-prices        # 동일 워크플로우 동시 실행 방지
  cancel-in-progress: true    # 대기 중인 실행 취소 — 항상 최신 데이터만 커밋

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance --quiet

      - name: Run fetch-stocks-prices.py
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/fetch-stocks-prices.py

      - name: Commit stocks-prices.json
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks-prices.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "data: stocks-prices.json ${KST}"
            git push origin main || (git fetch origin main && git merge --no-ff -X ours origin/main --no-edit && git push origin main)
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js for Firebase deploy
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Firebase Hosting
        if: steps.commit.outputs.changed == 'true'
        run: |
          npm install -g firebase-tools --quiet
          firebase deploy --only hosting --project ezlong-541a8 --token "${{ secrets.FIREBASE_TOKEN }}"
