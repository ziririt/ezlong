name: swing-view
# 스윙 수석 뷰 (베타, atmr-dashboard_v2.html 전용) — 기존 파이프라인과 완전 분리
on:
  schedule:
    - cron: '45 20 * * 1-5'   # 미국 장마감(EDT 16:00)+45분 = 05:45 KST — 여름 본실행 (유저 확정)
    - cron: '45 21 * * 1-5'   # 미국 장마감(EST 16:00)+45분 = 06:45 KST — 겨울 본실행 / 여름엔 보조 갱신
    - cron: '37 22 * * 1-5'   # 07:37 KST — 차트분석 엔진(~06:52 KST) 반영 재갱신 (상태 전진은 하루 1회뿐)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/generate-swing-view.py']
concurrency:
  group: swing-view
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Generate swing view
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate-swing-view.py
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing-ledger.json data/swing-view.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "data: swing-view ${KST}"
            git push origin main || (git fetch origin main && git merge --ff-only origin/main && git push origin main)
          fi
