name: swing-view
# 스윙 수석 뷰 (베타, atmr-dashboard_v2.html 전용) — 기존 파이프라인과 완전 분리
on:
  schedule:
    # ── 2026-09-23 대폭 축소 (오너 지시, API 비용) ──────────────────────
    # 왜: 2026-09 실측으로 이 파이프라인이 평일 하루 4.46달러, 월 100달러를
    # 넘겼다. 실행마다 데스크(LLM)가 논평을 새로 쓰는데 평일 14번 돌았다.
    # 지시 원문: "장중은 한국 시각 12시까지만, 그 뒤로는 하지 마라.
    #            마감 후에도 1번만."
    # 남긴 슬롯은 셋이다(평일):
    #   ① 18:00 KST 프리마켓  ② 개장 +15분(자정 전)  ③ 07:37 KST 마감 후 1회
    # 계절 때문에 ②는 크론이 둘이지만, 아래 gate 잡이 ET 시각으로 걸러
    # 한 계절에 하나만 실제로 돈다.
    - cron: '0  9 * * 1-5'    # 18:00 KST 프리마켓 (여름 ET 05:00 / 겨울 ET 04:00)
    - cron: '45 13 * * 1-5'   # 22:45 KST = 여름 ET 09:45 (개장 +15분)
    - cron: '45 14 * * 1-5'   # 23:45 KST = 겨울 ET 09:45 (개장 +15분)
    - cron: '37 22 * * 1-5'   # 07:37 KST 마감 후 1회 — 차트분석 엔진(~06:52)까지 반영된 시점
    # ── 2026-08-08 추가: 주말 '새 주 전망' ────────────────────────────
    # 미국장은 금 마감 후 월요일까지 열리지 않는다. 그 사이 카드는 금요일 글을
    # 계속 걸고 있었다. 화면은 보는 사람의 현지 일요일 오전부터 '새 주 전망'으로
    # 바뀌므로(ez-nav.js ezWeekPhase), 가장 이른 시간대(UTC+14)의 일요일 오전
    # 전에 한 벌 구워둔다. 스크립트가 forDay 로 중복 생성을 막아 주말당 1회다.
    - cron: '0 18 * * 6'      # 토 18:00 UTC = 일 03:00 KST — 본실행
    - cron: '0  6 * * 0'      # 일 06:00 UTC = 일 15:00 KST — 늦은 시간대 보조
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/generate-swing-view.py', '.github/workflows/swing-view.yml']
concurrency:
  group: swing-view
  cancel-in-progress: false
jobs:
  # ── 슬롯 판정 (2026-09-23) ────────────────────────────────────────────
  # 계절마다 크론이 한 시간씩 어긋나 KST 크론을 둘 걸어 둔다. 실제 실행은
  # ET 시각으로 가린다 - 그래야 한 계절에 하나만 돈다. 예약 실행만 가리고,
  # 수동 실행·push 는 언제나 돈다(감시견의 되살리기가 수동 실행 경로다).
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.slot.outputs.go }}
    steps:
      - name: 이 시각이 도는 슬롯인가
        id: slot
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "수동·push 실행 - 그대로 진행"; echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ET_DOW=$(TZ=America/New_York date +%u)
          ET_MIN=$(( 10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M) ))
          if [ "$ET_DOW" -ge 6 ]; then
            echo "주말 - 새 주 전망 슬롯"; echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 프리마켓 04:00~05:30 · 개장+15분 09:30~10:05 · 마감 후 17:30~19:00 (ET)
          if { [ "$ET_MIN" -ge 240 ] && [ "$ET_MIN" -le 330 ]; } \
          || { [ "$ET_MIN" -ge 570 ] && [ "$ET_MIN" -le 605 ]; } \
          || { [ "$ET_MIN" -ge 1050 ] && [ "$ET_MIN" -le 1140 ]; }; then
            echo "ET ${ET_MIN} 분 - 도는 슬롯"; echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ET ${ET_MIN} 분 - 계절이 다른 크론이다. 건너뛴다"; echo "go=no" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Generate swing view
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate-swing-view.py
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing-ledger.json data/swing-view.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "data: swing-view ${KST}"
            # 2026-08-04 수정: 기존 재시도(ff-only merge)는 "로컬에 방금 만든 커밋이
            # 있는" 상태에선 원리적으로 성공 불가(브랜치 분기 → ff 불가) — 생성에
            # ~1분 걸리는 이 워크플로는 봇 커밋 경합에 자주 걸려 3연속 실패했다.
            # 커밋을 마친 상태이므로 unstaged 파일이 없어 rebase가 안전하다
            # (CLAUDE.md 16항이 금지한 'pull --rebase' 실패 조건은 unstaged 파일 —
            # 여기 해당 없음. reset --hard/force push는 여전히 사용하지 않는다).
            # 이 워크플로만 건드리는 데이터 파일이라 rebase 충돌 가능성도 없다.
            # 2026-09-23: 세 번 재시도도 봇 경합에 졌다. 공용 스크립트로 옮긴다
            #            (다섯 번 + 무작위 대기). 재시도 규칙이 워크플로마다 다르면
            #            어느 하나는 반드시 뒤처진다(8항: 공유 함수는 한 벌만 둔다).
            bash scripts/git-push-retry.sh
          fi
