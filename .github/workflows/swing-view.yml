name: swing-view
# 스윙 수석 뷰 (베타, atmr-dashboard_v2.html 전용) — 기존 파이프라인과 완전 분리
on:
  schedule:
    # ── 장 마감 후 (기존) ────────────────────────────────────────────────
    - cron: '45 20 * * 1-5'   # 미국 장마감(EDT 16:00)+45분 = 05:45 KST — 여름 본실행 (유저 확정)
    - cron: '45 21 * * 1-5'   # 미국 장마감(EST 16:00)+45분 = 06:45 KST — 겨울 본실행 / 여름엔 보조 갱신
    - cron: '37 22 * * 1-5'   # 07:37 KST — 차트분석 엔진(~06:52 KST) 반영 재갱신
    # ── 2026-08-05 추가: 프리마켓·장중 갱신 (운영 지침) ────────────────
    # 배경: 숫자(market-signals)는 30분마다 갱신되는데 판단·코멘트(swing-view)는
    # 마감 후에만 돌아, 장중에 보면 화면의 판단과 실제 시세가 어긋났다.
    # 상태 전진(advance)은 스크립트가 거래일 1회로 막아두었으므로 몇 번을 돌려도
    # 원장은 안전하다 — 뷰만 새로 그린다.
    - cron: '0  9 * * 1-5'    # 18:00 KST 프리마켓 (여름 EDT 05:00 ET / 겨울 04:00 ET)
    - cron: '45 13 * * 1-5'   # 22:45 KST 장 시작 +15분 (여름 EDT)
    - cron: '45 14 * * 1-5'   # 23:45 KST 장 시작 +15분 (겨울 EST) / 여름엔 장중 보조
    - cron: '50 14 * * 1-5'   # 23:50 KST 장중 1
    - cron: '0  16 * * 1-5'   # 01:00 KST 장중 2
    # ── 2026-08-07 추가: 장중 매시 실행 ────────────────────────────────
    # 배경: 깃허브 예약 실행은 밀리거나 통째로 건너뛴다. 2026-08-06 에는
    # 22:45·23:45·23:50 KST 세 슬롯이 전부 안 돌았고, 18:00 슬롯이 20:15 에야
    # 돌았다. 그 결과 01:09 KST(장중)에 프리마켓 시점 논평이 걸려 있었다.
    # 스케줄러를 우리가 고칠 수는 없으니 슬롯을 늘려 확률로 덮는다. 한 번에
    # 1~2분이고 원장 전진은 거래일 1회로 막혀 있어 몇 번을 더 돌려도 안전하다.
    - cron: '30 17 * * 1-5'   # 02:30 KST
    - cron: '30 18 * * 1-5'   # 03:30 KST
    - cron: '30 19 * * 1-5'   # 04:30 KST
    # ── 2026-08-08 추가: 주말 '새 주 전망' ────────────────────────────
    # 미국장은 금 마감 후 월요일까지 열리지 않는다. 그 사이 카드는 금요일 글을
    # 계속 걸고 있었다. 화면은 보는 사람의 현지 일요일 오전부터 '새 주 전망'으로
    # 바뀌므로(ez-nav.js ezWeekPhase), 가장 이른 시간대(UTC+14)의 일요일 오전
    # 전에 한 벌 구워둔다. 스크립트가 forDay 로 중복 생성을 막아 주말당 1회다.
    - cron: '0 18 * * 6'      # 토 18:00 UTC = 일 03:00 KST — 본실행
    - cron: '0  6 * * 0'      # 일 06:00 UTC = 일 15:00 KST — 늦은 시간대 보조
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/generate-swing-view.py', '.github/workflows/swing-view.yml']
concurrency:
  group: swing-view
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Generate swing view
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate-swing-view.py
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing-ledger.json data/swing-view.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "data: swing-view ${KST}"
            # 2026-08-04 수정: 기존 재시도(ff-only merge)는 "로컬에 방금 만든 커밋이
            # 있는" 상태에선 원리적으로 성공 불가(브랜치 분기 → ff 불가) — 생성에
            # ~1분 걸리는 이 워크플로는 봇 커밋 경합에 자주 걸려 3연속 실패했다.
            # 커밋을 마친 상태이므로 unstaged 파일이 없어 rebase가 안전하다
            # (CLAUDE.md 16항이 금지한 'pull --rebase' 실패 조건은 unstaged 파일 —
            # 여기 해당 없음. reset --hard/force push는 여전히 사용하지 않는다).
            # 이 워크플로만 건드리는 데이터 파일이라 rebase 충돌 가능성도 없다.
            ok=""
            for i in 1 2 3; do
              if git push origin main; then ok=1; break; fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort; echo "::error::rebase 충돌 — 수동 확인 필요"; break; }
              sleep 3
            done
            if [ -z "$ok" ]; then echo "::error::push 3회 재시도 실패 (커밋 경합)"; exit 1; fi
          fi
