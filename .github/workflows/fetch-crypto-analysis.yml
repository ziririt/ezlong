name: 암호화폐 차트 분석 생성

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# cron-job.org 가 매시 :05분에 workflow_dispatch로 트리거 (24시간 365일)
# cron 표현식: 5 * * * * (Asia/Seoul — 주말 포함 매일 24회)
#
# ※ :05 비표준 분수 사용 — GitHub Actions cron은 :00/:10/:15/:30/:45에
#   전 세계 job이 폭주해 지연/스킵이 발생함. :05는 큐 혼잡이 현저히 낮음.
#
# 크립토는 주말·공휴일 관계없이 365일 24시간 거래 → 거래일 체크 없음
#

on:
  # ── cron-job.org 가 GitHub API workflow_dispatch 를 직접 트리거함 ──────
  # 트리거 URL: POST https://api.github.com/repos/ziririt/ezlong/actions/workflows/fetch-crypto-analysis.yml/dispatches
  # 실행 주기: 매시 :05분 (KST), 7일 24시간

  workflow_dispatch:

jobs:
  analyze:
    name: 크립토 차트 분석
    runs-on: ubuntu-latest

    concurrency:
      group: crypto-analysis
      cancel-in-progress: false

    steps:
      # ── 1. 저장소 체크아웃 ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js 설치 ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 크립토 업데이트 시간 체크 (KST 06:00~01:00) ─────────────────────
      - name: Check crypto update window
        id: time_check
        run: |
          KST_HOUR=$(TZ=Asia/Seoul date +%H)
          echo "현재 KST 시각: ${KST_HOUR}시"
          # 새벽 01시~05시(KST 01~05)는 건너뜀
          if [ "$KST_HOUR" -ge "1" ] && [ "$KST_HOUR" -lt "6" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "크립토 비활성 시간대 (KST ${KST_HOUR}시, 01~05시 비활성). 건너뜀."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "크립토 업데이트 활성 (KST ${KST_HOUR}시)"
          fi

      # ── DEBUG: Gemini API 직접 테스트 ────────────────────────────
      - name: Debug Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== v1 모델 목록 ==="
          curl -s "https://generativelanguage.googleapis.com/v1/models?key=$GEMINI_API_KEY" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(m.get('name','')) for m in d.get('models',[])]" 2>&1 | head -10 || echo "목록 실패"
          echo "=== gemini-flash-latest 테스트 ==="
          curl -s -X POST "https://generativelanguage.googleapis.com/v1/models/gemini-flash-latest:generateContent?key=$GEMINI_API_KEY" -H "Content-Type: application/json" -d '{"contents":[{"parts":[{"text":"Say OK"}]}],"generationConfig":{"maxOutputTokens":5}}' | head -c 300

            # ── 3. 암호화폐 차트 분석 (재시도 3회) ───────────────────────────
      - name: Run crypto chart analysis
        if: steps.time_check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "크립토 분석 시도 ${attempt}/3..."
            if node scripts/generate-chart-analysis.js crypto; then
              echo "크립토 분석 성공 (시도 ${attempt})"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "실패. 30초 후 재시도..."
              sleep 30
            else
              echo "::error::크립토 분석 3회 모두 실패"
              exit 1
            fi
          done

      # ── 4. 변경사항 커밋 및 푸시 ─────────────────────────────────────
      - name: Commit and push analysis data
        if: steps.time_check.outputs.skip != 'true'
        run: |
          git config user.name "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"

          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음. 커밋 건너뜀."
            exit 0
          fi

          git commit -m "chore: 크립토 차트 분석 업데이트 $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push 재시도 $i/3..."
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::크립토 차트 분석 실패. GitHub Actions 로그에서 오류를 확인하세요."
          echo "::error::Yahoo Finance 응답 오류 또는 Gemini API 키 문제일 수 있습니다."
