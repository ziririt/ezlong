name: 암호화폐 차트 분석 생성

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# KST 06:00~24:00 구간, 3시간 간격 6회 실행 (GitHub Actions 자체 cron)
#
# KST 시각  │ UTC    │ 비고
# 06:05 KST │ 21:05  │ 아침 (전날 UTC 기준)
# 09:05 KST │ 00:05  │ 오전 (한국 장 시작)
# 12:05 KST │ 03:05  │ 오후
# 15:05 KST │ 06:05  │ 한국 장마감 직후
# 18:05 KST │ 09:05  │ 저녁 (미국 프리마켓)
# 21:05 KST │ 12:05  │ 밤 (미국 장중)
#
# ※ cron-job.org 잡 비활성화 필요 (중복 실행 방지)
# 비용 절감: ~19회/일 → 6회/일 (68% 절감)
#

on:
  schedule:
    - cron: '5 21 * * *'   # KST 06:05
    - cron: '5 0  * * *'   # KST 09:05
    - cron: '5 3  * * *'   # KST 12:05
    - cron: '5 6  * * *'   # KST 15:05
    - cron: '5 9  * * *'   # KST 18:05
    - cron: '5 12 * * *'   # KST 21:05

  workflow_dispatch:

jobs:
  analyze:
    name: 크립토 차트 분석
    runs-on: ubuntu-latest

    concurrency:
      group: crypto-analysis
      cancel-in-progress: false

    steps:
      # ── 1. 저장소 체크아웃 ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js 설치 ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --production

      # ── 3. 암호화폐 차트 분석 (재시도 3회) ───────────────────────────
      - name: Run crypto chart analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "크립토 분석 시도 ${attempt}/3..."
            if node scripts/generate-chart-analysis.js crypto; then
              echo "크립토 분석 성공 (시도 ${attempt})"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "실패. 30초 후 재시도..."
              sleep 30
            else
              echo "::error::크립토 분석 3회 모두 실패"
              exit 1
            fi
          done

      # ── 4. 변경사항 커밋 및 푸시 ─────────────────────────────────────
      - name: Commit and push analysis data
        run: |
          git config user.name "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"

          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음. 커밋 건너뜀."
            exit 0
          fi

          git commit -m "chore: 크립토 차트 분석 업데이트 $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          git push origin main || (git fetch origin main && git merge -X ours origin/main --no-edit && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::크립토 차트 분석 실패. GitHub Actions 로그에서 오류를 확인하세요."
          echo "::error::Yahoo Finance 응답 오류 또는 Gemini API 키 문제일 수 있습니다."
