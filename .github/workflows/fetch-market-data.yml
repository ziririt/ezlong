name: ATMR 시장 데이터 수집

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# 미국 장 시간(KST 22:30~05:00) 동안 15분 간격으로 수집.
# 장 외 시간에는 하루 2회 수집 (프리마켓·장후 기준점용).
#
# 장중 15분 간격:
#   */30 13-21 * * 1-5 (UTC) — EDT·EST 모두 커버 (US 장: 13:30~20:00 or 14:30~21:00 UTC)
#
# 장 외 보조 수집:
#   KST 17:05 (프리마켓)  → 여름 08:05 UTC / 겨울 09:05 UTC
#   KST 05:05 (장후 마감) → 여름 20:05 UTC / 겨울 21:05 UTC
#
# DST 전환 구간 중복 실행 시 concurrency 설정으로 무해하게 처리됩니다.
#
on:
  schedule:
    # ── 장중 15분 간격 (UTC 13~21시, 월~금) ─────────────────────────────────
    # 여름(EDT): US장 13:30~20:00 UTC / 겨울(EST): US장 14:30~21:00 UTC
    # 양쪽 모두 커버. 장 전후 약간 여유 포함 (무해)
    - cron: '*/30 13-21 * * 1-5'

    # ── 장 외 보조 수집 (프리마켓 · 장후) ────────────────────────────────────
    - cron: '5  8 * * 1-5'   # 17:05 KST 프리마켓 (여름 EDT)
    - cron: '5  9 * * 1-5'   # 17:05 KST 프리마켓 (겨울 EST)
    - cron: '5 20 * * 1-5'   # 05:05 KST 장후 마감 (여름 EDT)
    - cron: '5 21 * * 1-5'   # 05:05 KST 장후 마감 (겨울 EST)

  # 수동 실행 허용 (GitHub → Actions 탭에서 "Run workflow" 클릭)
  workflow_dispatch:

  # 수집 스크립트·이 워크플로 자체가 변경되면 즉시 1회 실행 — 심볼 추가 등
  # 변경분이 다음 정기 주기까지 기다리지 않고 바로 데이터에 반영되도록
  # (swing-view.yml의 기존 push-paths 패턴과 동일, 2026-08-03 도입)
  push:
    branches: [main]
    paths: ['scripts/fetch-market-data.py', '.github/workflows/fetch-market-data.yml']

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    # 중복 실행 방지: 같은 workflow가 이미 실행 중이면 건너뜀
    concurrency:
      group: fetch-market-data
      cancel-in-progress: false

    steps:
      # ── 1. 저장소 체크아웃 ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python 설치 ────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. yfinance 설치 ──────────────────────────────────────────────
      - name: Install dependencies
        run: pip install yfinance --quiet

      # ── 4. 데이터 수집 실행 ────────────────────────────────────────────
      # GEMINI_API_KEY: 스윙 연속성 서술(swingContinuity) 생성용 (2026-07-09 추가).
      # 키가 없거나 호출 실패해도 스크립트는 죽지 않고 swingContinuity만 null로 저장된다.
      - name: Run market data fetch script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch-market-data.py

      # ── 4. 변경사항 커밋 및 푸시 ───────────────────────────────────────
      # 주의: git reset --hard / git pull --rebase 절대 금지 (CLAUDE.md 규칙 16)
      # actions/checkout@v4 이 이미 올바른 origin/main 상태로 체크아웃해줌.
      # Python이 덮어쓴 파일을 그대로 staged → diff → 커밋. 이게 전부.
      - name: Commit and push market-signals.json
        run: |
          git config user.name  "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"

          git add data/market-signals.json
          if git diff --staged --quiet; then
            echo "데이터 변경 없음 — 커밋 건너뜀."
            exit 0
          fi
          KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          git commit -m "chore: ATMR 시장 데이터 업데이트 ${KST}"
          git push origin main || (git fetch origin main && git merge -X ours origin/main --no-edit && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. 실패 시 알림 ────────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::ATMR 데이터 수집 실패. GitHub Actions 로그에서 yfinance 요청 오류를 확인하세요."
