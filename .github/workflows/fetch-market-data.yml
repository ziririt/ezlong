name: ATMR 시장 데이터 수집

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# 미국 장 시간(KST 22:30~05:00) 동안 15분 간격으로 수집.
# 장 외 시간에는 하루 2회 수집 (프리마켓·장후 기준점용).
#
# 장중 15분 간격:
#   */15 13-21 * * 1-5 (UTC) — EDT·EST 모두 커버 (US 장: 13:30~20:00 or 14:30~21:00 UTC)
#
# 장 외 보조 수집:
#   KST 17:05 (프리마켓)  → 여름 08:05 UTC / 겨울 09:05 UTC
#   KST 05:05 (장후 마감) → 여름 20:05 UTC / 겨울 21:05 UTC
#
on:
  schedule:
    # ── 장중 15분 간격 (UTC 13~21시, 월~금) ─────────────────────────────────
    - cron: '*/15 13-21 * * 1-5'

    # ── 장 외 보조 수집 (프리마켓 · 장후) ────────────────────────────────────
    - cron: '5  8 * * 1-5'   # 17:05 KST 프리마켓 (여름 EDT)
    - cron: '5  9 * * 1-5'   # 17:05 KST 프리마켓 (겨울 EST)
    - cron: '5 20 * * 1-5'   # 05:05 KST 장후 마감 (여름 EDT)
    - cron: '5 21 * * 1-5'   # 05:05 KST 장후 마감 (겨울 EST)

  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    concurrency:
      group: fetch-market-data
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run market data fetch script
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node scripts/fetch-market-data.js

      - name: Commit and push market-signals.json
        run: |
          git config user.name  "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"
          if git diff --quiet data/market-signals.json 2>/dev/null; then
            echo "데이터 변경 없음. 커밋 건너뜀."
            exit 0
          fi
          git add data/market-signals.json
          git commit -m "chore: ATMR 시장 데이터 업데이트 $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::ATMR 데이터 수집 실패. Twelve Data API 키와 GitHub Secrets를 확인하세요."
