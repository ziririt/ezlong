name: 미국주식 차트 분석 생성

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# 미국 정규장 기준 하루 4회 실행 (EDT/EST 양쪽 커버).
#
# 시점 1 — 정규장 시작 10분 후 (9:40 AM ET)
#   EDT(UTC-4): 13:40 UTC | EST(UTC-5): 14:40 UTC
#
# 시점 2 — 정규장 시작 1시간 후 (10:30 AM ET)
#   EDT(UTC-4): 14:30 UTC | EST(UTC-5): 15:30 UTC
#
# 시점 3 — 장 마감 30분 후 포스트마켓 포함 (4:30 PM ET)
#   EDT(UTC-4): 20:30 UTC | EST(UTC-5): 21:30 UTC
#
# 시점 4 — 포스트마켓 1시간 후 (5:00 PM ET)
#   EDT(UTC-4): 21:00 UTC | EST(UTC-5): 22:00 UTC
#
# DST 전환 주에는 일부 cron이 중복 또는 누락될 수 있으나,
# concurrency 설정으로 무해하게 처리됩니다.
#

on:
  schedule:
    # ── 시점 1: 정규장 시작 10분 후 ──────────────────────────────────────
    - cron: '40 13 * * 1-5'   # EDT (UTC-4)  →  9:40 AM ET
    - cron: '40 14 * * 1-5'   # EST (UTC-5)  →  9:40 AM ET

    # ── 시점 2: 정규장 시작 1시간 후 ─────────────────────────────────────
    - cron: '30 14 * * 1-5'   # EDT (UTC-4)  → 10:30 AM ET
    - cron: '30 15 * * 1-5'   # EST (UTC-5)  → 10:30 AM ET

    # ── 시점 3: 장 마감 30분 후 (포스트마켓 포함) ──────────────────────
    - cron: '30 20 * * 1-5'   # EDT (UTC-4)  →  4:30 PM ET
    - cron: '30 21 * * 1-5'   # EST (UTC-5)  →  4:30 PM ET

    # ── 시점 4: 포스트마켓 1시간 후 ──────────────────────────────────────
    - cron: '0 21 * * 1-5'    # EDT (UTC-4)  →  5:00 PM ET
    - cron: '0 22 * * 1-5'    # EST (UTC-5)  →  5:00 PM ET

  # 수동 실행 허용
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    # 중복 실행 방지: 이전 실행이 끝날 때까지 대기
    concurrency:
      group: us-chart-analysis
      cancel-in-progress: false

    steps:
      # ── 1. 저장소 체크아웃 ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js 설치 ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --production

      # ── 3. 미국 주식/ETF 차트 분석 실행 ──────────────────────────────
      - name: Run US stocks/ETFs chart analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-chart-analysis.js us

      # ── 4. 변경사항 커밋 및 푸시 ─────────────────────────────────────
      - name: Commit and push analysis data
        run: |
          git config user.name "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"

          # 변경사항이 없으면 커밋 건너뜀 (신규 파일 포함 감지)
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음. 커밋 건너뜀."
            exit 0
          fi

          git commit -m "chore: 미국주식 차트 분석 업데이트 $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          # push 충돌 방지: rebase 후 push (최대 3회 재시도)
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push 재시도 $i/3..."
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::미국주식 차트 분석 실패. GitHub Actions 로그에서 오류를 확인하세요."
          echo "::error::Yahoo Finance 응답 오류 또는 Gemini API 키 문제일 수 있습니다."
