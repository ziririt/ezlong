name: 미국주식 차트 분석 생성

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# 미국 정규장 시간(평일) 매시 1회 실행
# 장 시작 5분 후(9:35 AM ET) ~ 장마감 5분 전(3:55 PM ET)
# → 9:35 · 10:35 · 11:35 · 12:35 · 13:35 · 14:35 · 15:35 ET (7회/일)
#
# EDT(UTC-4) 기준: 13:35~19:35 UTC
# EST(UTC-5) 기준: 14:35~20:35 UTC
# → 두 시즌 모두 커버하기 위해 13:35~20:35 UTC 총 8개 cron 사용
# → 내부 ET 시각 체크(9:30~16:00)로 장 외 cron 자동 필터링
#

on:
  schedule:
    - cron: '35 13 * * 1-5'   # EDT  9:35 AM ET
    - cron: '35 14 * * 1-5'   # EDT 10:35 / EST  9:35 AM ET
    - cron: '35 15 * * 1-5'   # EDT 11:35 / EST 10:35 AM ET
    - cron: '35 16 * * 1-5'   # EDT 12:35 / EST 11:35 AM ET
    - cron: '35 17 * * 1-5'   # EDT 13:35 / EST 12:35 PM ET
    - cron: '35 18 * * 1-5'   # EDT 14:35 / EST 13:35 PM ET
    - cron: '35 19 * * 1-5'   # EDT 15:35 / EST 14:35 PM ET
    - cron: '35 20 * * 1-5'   # EST 15:35 PM ET

  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    concurrency:
      group: us-chart-analysis
      cancel-in-progress: true

    steps:
      # ── 1. 저장소 체크아웃 ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js 설치 ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --production

      # ── 3. 미국 정규장 시간 체크 (ET 9:30~16:00) ─────────────────────
      # workflow_dispatch(수동 실행) 시에는 시간 체크 우회 — 장 외에서도 강제 실행 가능
      - name: Check US market hours
        id: market_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "수동 실행(workflow_dispatch) — 시간 체크 우회, 강제 실행"
          else
            ET_TIME=$(TZ=America/New_York date +%H%M)
            echo "현재 ET 시각: $ET_TIME"
            if [ "$ET_TIME" -lt "0930" ] || [ "$ET_TIME" -ge "1600" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "장 외 시간 — 건너뜀 (ET $ET_TIME)"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "장 중 — 분석 실행 (ET $ET_TIME)"
            fi
          fi

      # ── 4. 미국 주식/ETF 차트 분석 실행 ──────────────────────────────
      - name: Run US stocks/ETFs chart analysis
        if: steps.market_check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-chart-analysis.js us

      # ── 5. 변경사항 커밋 및 푸시 ─────────────────────────────────────
      - name: Commit and push analysis data
        if: steps.market_check.outputs.skip != 'true'
        run: |
          git config user.name "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"

          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음. 커밋 건너뜀."
            exit 0
          fi

          KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          git commit -m "chore: 미국주식 차트 분석 업데이트 ${KST}"

          # 다른 워크플로(크립토·ATMR 등)가 분석 실행 중 push해서 diverge하는 경우를 처리
          # ff-only는 diverge 시 실패 → rebase로 로컬 커밋을 remote HEAD 위에 올린 후 재push
          git push origin main || (git fetch origin main && git rebase origin/main && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::미국주식 차트 분석 실패. GitHub Actions 로그에서 오류를 확인하세요."
          echo "::error::Yahoo Finance 응답 오류 또는 Gemini API 키 문제일 수 있습니다."
