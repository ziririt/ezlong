name: 미국주식 차트 분석 생성

# ─── 스케줄 설명 ────────────────────────────────────────────────────────────
# 평일(월~금) 4회 실행 (장중 3회 + 장마감 직후 1회) + KST 아침 갱신 1회
# 목표 실행 시각 (ET 기준):
#   09:35 ET — 장 시작 직후
#   10:35 ET
#   11:35 ET
#   15:35 ET — 장마감 5분 후
#
# DST 전환 커버: EDT(UTC-4)·EST(UTC-5) 두 시즌 모두 아래 cron으로 대응.
# → 내부 ET 시각 체크로 목표 시간대(09:30~12:05 / 15:30~16:05)만 실행.
#
#  UTC cron  │ EDT(UTC-4)  │ EST(UTC-5)  │ 동작
#  35 13     │ 09:35 ET ✓  │ 08:35 ET ✗  │ 여름만 실행
#  35 14     │ 10:35 ET ✓  │ 09:35 ET ✓  │ 항상 실행
#  35 15     │ 11:35 ET ✓  │ 10:35 ET ✓  │ 항상 실행
#  35 16     │ 12:35 ET ✗  │ 11:35 ET ✓  │ 겨울만 실행
#  35 19     │ 15:35 ET ✓  │ 14:35 ET ✗  │ 여름만 실행
#  35 20     │ 16:35 ET ✗  │ 15:35 ET ✓  │ 겨울만 실행
#
# 비용 절감: 7회/일 → 4회/일 (43% 절감)
#
# 2026-07-15 추가: KST 07:15 아침 갱신 1회. 장마감 직후(05:35 KST) 이후 05:35~22:35 KST
# 사이 17시간 공백을 메워, 사용자가 기상(07:00)해서 확인할 때 최신 상태를 보여준다.
# 단, 이 스크립트는 "[절대 준수 사항] 순수 기술적 지표만 사용, 펀더멘털·매크로 언급 금지"
# 규칙으로 설계돼 있어 tv-inbox의 TV 리포트(매크로 위주)는 이 파이프라인에는 주입하지
# 않는다 — market-scorecard.yml(호재vs악재)에만 주입한다. 여기서는 스케줄만 당겨서
# 최신 가격·기술지표 기준 분석이 아침에 갱신되게 하는 것이 목적이다.
#

on:
  schedule:
    - cron: '35 13 * * 1-5'   # EDT  9:35 ET
    - cron: '35 14 * * 1-5'   # EDT 10:35 / EST  9:35 ET
    - cron: '35 15 * * 1-5'   # EDT 11:35 / EST 10:35 ET
    - cron: '35 16 * * 1-5'   # EST 11:35 ET
    - cron: '35 19 * * 1-5'   # EDT 15:35 ET
    - cron: '35 20 * * 1-5'   # EST 15:35 ET
    - cron: '15 22 * * 0,1,2,3,4'   # KST 07:15 (UTC 전날 22:15, dow는 하루 당김) 아침 갱신

  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('us-chart-analysis-manual-{0}', github.run_id) || 'us-chart-analysis' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

    steps:
      # ── 1. 저장소 체크아웃 ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js 설치 ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --production

      # ── 3. ET 목표 시간대 체크 ───────────────────────────────────────
      # 허용 구간: 09:30~12:04 (장초반 3회) / 15:30~16:04 (장마감 직후)
      # workflow_dispatch(수동)는 시간 체크 우회 — 언제든 강제 실행 가능
      - name: Check target ET time window
        id: time_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "수동 실행 — 시간 체크 우회"
          else
            ET_TIME=$(TZ=America/New_York date +%H%M)
            echo "현재 ET 시각: $ET_TIME"
            if ([ "$ET_TIME" -ge "0930" ] && [ "$ET_TIME" -lt "1205" ]) || \
               ([ "$ET_TIME" -ge "1530" ] && [ "$ET_TIME" -lt "1605" ]); then
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "목표 시간대 — 분석 실행 (ET $ET_TIME)"
            else
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "목표 시간대 외 — 건너뜀 (ET $ET_TIME)"
            fi
          fi

      # ── 4. 미국 주식/ETF 차트 분석 실행 ──────────────────────────────
      - name: Run US stocks/ETFs chart analysis
        if: steps.time_check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-chart-analysis.js us

      # ── 5. 변경사항 커밋 및 푸시 ─────────────────────────────────────
      - name: Commit and push analysis data
        if: steps.time_check.outputs.skip != 'true'
        run: |
          git config user.name "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"

          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음. 커밋 건너뜀."
            exit 0
          fi

          KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          git commit -m "chore: 미국주식 차트 분석 업데이트 ${KST}"

          git push origin main || (git fetch origin main && git merge -X ours origin/main --no-edit && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. 실패 시 알림 ───────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::미국주식 차트 분석 실패. GitHub Actions 로그에서 오류를 확인하세요."
          echo "::error::Yahoo Finance 응답 오류 또는 Gemini API 키 문제일 수 있습니다."
