name: Keep-Alive — 스케줄 워크플로우 유지

# ─── 목적 ────────────────────────────────────────────────────────────────────
# GitHub는 60일 이상 레포지토리에 활동이 없으면 예약 워크플로우를 자동 비활성화한다.
# 이 워크플로우는 매주 월요일 KST 09:00에 실행되어:
#   1. 시장 데이터 수집 워크플로우가 비활성화됐으면 강제로 재활성화한다.
#   2. 타임스탬프를 커밋해 레포를 "활성" 상태로 유지한다.
#   3. 재활성화 후 즉시 데이터 수집 워크플로우를 1회 트리거한다.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 UTC 00:00 = KST 09:00
  workflow_dispatch:        # 수동 실행 허용 (테스트 또는 긴급 복구용)

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 커밋 push 권한
      actions: write        # 워크플로우 enable/disable 권한

    steps:
      # ── 1. 저장소 체크아웃 ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. 시장 데이터 워크플로우 강제 활성화 ────────────────────────────
      # GitHub가 비활성화했더라도 여기서 명시적으로 재활성화한다.
      - name: Re-enable scheduled workflows
        run: |
          echo "워크플로우 활성화 상태 확인 및 재활성화..."
          gh workflow enable fetch-market-data.yml   || echo "fetch-market-data: 이미 활성 또는 파일명 확인 필요"
          gh workflow enable fetch-options-data.yml  || echo "fetch-options-data: 이미 활성 또는 파일명 확인 필요"
          echo "완료."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. keep-alive 타임스탬프 커밋 ────────────────────────────────────
      # 레포에 커밋이 없으면 GitHub가 비활성으로 판단.
      # 매주 작은 파일 하나를 업데이트해 활성 상태를 유지한다.
      - name: Commit keep-alive timestamp
        run: |
          git config user.name  "ATMR Bot"
          git config user.email "atmr-bot@ezlong.com"

          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "last_keepalive: ${TIMESTAMP}" > data/.keepalive

          git add data/.keepalive

          if git diff --staged --quiet; then
            echo "변경사항 없음 (이미 최신). 커밋 건너뜀."
          else
            git commit -m "chore: keep-alive ${TIMESTAMP}"
            git push
            echo "keep-alive 커밋 완료: ${TIMESTAMP}"
          fi

      # ── 4. 즉시 데이터 수집 트리거 ───────────────────────────────────────
      # 재활성화 직후 최신 데이터를 1회 즉시 수집한다.
      # (다음 정규 스케줄 실행 전까지 stale 상태 방지)
      - name: Trigger market data fetch
        run: |
          echo "시장 데이터 즉시 수집 트리거..."
          gh workflow run fetch-market-data.yml --ref main || echo "트리거 실패 (수동 확인 필요)"
          echo "완료."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. 상태 요약 출력 ─────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "=============================="
          echo "Keep-Alive 실행 완료"
          echo "실행 시각: $(date -u '+%Y-%m-%dT%H:%M:%SZ') UTC"
          echo "=============================="
          echo "다음 자동 실행: 다음 주 월요일 KST 09:00"
