name: Swing AI (과매수·과매도 진단)

# 주 1회, 한국시각 일요일 아침. 금요일 16:00 ET 마감으로 주간 데이터가 확정된
# 뒤다. 깃허브 예약은 밀리거나 건너뛴다(CLAUDE.md 40항) — 슬롯 둘 + 감시견.
# weekly-risk(22:00·01:00)와 10분 어긋나게 두어 동시 커밋 경합을 줄인다.
on:
  schedule:
    - cron: '10 22 * * 6'   # 토 22:10 UTC = 일 07:10 KST — 본실행
    - cron: '10 1 * * 0'    # 일 01:10 UTC = 일 10:10 KST — 보조
  workflow_dispatch:

concurrency:
  group: swing-ai
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (최신 main)
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install --quiet "httpx>=0.27,<1" "numpy>=2,<3" "pandas>=2.2,<4" "pyarrow>=17,<24" "pydantic>=2.8,<3" "python-dotenv>=1,<2" "PyYAML>=6,<7"

      # 시세만 필요하다 — FRED 없이 bfrs 수집기의 시장 파트만 쓴다.
      - name: 시장 데이터 수집
        env:
          PYTHONPATH: scripts
        run: |
          python -m bfrs.cli init
          python -m bfrs.cli fetch-market --start 2004-10-18

      - name: 진단 데이터 만들기
        run: |
          python3 scripts/build-swing-ai.py \
            --mkt .bfrs-work/raw/market \
            --out .bfrs-work/swing-ai-full.json \
            --public-out data/swing-ai.json

      - name: Commit updated data (if changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing-ai.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            echo "fresh=no" >> "$GITHUB_OUTPUT"
          else
            KST=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "data: AI 과매수·과매도 진단 ${KST}"
            git push origin main || (git fetch origin main && git merge --ff-only origin/main && git push origin main)
            echo "fresh=yes" >> "$GITHUB_OUTPUT"
          fi

      # 봇 push 는 firebase-hosting.yml 을 트리거하지 않는다(깃허브 정책).
      - name: 갱신됐으면 배포
        if: steps.commit.outputs.fresh == 'yes'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools --quiet
          firebase deploy --only hosting --project ezlong-541a8 --token "$FIREBASE_TOKEN" || true
