  var state = {

  /* 클립보드 복사 — navigator.clipboard가 없거나(비-HTTPS, 구형 브라우저) 권한이
     막혀 있어도 execCommand('copy') 폴백으로 최대한 성공시킨다. 두 방법 다
     실패하면 onFail을 호출해 "직접 선택해서 복사" 안내로 전환한다. */
  function copyToClipboard(text, onSuccess, onFail) {
    function legacyCopy() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) onSuccess(); else onFail();
      } catch (e) { onFail(); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onSuccess).catch(legacyCopy);
    } else {
      legacyCopy();
    }
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function pick(arr, n) { return shuffle(arr).slice(0, n); }

  /* ══════════════════════════════════════════════════════════════════

       빈 화면이 보이던 문제(2026-08-04 성동님 제보) — 응답 영역 위로 복귀.
       첫 로드(스크롤 0)에서는 발동하지 않아 히어로를 건너뛰지 않는다. */
    var top = app.getBoundingClientRect().top + window.scrollY - 64;
    if (top > 0 && window.scrollY > top) window.scrollTo(0, top);
  }

  /* ── 기본 정보 5문항 ─────────────────────────────────────────────── */
  var basicSteps = ["age", "gender", "job", "family", "concern"];

  /* ── 게임 문항 준비 ──────────────────────────────────────────────── */
  function prepareGameQuestions() {
    var ageKey = state.basic.age || "thirties";

    var qs = COMMON_QUESTIONS.slice().concat(AGE_QUESTIONS[ageBucket]);
    state.gameQuestions = qs; // 9문항 확정, 10번째(토너먼트)는 결과 계산 후 삽입

  var pendingAnswer = null;

  /* '‹ 이전' 버튼 (2026-08-04 성동님 지시) — 각 화면 렌더러가 back 동작을 지정.
     null이면 숨김. 뒤로 갈 때는 해당 답변의 점수 반영도 되돌린다(unapplyScore). */
  var backBtn = document.getElementById("lbg-back");
  var backAction = null;
  if (backBtn) backBtn.onclick = function () { if (backAction) backAction(); };

  function updateProgress(current, total, back) {
    progressWrap.style.display = "block";
    var pct = Math.round((current / total) * 100);
    progressFill.style.width = pct + "%";
    progressLabel.textContent = current + " / " + total;
    progressPct.textContent = pct + "%";
    backAction = back || null;
    if (backBtn) backBtn.style.display = backAction ? "" : "none";
  }

  function renderQuestion(idx) {
    clearApp();
    var total = 10;
    updateProgress(idx + 1, total, idx > 0 ? function () {
      /* 직전 문항으로 — 그 답의 점수 반영을 되돌리고 다시 묻는다 */
      var last = state.answers.pop();
      if (last) unapplyScore(last);
      pendingAnswer = null;
      renderQuestion(idx - 1);
    } : null);
    var q;
    var isTournament = idx === 9;
    if (isTournament) {
      var ranked = rankedValues();
      q = buildTournamentQuestion(ranked[0][0], ranked[1][0]);
    } else {
      q = state.gameQuestions[idx];
    }
    var s = el("section", "lbg-scene active");
    var panel = el("div", "lbg-panel");
    panel.appendChild(el("div", "lbg-step-tag", isTournament ? "최종 선택" : "질문 " + (idx + 1)));
    panel.appendChild(el("div", "lbg-situation", q.situation));
    var wrap = el("div", "lbg-ab-wrap");

    function makeCard(letter, opt) {
      var c = el("div", "lbg-ab-card");
      c.innerHTML =
        '<span class="lbg-ab-letter">' + letter + '</span>' +
        '<div class="lbg-ab-head">' + opt.head + '</div>' +
        '<div class="lbg-ab-cost">대신, ' + opt.cost + '</div>';
      c.onclick = function () {
        pendingAnswer = { value: opt.val, oppositeValue: (opt === q.a ? q.b.val : q.a.val), qIndex: idx };
        renderConfidence(idx, total);
      };
      return c;
    }
    wrap.appendChild(makeCard("A", q.a));
    wrap.appendChild(el("div", "lbg-ab-vs", "— 또는 —"));
    wrap.appendChild(makeCard("B", q.b));
    panel.appendChild(wrap);
    s.appendChild(panel);
    app.appendChild(s);
  }

  function renderConfidence(idx, total) {
    clearApp();
    updateProgress(idx + 1, total, function () {
      /* 확신도 화면에서 이전 = 같은 문항의 A/B 선택으로 복귀 (아직 미반영 상태) */
      pendingAnswer = null;
      renderQuestion(idx);
    });
    var s = el("section", "lbg-scene active");
    var panel = el("div", "lbg-panel");
    panel.appendChild(el("h2", "lbg-step-title", "이 선택, 얼마나 어려웠나요?"));
    var grid = el("div", "lbg-conf-grid");
    CONFIDENCE_OPTIONS.forEach(function (o) {
      var c = el("div", "lbg-conf-opt", o.label);
      c.onclick = function () {
        pendingAnswer.confidence = o.id;

        if (idx + 1 < total) renderQuestion(idx + 1);
        else renderPreResultPause();
      };
      grid.appendChild(c);
    });
    panel.appendChild(grid);
    s.appendChild(panel);
    app.appendChild(s);
  }

  function applyScore(ans) {
    state.scores[ans.value] += 3;
    if (ans.confidence === "easy") state.scores[ans.value] += 1;
    if (ans.confidence === "hard") {
      state.scores[ans.value] += 1;
      state.scores[ans.oppositeValue] += 1;
    }
  }

  /* applyScore의 정확한 역연산 — '‹ 이전'으로 답을 물릴 때 사용.
     applyScore 채점 규칙을 바꾸면 반드시 이 함수도 같이 바꾼다. */
  function unapplyScore(ans) {
    state.scores[ans.value] -= 3;
    if (ans.confidence === "easy") state.scores[ans.value] -= 1;
    if (ans.confidence === "hard") {
      state.scores[ans.value] -= 1;
      state.scores[ans.oppositeValue] -= 1;
    }
  }

  function rankedValues() {
    return VALUE_ORDER.map(function (k) { return [k, state.scores[k]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
  }

  function renderResultTop1Combined() {
    clearApp();
    var ranked = rankedValues();
    var v1 = VALUES[ranked[0][0]], v2 = VALUES[ranked[1][0]], v3 = VALUES[ranked[2][0]], v4 = VALUES[ranked[3][0]];

    if (INSTRUMENTAL[ranked[0][0]]) {
      text = "당신은 " + v1.obj + " 포기한 사람이 아닙니다.\n\n" +

        "당신에게 " + v1.topic + " " + v2.withP + " " + v3.withP + " " + v4.obj + " 지키기 위한 수단입니다.";
    } else {
      text = "당신은 " + v1.obj + " 다른 무엇과도 바꾸지 않는 사람입니다.\n\n" +

  function computeAlignmentScore() {
    var sum = state.alignAnswers.reduce(function (a, b) { return a + b; }, 0);
    var avg = sum / state.alignAnswers.length; // 1~5
    return Math.round(((avg - 1) / 4) * 100); // 0~100
  }

    clearApp();

    else if (score >= 60) band = "당신의 가치관과 생활은 대체로 같은 방향이지만, 군데군데 어긋난 지점이 있습니다. 어디서 어긋났는지 다음 화면에서 구체적으로 확인해보겠습니다.";

    app.appendChild(s);
  }

  /* ══════════════════════════════════════════════════════════════════
     저장 / 복구 / 30일 재점검
     ══════════════════════════════════════════════════════════════════ */
  function saveState() {
    try {
      var payload = {
        basic: state.basic,
        scores: state.scores,
        completedAt: state.completedAt || null,
        recheckAt: state.recheckAt || null,
        committed: state.committed || false,
        committedText: state.committedText || null
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (e) { /* localStorage 미지원 환경 — 조용히 무시 */ }
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function buildResultCode() {
    var payload = { v: state.scores, a: state.basic.age, ts: Date.now() };
    try { return btoa(encodeURIComponent(JSON.stringify(payload))); }
    catch (e) { return ""; }
  }

  function restoreFromCode(code) {
    try {
      var payload = JSON.parse(decodeURIComponent(atob(code)));
      if (!payload || !payload.v) return false;
      VALUE_ORDER.forEach(function (k) { state.scores[k] = payload.v[k] || 0; });
      state.basic.age = payload.a || null;
      return true;
    } catch (e) { return false; }
  }

  /* ── 30일 재점검 배너 ────────────────────────────────────────────── */
  function checkRecheckBanner() {
    var saved = loadState();
    if (!saved || !saved.completedAt) return;
    var days = (Date.now() - saved.completedAt) / (1000 * 60 * 60 * 24);
    if (days < RECHECK_DAYS) return;
    if (saved.recheckAt && (Date.now() - saved.recheckAt) / (1000 * 60 * 60 * 24) < RECHECK_DAYS) return;

    var banner = el("div", "lbg-nudge-banner");
    banner.style.maxWidth = "680px";
    banner.style.margin = "20px auto 0";
    banner.innerHTML = "<b>30일이 지났습니다.</b> 그때 선택한 삶을 실제로 살고 있는지 확인해보세요.";
    var btn = el("button", "lbg-btn lbg-btn-ghost", "30일 재점검 시작하기");
    btn.style.marginTop = "12px";
    btn.style.display = "block";
    btn.onclick = function () { startRecheckFlow(saved); };
    banner.appendChild(btn);
    var brandInner = document.querySelector(".page-brand-inner");
    if (brandInner) brandInner.parentNode.insertBefore(banner, brandInner.nextSibling);
  }

  function startRecheckFlow(saved) {
    VALUE_ORDER.forEach(function (k) { state.scores[k] = saved.scores[k] || 0; });
    var ranked = rankedValues();
    var v1 = VALUES[ranked[0][0]];
    clearApp();
    progressWrap.style.display = "none";
    document.querySelectorAll(".lbg-nudge-banner").forEach(function (b) { b.remove(); });
    window.scrollTo(0, 0);

    var s = el("section", "lbg-scene active");
    var panel = el("div", "lbg-panel");
    panel.appendChild(el("div", "lbg-step-tag", "30일 재점검"));
    panel.appendChild(el("h2", "lbg-step-title", "지난 30일, 당신은 " + v1.label + "을(를) 실제로 살았나요?"));
    var form = el("div", "lbg-result-card");
    form.innerHTML =
      '<p style="font-weight:700;color:var(--ez-text);margin-bottom:6px;">지난 30일 동안 가장 잘 실천한 것</p>' +
      '<textarea class="lbg-textarea" id="rc1" style="margin-bottom:16px;"></textarea>' +
      '<p style="font-weight:700;color:var(--ez-text);margin-bottom:6px;">실천하지 못한 것</p>' +
      '<textarea class="lbg-textarea" id="rc2" style="margin-bottom:16px;"></textarea>' +
      '<p style="font-weight:700;color:var(--ez-text);margin-bottom:6px;">중요하다고 생각했지만 다시 미룬 것</p>' +
      '<textarea class="lbg-textarea" id="rc3" style="margin-bottom:16px;"></textarea>' +
      '<p style="font-weight:700;color:var(--ez-text);margin-bottom:6px;">다음 30일, 단 하나의 행동을 고른다면</p>' +
      '<textarea class="lbg-textarea" id="rc4"></textarea>';
    panel.appendChild(form);

    panel.appendChild(el("p", "lbg-step-desc", v1.label + "에 실제로 쓴 시간은 지난 30일간 어떻게 달라졌나요?"));
    var grid = el("div", "lbg-conf-grid");
    var trendOptions = [
      { id: "up", label: "늘었다" }, { id: "same", label: "비슷하다" }, { id: "down", label: "줄었다" }
    ];
    var trend = null;
    trendOptions.forEach(function (o) {
      var c = el("div", "lbg-conf-opt", o.label);
      c.onclick = function () {
        trend = o.id;
        grid.querySelectorAll(".lbg-conf-opt").forEach(function (x) { x.classList.remove("selected"); });
        c.classList.add("selected");
      };
      grid.appendChild(c);
    });
    panel.appendChild(grid);

    var btn = el("button", "lbg-btn lbg-btn-primary lbg-btn-wide", "재점검 완료");
    btn.style.marginTop = "20px";
    btn.onclick = function () {
      if (!trend) { toast("변화를 선택해주세요."); return; }
      renderRecheckResult(v1, trend);
      var newSaved = loadState() || {};
      newSaved.recheckAt = Date.now();
      newSaved.completedAt = Date.now();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newSaved)); } catch (e) {}
    };
    panel.appendChild(btn);
    s.appendChild(panel);
    app.appendChild(s);
  }

  function renderRecheckResult(v1, trend) {
    clearApp();
    var trendText = trend === "up" ? "더 늘었습니다. 방향을 제대로 잡고 있다는 뜻입니다."
      : trend === "same" ? "크게 달라지지 않았습니다. 구조를 조금 더 구체적으로 바꿔볼 시점입니다."
      : "오히려 줄었습니다. 그럴 수 있습니다. 다만 왜 줄었는지 원인 하나만 짚고 넘어가면, 다음 30일은 달라질 수 있습니다.";
    var s = el("section", "lbg-scene active");
    var d = el("div", "lbg-dark");
    d.innerHTML =
      '<div class="lbg-tag">30일 재점검 완료</div>' +
      '<p class="lbg-quote">당신은 ' + v1.label + '을(를) 가장 중요하게 선택했었습니다.<br><br>지난 30일간, 그 시간은 ' + trendText + '<br><br>다음 30일도, 같은 질문을 스스로에게 던져보세요.</p>';
    var row = el("div", "lbg-btn-row");
    var btn = el("button", "lbg-btn lbg-btn-primary", "확인했습니다");
    btn.onclick = function () { location.reload(); };
    row.appendChild(btn);
    d.appendChild(row);
    s.appendChild(d);
    app.appendChild(s);
  }

  /* ══════════════════════════════════════════════════════════════════
     시작
     ══════════════════════════════════════════════════════════════════ */
  document.addEventListener("DOMContentLoaded", function () {
    renderIntro1();
    checkRecheckBanner();
  });
})();

</script>

</body>
