<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F5F7;--bg2:#FFFFFF;--card:#FFFFFF;--bd:rgba(0,0,0,0.08);
  --t1:#1D1D1F;--t2:#6E6E73;--t3:#AEAEB2;
  --bl:var(--ez-blue);--bl-dk:#0040DD;--bl-s:rgba(0,113,227,0.10);--bl-m:rgba(0,113,227,0.18);
  --gr:#34C759;--gr-s:rgba(52,199,89,0.10);--gr-m:rgba(52,199,89,0.22);
  --rd:#FF3B30;--rd-s:rgba(255,59,48,0.10);
  --yl:#FF9F0A;--yl-s:rgba(255,159,10,0.12);
  --pu:#BF5AF2;--pu-s:rgba(191,90,242,0.10);
  --or:#FF6B35;--or-s:rgba(255,107,53,0.10);
  --r:var(--ez-r);--r-sm:var(--ez-rs);
  --font:var(--ez-font);
  --mono:'SF Mono','Monaco','Menlo',monospace;
  --shadow:0 4px 24px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 12px 48px rgba(0,0,0,0.10),0 2px 8px rgba(0,0,0,0.06);
  --nav-h:56px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#000;--bg2:#1C1C1E;--card:#1C1C1E;--bd:rgba(255,255,255,0.10);
    --t1:#F5F5F7;--t2:#AEAEB2;--t3:#636366;
    --bl-s:rgba(0,113,227,0.20);--bl-m:rgba(0,113,227,0.28);
    --gr-s:rgba(52,199,89,0.15);--gr-m:rgba(52,199,89,0.25);
    --rd-s:rgba(255,59,48,0.15);--yl-s:rgba(255,159,10,0.15);
    --pu-s:rgba(191,90,242,0.15);--or-s:rgba(255,107,53,0.15);
    --shadow:0 4px 24px rgba(0,0,0,0.30),0 1px 4px rgba(0,0,0,0.20);
    --shadow-lg:0 12px 48px rgba(0,0,0,0.50),0 2px 8px rgba(0,0,0,0.30);
  }
}
html{font-family:var(--font);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#C7C7CC;border-radius:999px}

/* Nav */
.nav{height:var(--nav-h);background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:100}
/* 스크롤 엣지 페이드 (apple-design §12) — 1px 하드 구분선 대신,
   콘텐츠가 헤더 밑으로 흘러 들어가는 자리에만 옅은 그라데이션을 둔다.
   선은 "여기서 끊긴다"고 말하고, 페이드는 "여기 밑으로 계속된다"고 말한다. */
.nav::after {
  content: ''; position: absolute; left: 0; right: 0; top: 100%;
  height: 14px; pointer-events: none;
  background: linear-gradient(to bottom, rgba(0,0,0,0.055), rgba(0,0,0,0));
}
@media (prefers-color-scheme: dark) {
  .nav::after { background: linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0)); }
}
@media (prefers-contrast: more) {
  .nav { border-bottom: 1px solid var(--ez-text2); }
  .nav::after { display: none; }
}

@media(prefers-color-scheme:dark){.nav{background:rgba(28,28,30,0.92)}}
.nav-inner{max-width:900px;margin:0 auto;padding:0 20px;height:100%;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:8px}
.nav-logo-img{height:26px;width:auto;display:block}
.nav-back{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:var(--bl);cursor:pointer;transition:opacity .15s}
.nav-back:hover{opacity:.7}
.nav-back svg{width:14px;height:14px}

/* Wrap */
.wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}

/* Step Indicator */
.step-bar{display:flex;align-items:center;gap:0;padding:28px 0 24px;overflow-x:auto}
.step-bar::-webkit-scrollbar{display:none}
.step-item{display:flex;align-items:center;gap:8px;flex-shrink:0}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:all .25s}
.step-dot.done{background:var(--gr);color:#fff}
.step-dot.active{background:var(--bl);color:#fff;box-shadow:0 0 0 4px var(--bl-s)}
.step-dot.pending{background:var(--bg2);color:var(--t3);border:1.5px solid var(--bd)}
.step-label{font-size:12px;font-weight:600;transition:color .25s}
.step-label.active{color:var(--bl)}
.step-label.done{color:var(--gr)}
.step-label.pending{color:var(--t3)}
.step-sep{width:28px;height:1.5px;background:var(--bd);margin:0 4px;flex-shrink:0}
@media(max-width:480px){.step-label{display:none}}

/* Step content animation */
@keyframes stepIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.step-content{animation:stepIn .28s ease-out both}

/* Section headers */
.page-title{font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-bottom:6px}
.page-sub{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:24px}

/* Cards */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--shadow);overflow:hidden}
.card-pad{padding:20px}

/* Style cards */
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:24px}
.style-card{background:var(--card);border-radius:var(--r);border:2px solid var(--bd);padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.style-card:hover{border-color:var(--bl-m);box-shadow:var(--shadow)}
.style-card.active{border-color:var(--bl);background:var(--bl-s)}
.style-card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;flex-shrink:0}
.style-card-icon svg{width:20px;height:20px}
.style-card-name{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:5px;line-height:1.3}
.style-card-desc{font-size:12px;color:var(--t2);line-height:1.55}
.style-card-check{position:absolute;top:16px;right:16px;width:20px;height:20px;border-radius:50%;background:var(--bl);display:flex;align-items:center;justify-content:center}
.style-card-check svg{width:12px;height:12px;color:#fff}

/* Leverage toggle */
.leverage-row{margin-top:12px;display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--bd)}
.leverage-label{font-size:12px;font-weight:600;color:var(--t2)}

/* Custom input */
.custom-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
.custom-input{width:100%;padding:8px 12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);color:var(--t1);font-size:13px;font-family:var(--font);outline:none;transition:border-color .15s;margin-bottom:8px}
.custom-input:focus{border-color:var(--bl)}
.btn-sm{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:all .15s}

/* ETF list */
.etf-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.etf-row{background:var(--card);border-radius:var(--r-sm);border:1px solid var(--bd);padding:14px 16px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s}
.etf-row:hover{box-shadow:var(--shadow)}
.etf-row-top{display:flex;align-items:flex-start;gap:10px}
.etf-cat-badge{font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;flex-shrink:0;margin-top:1px}
.etf-info{flex:1;min-width:0}
.etf-name{font-size:13px;font-weight:700;color:var(--t1);line-height:1.35}
.etf-ticker{font-size:11px;font-weight:600;color:var(--t3);font-family:var(--mono);margin-top:2px}
.etf-return{font-size:12px;font-weight:700;color:var(--bl);margin-top:2px}
.etf-controls{display:flex;align-items:center;gap:8px}
.etf-weight-input{width:52px;padding:5px 8px;border-radius:6px;border:1.5px solid var(--bd);background:var(--bg);color:var(--t1);font-size:13px;font-weight:700;font-family:var(--mono);text-align:right;outline:none}
.etf-weight-input:focus{border-color:var(--bl)}
.etf-pct{font-size:13px;font-weight:600;color:var(--t2)}
.etf-del{width:26px;height:26px;border-radius:6px;border:none;background:var(--rd-s);color:var(--rd);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}
.etf-del:hover{background:var(--rd);color:#fff}
.etf-del svg{width:14px;height:14px}
.etf-slider-row{display:flex;align-items:center;gap:8px}
.etf-slider{flex:1;-webkit-appearance:none;height:4px;border-radius:999px;background:var(--bd);outline:none;cursor:pointer}
.etf-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--bl);box-shadow:0 1px 6px rgba(0,113,227,.35);cursor:pointer}

/* Weight total bar */
.weight-total-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--r-sm);border:1.5px solid var(--bd);background:var(--bg2);margin-bottom:12px}
.weight-total-label{font-size:13px;font-weight:600;color:var(--t2)}
.weight-total-value{font-size:18px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em}
.weight-bar{height:6px;border-radius:999px;background:var(--bd);margin:8px 0;overflow:hidden}
.weight-bar-fill{height:100%;border-radius:6px;transition:width .3s,background .3s}

/* Inputs */
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:999px;background:var(--bd);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--bl);box-shadow:0 2px 8px rgba(0,113,227,.35);cursor:pointer}
input[type=range].green::-webkit-slider-thumb{background:var(--gr);box-shadow:0 2px 8px rgba(52,199,89,.35)}
input[type=checkbox]{-webkit-appearance:none;width:16px;height:16px;min-width:16px;border:1.5px solid var(--bd);border-radius:6px;background:var(--bg2);cursor:pointer;position:relative;transition:all .15s}
input[type=checkbox]:checked{background:var(--bl);border-color:var(--bl)}
input[type=checkbox]:checked::after{content:'';position:absolute;left:4px;top:1px;width:6px;height:9px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) scaleX(.9)}

/* Sim inputs */
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:520px){.sim-grid{grid-template-columns:1fr}}
.sim-input-card{background:var(--card);border-radius:var(--r);border:1px solid var(--bd);padding:18px;box-shadow:var(--shadow)}
.sim-input-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
.sim-input-value{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--t1);margin-bottom:10px;font-family:var(--mono)}
.sim-input-unit{font-size:14px;font-weight:600;color:var(--t3);margin-left:3px}
.sim-input-range{margin-bottom:4px}
.sim-input-minmax{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);font-family:var(--mono)}
.sim-return-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:20px}

/* Results */
.result-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
@media(min-width:640px){.result-metrics{grid-template-columns:repeat(4,1fr)}}
.metric-card{background:var(--card);border-radius:var(--r);border:1px solid var(--bd);padding:16px;box-shadow:var(--shadow)}

/* ═══════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════ */
function formatKRW(v) {
  const n = Math.round(v);
  if (n >= 10000) {
    const uk = Math.floor(n / 10000);
    const man = n % 10000;
    return man === 0 ? `${uk.toLocaleString()}억` : `${uk.toLocaleString()}억 ${man.toLocaleString()}만`;
  }
  return `${n.toLocaleString()}만`;
}

function formatAxisLabel(v) {
  if (v === 0) return '0';
  if (v >= 10000) {
    const uk = v / 10000;
    if (Number.isInteger(uk)) return `${uk}억`;
    return `${uk.toFixed(1)}억`;
  }
  if (v >= 1000) return `${(v/1000).toFixed(1)}천만`;
  return `${Math.round(v)}만`;
}

function calculatePortfolioReturn(items) {
  const total = items.reduce((s, it) => s + it.weight, 0);
  if (total === 0) return 0;
  return items.reduce((s, it) => {
    const r = it.annualReturn ?? it.etf.annualReturn;
    return s + r * (it.weight / total);
  }, 0);
}

function runSimulation(portfolio, init, monthly, duration) {
  const wr = calculatePortfolioReturn(portfolio);
  const monthlyRate = Math.pow(1 + wr / 100, 1 / 12) - 1;
  let bal = init;
  const results = [];
  for (let yr = 0; yr <= duration; yr++) {
    results.push({
      year: yr,
      balance: Math.round(bal),
      contribution: Math.round(init + monthly * 12 * yr),
    });
    if (yr < duration) {
      for (let m = 0; m < 12; m++) {
        bal = (bal + monthly) * (1 + monthlyRate);
      }
    }
  }
  return results;
}

/* ═══════════════════════════════════════════════
   SVG AREA CHART
═══════════════════════════════════════════════ */
function SimChart({ data }) {
  const [tooltip, setTooltip] = useState(null);
  const svgRef = useRef(null);
  const W = 700, H = 260;
  const pad = { top: 16, right: 20, bottom: 36, left: 72 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  const maxV = Math.max(...data.map(d => d.balance), 1);
  const xS = i => (i / Math.max(data.length - 1, 1)) * cw;
  const yS = v => ch - Math.max(0, (v / maxV)) * ch;

  const pts = (key) => data.map((d, i) => `${xS(i)},${yS(d[key])}`).join(' ');
  const areaPath = (key) => {
    const ps = data.map((d, i) => `${xS(i)},${yS(d[key])}`);
    return `M 0,${ch} L ${ps.join(' L ')} L ${xS(data.length-1)},${ch} Z`;
  };

  // Y ticks: 5 levels
  const yTickCount = 5;
  const yTicks = Array.from({length: yTickCount + 1}, (_, i) => ({
    v: Math.round((maxV * i) / yTickCount / 100) * 100,
    y: yS(Math.round((maxV * i) / yTickCount / 100) * 100)
  }));

  // X ticks
  const xStep = data.length <= 11 ? 1 : data.length <= 21 ? 2 : 5;
  const xTicks = data.filter((d, i) => i % xStep === 0 || i === data.length - 1);

  const handleMouseMove = (e) => {
    const rect = svgRef.current?.getBoundingClientRect();
    if (!rect) return;
    const rawX = e.clientX - rect.left - (pad.left * rect.width / W);
    const pct = rawX / ((cw) * rect.width / W);
    const idx = Math.min(data.length - 1, Math.max(0, Math.round(pct * (data.length - 1))));
    if (idx >= 0 && idx < data.length) setTooltip({ idx });
  };

  const td = tooltip && data[tooltip.idx];

  return (
    <div style={{position:'relative'}}>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}
        onMouseMove={handleMouseMove} onMouseLeave={() => setTooltip(null)}>
        <defs>
          <linearGradient id="gBal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#0071E3" stopOpacity="0.25"/>
            <stop offset="100%" stopColor="#0071E3" stopOpacity="0.03"/>
          </linearGradient>
          <linearGradient id="gCon" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#8E8E93" stopOpacity="0.22"/>
            <stop offset="100%" stopColor="#8E8E93" stopOpacity="0.02"/>
          </linearGradient>
        </defs>
        <g transform={`translate(${pad.left},${pad.top})`}>
          {/* Grid */}
          {yTicks.map((t, i) => (
            <g key={i}>
              <line x1="0" y1={t.y} x2={cw} y2={t.y} stroke="rgba(0,0,0,0.06)" strokeWidth="1"/>
              <text x="-8" y={t.y + 4} textAnchor="end" fontSize="10" fill="#AEAEB2"
                fontFamily="-apple-system,BlinkMacSystemFont,sans-serif">
                {formatAxisLabel(t.v)}
              </text>
            </g>
          ))}
          {/* Areas */}
          <path d={areaPath('balance')} fill="url(#gBal)"/>
          <path d={areaPath('contribution')} fill="url(#gCon)"/>
          {/* Lines */}
          <polyline points={pts('balance')} fill="none" stroke="#0071E3" strokeWidth="2.2" strokeLinejoin="round"/>
          <polyline points={pts('contribution')} fill="none" stroke="#8E8E93" strokeWidth="1.5"
            strokeLinejoin="round" strokeDasharray="5 3"/>
          {/* Crosshair */}
          {tooltip && (
            <>
              <line x1={xS(tooltip.idx)} y1={0} x2={xS(tooltip.idx)} y2={ch}
                stroke="#AEAEB2" strokeWidth="1" strokeDasharray="3 2"/>
              <circle cx={xS(tooltip.idx)} cy={yS(data[tooltip.idx].balance)} r={4.5}
                fill="#0071E3" stroke="white" strokeWidth="2"/>
              <circle cx={xS(tooltip.idx)} cy={yS(data[tooltip.idx].contribution)} r={3.5}
                fill="#8E8E93" stroke="white" strokeWidth="1.5"/>
            </>
          )}
          {/* X axis */}
          {xTicks.map((d, i) => (
            <text key={i} x={xS(data.indexOf(d))} y={ch + 22} textAnchor="middle"
              fontSize="10" fill="#AEAEB2" fontFamily="-apple-system,sans-serif">
              {d.year}년
            </text>
          ))}
          {/* Invisible hit area */}
          <rect x={0} y={0} width={cw} height={ch} fill="transparent" style={{cursor:'crosshair'}}/>
        </g>
      </svg>
      {/* Tooltip */}
      {tooltip && td && (
        <div className="chart-tooltip" style={{
          top: 20, left: `calc(${(xS(tooltip.idx) + pad.left) / W * 100}% + 12px)`,
          transform: tooltip.idx > data.length * 0.7 ? 'translateX(calc(-100% - 24px))' : 'none'
        }}>
          <div className="chart-tooltip-year">{td.year}년차</div>
          <div className="chart-tooltip-row">
            <span className="chart-tooltip-label" style={{color:'#0071E3'}}>예상 자산</span>
            <span className="chart-tooltip-val" style={{color:'#0071E3'}}>{formatKRW(td.balance)}원</span>
          </div>
          <div className="chart-tooltip-row">
            <span className="chart-tooltip-label">누적 원금</span>
            <span className="chart-tooltip-val">{formatKRW(td.contribution)}원</span>
          </div>
          {td.contribution > 0 && (
            <div className="chart-tooltip-row">
              <span className="chart-tooltip-label">수익 배수</span>
              <span className="chart-tooltip-val" style={{color:'#34C759'}}>
                {(td.balance / td.contribution).toFixed(2)}배
              </span>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════
   DONUT CHART (포트폴리오 구성)
═══════════════════════════════════════════════ */
function DonutChart({ portfolio }) {
  const grouped = {};
  portfolio.forEach(it => {
    const cat = it.etf.category;
    grouped[cat] = (grouped[cat] || 0) + it.weight;
  });
  const entries = Object.entries(grouped).filter(([,w]) => w > 0);
  const total = entries.reduce((s, [,w]) => s + w, 0);

  let cumAngle = -90;
  const R = 38, cx = 50, cy = 50;

  const slices = entries.map(([cat, w]) => {
    const angle = (w / total) * 360;
    const startAngle = cumAngle * Math.PI / 180;
    const endAngle = (cumAngle + angle) * Math.PI / 180;
    cumAngle += angle;
    const x1 = cx + R * Math.cos(startAngle);
    const y1 = cy + R * Math.sin(startAngle);
    const x2 = cx + R * Math.cos(endAngle);
    const y2 = cy + R * Math.sin(endAngle);
    const large = angle > 180 ? 1 : 0;
    const color = CATEGORY_COLORS[cat] || '#8E8E93';
    return { cat, w, color, d: `M ${cx} ${cy} L ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2} Z` };
  });

  return (
    <div className="pie-wrap">
      <svg viewBox="0 0 100 100" style={{width:90,height:90,flexShrink:0}}>
        {slices.map(s => (
          <path key={s.cat} d={s.d} fill={s.color} opacity="0.9"/>
        ))}
        <circle cx={cx} cy={cy} r={22} fill="var(--bg)"/>
        <text x={cx} y={cy - 5} textAnchor="middle" fontSize="7" fill="var(--t3)" fontFamily="-apple-system,sans-serif">ETF</text>
        <text x={cx} y={cy + 6} textAnchor="middle" fontSize="8" fontWeight="700" fill="var(--t1)" fontFamily="-apple-system,sans-serif">구성</text>
      </svg>
      <div className="pie-legend">
        {slices.map(s => (
          <div key={s.cat} className="pie-legend-item">
            <div className="pie-legend-dot" style={{background:s.color}}/>
            <span style={{color:'var(--t2)',fontSize:12}}>{s.cat}</span>
            <span className="pie-legend-pct" style={{color:s.color}}>{s.w}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function ETFModal({ onClose, onAdd, existingTickers }) {
  const [q, setQ] = useState('');
  const [manual, setManual] = useState('');

  const filtered = useMemo(() =>
    Object.values(ETFS).filter(e =>
      !existingTickers.includes(e.ticker) &&
      (e.name.toLowerCase().includes(q.toLowerCase()) || e.ticker.toLowerCase().includes(q.toLowerCase()))
    ), [q, existingTickers]);

  const handleManualAdd = () => {
    const t = manual.trim().toUpperCase();
    if (!t) return;
    const existing = Object.values(ETFS).find(e => e.ticker === t);
    if (existing) { onAdd(existing); return; }
    onAdd({ ticker: t, name: t, category: 'Core', description: '사용자 직접 추가 종목', annualReturn: 10 });

  return (

            <div style={{padding:'24px',textAlign:'center',color:'var(--t3)',fontSize:13}}>

function StepBar({ step }) {
  const steps = ['스타일 선택', '비중 설정', '시뮬레이션 확인', '결과 확인'];
  return (
    <div className="step-bar">
      {steps.map((label, i) => {
        const n = i + 1;
        const st = step > n ? 'done' : step === n ? 'active' : 'pending';
        return (
          <React.Fragment key={n}>
            {i > 0 && <div className="step-sep" style={st === 'done' || step > i ? {background:'var(--gr)'} : {}}/>}
            <div className="step-item">
              <div className={`step-dot ${st}`}>
                {st === 'done' ? (
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M2 6l3 3 5-5"/>
                  </svg>
                ) : n}
              </div>
              <span className={`step-label ${st}`}>{label}</span>
            </div>
          </React.Fragment>
        );
      })}
    </div>
  );
}

                <div className="leverage-row" onClick={e => e.stopPropagation()}>
                  <input type="checkbox" checked={isLeveraged} id="lev-chk"
                    onChange={e => setIsLeveraged(e.target.checked)}/>
                  <label htmlFor="lev-chk" className="leverage-label" style={{cursor:'pointer'}}>
                    2배 레버리지 추가 (QLD, USD)
                  </label>
                </div>
              )}

              {isCustom && isActive && (
                <div className="custom-row" onClick={e => e.stopPropagation()}>
                  <input className="custom-input" maxLength={50} placeholder="추구하는 투자 방향 (50자 이내)"
                    value={customText} onChange={e => setCustomText(e.target.value)}/>
                  <button className="btn btn-primary btn-sm"
                    style={{background: s.color, borderRadius:8, fontSize:12, padding:'8px 14px', width:'100%'}}
                    disabled={!customText.trim()}
                    onClick={() => handleStyleSelect('CUSTOM', false)}>
                    커스텀으로 시작하기
                  </button>
                </div>
              )}

              {isActive && !isCustom && (
                <div className="style-card-check" style={{background: s.color}}>
                  <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2.5">
                    <path d="M2 6l3 3 5-5"/>
                  </svg>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );

  /* ─ Step 2 ─ */
  const renderStep2 = () => {
    const sInfo = STYLES[selectedStyle];
    const isValid = totalWeight === 100;
    const fillPct = Math.min(100, totalWeight);
    return (
      <div key="s2" className="step-content">
        <div className="page-title">포트폴리오 비중 설정</div>
        <p className="page-sub">ETF별 비중을 조절하고, 합계 100%를 맞춰주세요.</p>

        {/* Style badge */}
        <div style={{
          display:'flex',alignItems:'center',gap:10,padding:'12px 16px',borderRadius:'var(--r)',
          background: sInfo?.bgColor || 'var(--bl-s)',marginBottom:20,border:'1px solid var(--bd)'
        }}>
          <div style={{color: sInfo?.color || 'var(--bl)',flexShrink:0}}>
            {STYLE_ICONS[selectedStyle]}
          </div>
          <div>
            <div style={{fontSize:14,fontWeight:800,color:'var(--t1)'}}>{sInfo?.label}</div>
            <div style={{fontSize:12,color:'var(--t2)',marginTop:2}}>{sInfo?.desc}</div>
          </div>
        </div>

        {/* 상단 다음 버튼 */}
        <div style={{display:'flex',justifyContent:'flex-end',marginBottom:14}}>
          <button className="btn btn-primary" disabled={!isValid} onClick={() => setStep(3)}>
            시뮬레이션 확인
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="M6 4l4 4-4 4"/>
            </svg>
          </button>
        </div>

        {/* Weight bar */}
        <div style={{
          background:'var(--bg2)',borderRadius:'var(--r-sm)',border:'1.5px solid var(--bd)',
          padding:'14px 16px',marginBottom:12
        }}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
            <span className="weight-total-label">합계 비중</span>
            <span className="weight-total-value" style={{
              color: isValid ? 'var(--gr)' : totalWeight > 100 ? 'var(--rd)' : 'var(--bl)'
            }}>{totalWeight}%</span>
          </div>
          <div style={{
            height:8,borderRadius:4,background:'var(--bd)',overflow:'hidden',
            display:'flex',justifyContent:'center'
          }}>
            <div style={{
              width:'100%',height:'100%',position:'relative',borderRadius:4,overflow:'hidden'
            }}>
              <div style={{
                position:'absolute',left:'50%',top:0,height:'100%',borderRadius:4,
                transform:'translateX(-50%)',
                width: `${Math.min(100, totalWeight)}%`,
                background: isValid ? 'var(--gr)' : totalWeight > 100 ? 'var(--rd)' : 'var(--bl)',
                transition:'width .3s,background .3s'
              }}/>
            </div>
          </div>
          {!isValid && (
            <div style={{fontSize:11,color: totalWeight > 100 ? 'var(--rd)' : 'var(--t3)',marginTop:5,textAlign:'center'}}>
              {totalWeight > 100 ? `${totalWeight - 100}% 초과 — 비중을 줄여주세요` : `${100 - totalWeight}% 부족 — 합계를 100%로 맞춰주세요`}
            </div>
          )}
        </div>

        {/* ETF list */}
        <div className="etf-list">
          {portfolio.map(it => {
            const cat = it.etf.category;
            const catColor = CATEGORY_COLORS[cat] || '#8E8E93';
            const retVal = it.annualReturn ?? it.etf.annualReturn;
            return (
              <div key={it.etf.ticker} className="etf-row">
                <div className="etf-row-top">
                  <div className="etf-cat-badge" style={{
                    background: `${catColor}18`, color: catColor
                  }}>{cat}</div>
                  <div className="etf-info">
                    <div className="etf-name">{it.etf.name}</div>
                    <div className="etf-ticker">{it.etf.ticker}</div>
                    <div className="etf-return">기대수익률 연 {retVal.toFixed(1)}%</div>
                  </div>
                  <div className="etf-controls">
                    <input type="number" className="etf-weight-input" min={0} max={100} inputMode="decimal"
                      value={it.weight} onChange={e => handleWeightChange(it.etf.ticker, Number(e.target.value))}/>
                    <span className="etf-pct">%</span>
                    <button className="etf-del" onClick={() => removeETF(it.etf.ticker)}>
                      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2">
                        <path d="M3 5h10M8 5V3M7 3h2M6 5v8M10 5v8M4 5l.5 8h7l.5-8"/>
                      </svg>
                    </button>
                  </div>
                </div>
                <div className="etf-slider-row">
                  <input type="range" className="etf-slider" min={0} max={100}
                    value={it.weight} onChange={e => handleWeightChange(it.etf.ticker, Number(e.target.value))}
                    style={{'--track-fill':`${it.weight}%`}}/>
                </div>
              </div>
            );
          })}
        </div>

        <button className="btn-add-etf" onClick={() => setShowModal(true)}>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2.5">
            <path d="M8 3v10M3 8h10"/>
          </svg>
          ETF 추가하기
        </button>

        <div style={{marginTop:14,display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-secondary btn-sm" style={{fontSize:12,padding:'8px 14px',borderRadius:8}}
            onClick={autoBalance}>
            균등 분배
          </button>
          <button className="btn btn-secondary btn-sm" style={{fontSize:12,padding:'8px 14px',borderRadius:8}}
            onClick={() => handleStyleSelect(selectedStyle, isLeveraged)}>
            초기화
          </button>
        </div>

        <div className="btn-nav-row" style={{marginTop:20}}>
          <button className="btn btn-secondary" onClick={() => setStep(1)}>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="M10 12l-4-4 4-4"/>
            </svg>
            이전
          </button>
          <button className="btn btn-primary" disabled={!isValid} onClick={() => setStep(3)}>
            시뮬레이션 확인
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="M6 4l4 4-4 4"/>
            </svg>
          </button>
        </div>
      </div>
    );
  };

  /* ─ Step 3 ─ */
  const renderStep3 = () => {
    const returnText = `기대 연평균 수익률 ${weightedReturn.toFixed(2)}%`;
    return (
      <div key="s3" className="step-content">
        <div className="page-title">시뮬레이션 확인</div>
        <p className="page-sub">초기 투자금, 월 적립금, 투자 기간을 입력하면 복리 효과를 예측합니다.</p>

        {/* Return badge */}
        <div className="sim-return-badge" style={{background: returnBg, color: returnColor}}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M7 2v10M3 6l4-4 4 4"/>
          </svg>
          {returnText}
        </div>

        {/* Pie chart */}
        {portfolio.length > 0 && <DonutChart portfolio={portfolio}/>}

        {/* Inputs */}
        <div className="sim-grid">
          {/* Init */}
          <div className="sim-input-card">
            <div className="sim-input-label">초기 투자금</div>
            <div className="sim-input-value">{initInvest.toLocaleString()}<span className="sim-input-unit">만원</span></div>
            <input type="range" min={0} max={10000} step={100} value={initInvest}
              onChange={e => setInitInvest(Number(e.target.value))} className="sim-input-range"/>
            <div className="sim-input-minmax"><span>0만</span><span>1억</span></div>
          </div>
          {/* Monthly */}
          <div className="sim-input-card">
            <div className="sim-input-label">월 적립금</div>
            <div className="sim-input-value">{monthlyAmt.toLocaleString()}<span className="sim-input-unit">만원</span></div>
            <input type="range" min={10} max={1000} step={10} value={monthlyAmt}
              onChange={e => setMonthlyAmt(Number(e.target.value))} className="sim-input-range green"/>
            <div className="sim-input-minmax"><span>10만</span><span>1000만</span></div>
          </div>
          {/* Duration */}
          <div className="sim-input-card" style={{gridColumn:'1 / -1'}}>
            <div className="sim-input-label">투자 기간</div>
            <div className="sim-input-value">{duration}<span className="sim-input-unit">년</span></div>
            <input type="range" min={1} max={40} step={1} value={duration}
              onChange={e => setDuration(Number(e.target.value))} className="sim-input-range"/>
            <div className="sim-input-minmax"><span>1년</span><span>40년</span></div>
          </div>
        </div>

        {/* Quick preview */}
        {simData.length > 0 && (
          <div style={{background:'var(--bl-s)',borderRadius:'var(--r)',padding:'14px 18px',
            border:'1px solid var(--bl-m)',marginBottom:8}}>
            <div style={{fontSize:12,fontWeight:700,color:'var(--bl)',marginBottom:8}}>예상 결과 미리보기</div>
            <div style={{fontSize:20,fontWeight:800,color:'var(--t1)',letterSpacing:'-.03em'}}>
              {formatKRW(finalBalance)}원
            </div>
            <div style={{fontSize:12,color:'var(--t2)',marginTop:4}}>
              원금 {formatKRW(totalContrib)}원의 <strong style={{color:'var(--gr)'}}>{multiplier.toFixed(2)}배</strong>
              &nbsp;/ 수익 {formatKRW(totalProfit)}원
            </div>
          </div>
        )}

        <div className="btn-nav-row" style={{marginTop:16}}>
          <button className="btn btn-secondary" onClick={() => setStep(2)}>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="M10 12l-4-4 4-4"/>
            </svg>
            이전
          </button>
          <button className="btn btn-primary" onClick={() => setStep(4)}>
            결과 보기
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="M6 4l4 4-4 4"/>
            </svg>
          </button>
        </div>
      </div>
    );
  };

  /* ─ Step 4 ─ */
  const [showFullTable, setShowFullTable] = useState(false);
  const tableRows = showFullTable ? simData : simData.filter((d, i) => i % Math.max(1, Math.floor(duration / 8)) === 0 || i === simData.length - 1);

  const renderStep4 = () => (
    <div key="s4" className="step-content">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:20}}>
        <div>
          <div className="page-title">{duration}년 후 예상 자산</div>
          <div style={{fontSize:32,fontWeight:900,letterSpacing:'-.04em',color:'var(--t1)',marginTop:4}}>
            {formatKRW(finalBalance)}원
          </div>
          <div style={{fontSize:14,color:'var(--gr)',fontWeight:700,marginTop:4}}>
            원금 대비 {multiplier.toFixed(2)}배 · 수익 {formatKRW(totalProfit)}원
          </div>
        </div>
        <div style={{flexShrink:0}}>
          <div className="sim-return-badge" style={{background: returnBg, color: returnColor, marginBottom:0}}>
            연 {weightedReturn.toFixed(2)}% 기대수익률
          </div>
        </div>
      </div>

      {/* Metrics */}
      <div className="result-metrics">
        {[
          { label: '최종 예상 자산', val: `${formatKRW(finalBalance)}원`, sub: `${duration}년 후`, color: 'var(--bl)' },
          { label: '누적 원금', val: `${formatKRW(totalContrib)}원`, sub: `초기+적립`, color: 'var(--t1)' },
          { label: '총 수익', val: `${formatKRW(totalProfit)}원`, sub: `세전 추산`, color: 'var(--gr)' },
          { label: '수익 배수', val: `${multiplier.toFixed(2)}배`, sub: `원금 대비`, color: 'var(--yl)' },
        ].map((m, i) => (
          <div key={i} className="metric-card">
            <div className="metric-label">{m.label}</div>
            <div className="metric-value" style={{color: m.color}}>{m.val}</div>
            <div className="metric-sub">{m.sub}</div>
          </div>
        ))}
      </div>

      {/* Chart */}
      <div className="chart-wrap">
        <div className="chart-legend">
          <div className="legend-item">
            <div className="legend-dot" style={{background:'#0071E3'}}/>
            <span>예상 자산</span>
          </div>
          <div className="legend-item">
            <div className="legend-dot" style={{background:'#8E8E93'}}/>
            <span>누적 원금</span>
          </div>
        </div>
        <SimChart data={simData}/>
      </div>

      {/* Portfolio summary */}
      <div className="portfolio-summary">
        <div className="portfolio-summary-title">포트폴리오 구성 ({STYLES[selectedStyle]?.label || '커스텀'})</div>
        <div className="portfolio-pills">
          {portfolio.filter(it => it.weight > 0).map(it => (
            <div key={it.etf.ticker} className="portfolio-pill"
              style={{background: `${CATEGORY_COLORS[it.etf.category]||'#8E8E93'}18`, color: CATEGORY_COLORS[it.etf.category]||'#8E8E93'}}>
              {it.etf.ticker} <span style={{opacity:.7}}>{it.weight}%</span>
            </div>
          ))}
        </div>
      </div>

      {/* Year table */}
      <div className="table-wrap">
        <div className="table-header">
          <span className="table-title">연도별 자산 변화</span>
          <button className="table-toggle" onClick={() => setShowFullTable(v => !v)}>
            {showFullTable ? '간략히' : '전체 보기'}
          </button>
        </div>
        <div style={{overflowX:'auto'}}>
          <table>
            <thead>
              <tr>
                <th style={{textAlign:'left'}}>년차</th>
                <th>누적 원금</th>
                <th>예상 자산</th>
                <th>수익</th>
                <th>배수</th>
              </tr>
            </thead>
            <tbody>
              {tableRows.map(d => {
                const profit = d.balance - d.contribution;
                const mult = d.contribution > 0 ? (d.balance / d.contribution).toFixed(2) : '-';
                return (
                  <tr key={d.year}>
                    <td>{d.year}년차</td>
                    <td>{formatKRW(d.contribution)}원</td>
                    <td style={{color:'var(--bl)',fontWeight:700}}>{formatKRW(d.balance)}원</td>
                    <td className="td-profit">+{formatKRW(profit)}원</td>
                    <td style={{color:'var(--yl)',fontWeight:700}}>{mult}x</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Actions */}
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <button className="btn btn-secondary" onClick={() => setStep(3)}>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M10 12l-4-4 4-4"/>
          </svg>
          설정 변경
        </button>
        <button className="btn btn-secondary" onClick={() => setStep(2)}>
          포트폴리오 수정
        </button>
        <button className="btn btn-ghost" onClick={resetAll}>
          처음부터
        </button>
      </div>

      {/* Disclaimer */}
      <div style={{marginTop:24,padding:'14px 16px',borderRadius:'var(--r-sm)',
        background:'var(--yl-s)',border:'1px solid rgba(255,159,10,0.2)'}}>
        <div style={{fontSize:11,color:'var(--t2)',lineHeight:1.7}}>
          <strong style={{color:'var(--yl)'}}>투자 유의사항</strong>  이 시뮬레이터는 과거 데이터 기반의 가정치를 활용한 참고용 도구입니다.
          실제 수익률은 시장 환경에 따라 크게 달라질 수 있으며, 레버리지 ETF는 변동성 침식(Volatility Decay)으로
          인해 장기 보유 시 예상과 다른 결과가 나올 수 있습니다. 모든 투자 결정은 본인의 판단과 책임 아래 이루어져야 합니다.
        </div>
      </div>
    </div>
  );

  const renderStep = () => {
    if (step === 1) return renderStep1();
    if (step === 2) return renderStep2();
    if (step === 3) return renderStep3();
    if (step === 4) return renderStep4();
  };

  return (
    <>

      <div className="wrap">
        <StepBar step={step}/>

        {renderStep()}
      </div>

      {showModal && (
        <ETFModal
          onClose={() => setShowModal(false)}
          onAdd={addETF}
          existingTickers={portfolio.map(p => p.etf.ticker)}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script src="/ez-footer.js"></script>
</body>
</html>
