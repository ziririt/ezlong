<script>
const SUPABASE_URL='https://qefddgigiujosvormkyr.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlZmRkZ2lnaXVqb3N2b3Jta3lyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODYzNjEsImV4cCI6MjA5NTY2MjM2MX0.ewQPpe0ncUbzYlXUHN_dH8qi9PXWs3oDsibtAT14yaw';

const _sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let allSnapshots=[],selectedTicker=null;
function fmtPt(v){if(!v&&v!==0)return'—';return'$'+Math.round(+v).toLocaleString('en-US')}
function fmtUp(v){if(v==null)return{text:'—',cls:'zero'};const n=+v;return{text:(n>=0?'+':'')+n.toFixed(2)+'%',cls:n>0?'pos':n<0?'neg':'zero'}}
function cleanMd(text){return(text||'').replace(/이번\s*주\s*/g,'')}
function getRatingStyle(rating){
  if(!rating)return{color:'var(--ez-text3)',bg:'var(--ez-card2)',border:'var(--ez-border)'};
  const r=(rating.split('(')[0]).toLowerCase().trim();
  if(r.startsWith('strong buy'))return{color:'#30D158',bg:'rgba(48,209,88,0.12)',border:'rgba(48,209,88,0.35)'};
  if((r.startsWith('buy')||r.startsWith('outperform')||r.startsWith('overweight'))&&!r.includes('hold')&&!r.includes('mixed'))return{color:'var(--ez-blue)',bg:'var(--ez-blue-dim)',border:'rgba(10,132,255,0.35)'};
  if(r.includes('mixed')||(r.includes('buy')&&r.includes('hold')))return{color:'#FF9F0A',bg:'rgba(255,159,10,0.12)',border:'rgba(255,159,10,0.35)'};
  if(r.startsWith('hold')||r.startsWith('neutral')||r.startsWith('market perform'))return{color:'#FFD60A',bg:'rgba(255,214,10,0.10)',border:'rgba(255,214,10,0.30)'};
  if(r.includes('underperform')||r.includes('underweight')||r.includes('sell')||r.includes('reduce'))return{color:'var(--ez-red)',bg:'rgba(255,69,58,0.12)',border:'rgba(255,69,58,0.35)'};
  return{color:'var(--ez-text3)',bg:'var(--ez-card2)',border:'var(--ez-border)'}
}
async function loadSnapshots(){
  const timer=setTimeout(()=>{document.getElementById('ticker-list').innerHTML='<div style="padding:20px;color:var(--ez-red);font-size:16px;">연결 타임아웃<br>새로고침해주세요.</div>'},12000);
  try{
    const[{data:companies,error:cErr},{data:snaps,error:sErr},mktRaw]=await Promise.all([
      _sb.from('companies').select('id,ticker,company_name,sector_theme,display_order').order('display_order',{ascending:true}),
      _sb.from('report_snapshots').select('id,company_id,snapshot_date,week_key,consensus_rating,analyst_count,pt_mean,pt_median,pt_high,pt_low,pt_high_analyst,pt_low_analyst,upside_pct,one_line_summary,report_markdown,valuation_frame,source_note,is_latest').eq('is_latest',true),
      fetch('/data/market-signals.json').then(r=>r.json()).catch(()=>({}))
    ]);
    if(cErr)throw cErr;if(sErr)throw sErr;
    clearTimeout(timer);
    const mktPrices=(mktRaw.symbols||{});
    const coMap={};(companies||[]).forEach(c=>{coMap[c.id]=c});
    const raw=(snaps||[]).map(s=>({...s,companies:coMap[s.company_id]||{}}));
    const dedupMap=raw.reduce((acc,s)=>{const cid=s.company_id;if(!acc[cid]||s.id>acc[cid].id)acc[cid]=s;return acc},{});
    allSnapshots=Object.values(dedupMap).sort((a,b)=>(a.companies.display_order||99)-(b.companies.display_order||99));
    allSnapshots=allSnapshots.map(s=>{if(s.upside_pct==null){const sym=mktPrices[s.companies?.ticker];if(sym?.price&&s.pt_mean)s={...s,upside_pct:((+s.pt_mean-sym.price)/sym.price)*100};}return s;});
    renderList();
    const tsla=allSnapshots.find(s=>s.companies?.ticker==='TSLA');
    if(tsla)selectTicker('TSLA');
  }catch(e){clearTimeout(timer);document.getElementById('ticker-list').innerHTML=`<div style="padding:20px;color:var(--ez-red);font-size:16px;">오류: ${e.message}</div>`}
}
function renderList(){
  const q=document.getElementById('search-input').value.trim().toUpperCase();
  const filtered=allSnapshots.filter(s=>{const t=s.companies?.ticker||'';const n=(s.companies?.company_name||'').toUpperCase();return!q||t.includes(q)||n.includes(q)});
  if(!filtered.length){document.getElementById('ticker-list').innerHTML='<div style="padding:20px;text-align:center;color:var(--ez-text3);font-size:16px;">결과 없음</div>';return}
  function parseSentiment(rating){const bM=rating?.match(/Buy\s+(\d+)%/),hM=rating?.match(/Hold\s+(\d+)%/),sM=rating?.match(/Sell\s+(\d+)%/);if(bM||hM||sM){const b=bM?+bM[1]:0,h=hM?+hM[1]:0,s=sM?+sM[1]:0,tot=b+h+s;if(tot>0&&Math.abs(tot-100)>2){const r=100/tot;return{buy:Math.round(b*r),hold:Math.round(h*r),sell:Math.round(s*r)}}return{buy:b,hold:h,sell:s}}const r=rating?.toLowerCase()||'';if(r.includes('strong buy'))return{buy:82,hold:13,sell:5};if(r.includes('buy')&&!r.includes('mixed'))return{buy:65,hold:25,sell:10};if(r.includes('mixed')||(r.includes('buy')&&r.includes('hold')))return{buy:45,hold:35,sell:20};if(r.includes('hold')||r.includes('neutral'))return{buy:25,hold:55,sell:20};if(r.includes('underperform')||r.includes('sell'))return{buy:10,hold:30,sell:60};return{buy:45,hold:40,sell:15}}
  const html=filtered.map(s=>{const t=s.companies?.ticker||'';const co=s.companies?.company_name||'';const up=fmtUp(s.upside_pct);const isActive=t===selectedTicker?' active':'';const sent=parseSentiment(s.consensus_rating);const NEW_TICKERS=new Set(['SPCX']);const isNew=NEW_TICKERS.has(t);return`<div class="tk-card${isActive}" onclick="selectTicker('${t}')" data-ticker="${t}"><div class="tk-row1"><span style="display:inline-flex;align-items:center;gap:4px;"><span class="tk-ticker">${t}</span>${isNew?'<span class="tk-new-badge">NEW</span>':''}</span><span class="tk-upside ${up.cls}">${up.text}</span></div><div class="tk-row2">${co}</div><div class="tk-sentiment"><div class="tk-s-buy" style="width:${sent.buy}%"></div><div class="tk-s-hold" style="width:${sent.hold}%"></div><div class="tk-s-sell" style="width:${sent.sell}%"></div></div></div>`}).join('');
  document.getElementById('ticker-list').innerHTML=html;
}
async function selectTicker(ticker){
  selectedTicker=ticker;
  document.querySelectorAll('.tk-card').forEach(el=>el.classList.toggle('active',el.dataset.ticker===ticker));
  document.getElementById('report-detail').innerHTML='<div class="ar-loading"><div class="spinner"></div>리포트 로딩 중…</div>';
  const snap=allSnapshots.find(s=>s.companies?.ticker===ticker);if(!snap)return;
  // 해당 종목의 모든 snapshot_id 조회 → 전 주차 analyst_views 포함
  const{data:compSnaps}=await _sb.from('report_snapshots').select('id').eq('company_id',snap.company_id);
  const snapIds=(compSnaps||[]).map(s=>s.id);
  const{data:allViews}=snapIds.length?await _sb.from('analyst_views').select('*').in('snapshot_id',snapIds):{data:[]};
  // 동일 analyst+house 중 reference_date 최신 항목만 유지 (중복 제거)
  const seen=new Map();
  [...(allViews||[])].sort((a,b)=>(b.reference_date||'').localeCompare(a.reference_date||'')).forEach(v=>{
    const k=(v.analyst_name||'')+'|'+(v.house||'');
    if(!seen.has(k))seen.set(k,v);
  });
  renderDetail(snap,Array.from(seen.values()));
}
function renderDetail(snap,views){
  const t=snap.companies?.ticker||'',co=snap.companies?.company_name||'',sec=snap.companies?.sector_theme||'';
  const tier1=TIER1.has(t),up=fmtUp(snap.upside_pct),ac=snap.analyst_count||0;
  const buyM=snap.consensus_rating?.match(/Buy\s+(\d+)%/),holdM=snap.consensus_rating?.match(/Hold\s+(\d+)%/),sellM=snap.consensus_rating?.match(/Sell\s+(\d+)%/);
  let buyP=buyM?+buyM[1]:tier1?65:70,holdP=holdM?+holdM[1]:25,sellP=sellM?+sellM[1]:Math.max(0,100-buyP-holdP);
  let buyN=Math.round(ac*buyP/100),holdN=Math.round(ac*holdP/100),sellN=ac-buyN-holdN;
  const low=+snap.pt_low||0,high=+snap.pt_high||0,mean=+snap.pt_mean||0,range=high-low||1;
  const meanPct=Math.max(2,Math.min(98,((mean-low)/range)*100));
  const mdHtml=snap.report_markdown?marked.parse(cleanMd(snap.report_markdown)):'';
  const rrRank=r=>{const s=(r||'').toLowerCase();return s.includes('buy')?0:s.includes('hold')||s.includes('neutral')?1:2};
  const realViews=views.filter(v=>v.house!=='Synthetic');
  const synthViews=views.filter(v=>v.house==='Synthetic');
  const displayViews=realViews.length>0?realViews:synthViews;
  const isFallbackSynth=realViews.length===0&&synthViews.length>0;
  if(realViews.length>0){buyN=realViews.filter(v=>(v.stance_bucket||'').toLowerCase()==='bull').length;holdN=realViews.filter(v=>(v.stance_bucket||'').toLowerCase()==='neutral').length;sellN=realViews.filter(v=>(v.stance_bucket||'').toLowerCase()==='bear').length;const tot=buyN+holdN+sellN;if(tot>0){buyP=Math.round(buyN/tot*100);holdP=Math.round(holdN/tot*100);sellP=Math.round(sellN/tot*100);}}
  const bucketOrder={'bull':0,'neutral':1,'bear':2};
  const sortedViews=[...displayViews].sort((a,b)=>{const aB=bucketOrder[a.stance_bucket||'neutral']??1,bB=bucketOrder[b.stance_bucket||'neutral']??1;if(aB!==bB)return aB-bB;return(b.reference_date||'').localeCompare(a.reference_date||'');});
  const avHtml=sortedViews.length===0?'<div class="av-empty-state">애널리스트 뷰 데이터가 없습니다.</div>':`${isFallbackSynth?'<div class="av-synthetic-note">애널리스트 뷰 데이터가 없어서 시나리오 기반 합성 뷰를 보여드립니다.</div>':''}<div class="av-grid">${sortedViews.map(v=>{const sb=(v.stance_bucket||'neutral').toLowerCase();return`<div class="av-card ${sb}"><div class="av-header-row"><div class="av-price-col"><div class="av-rating-tag">${v.rating}</div><div class="av-tp-big">${fmtPt(v.target_price)}</div><div><span class="av-stance-badge ${sb}">${sb==='bull'?'강세':sb==='bear'?'약세':'중립'}</span></div></div><div class="av-name-col"><div class="av-name">${v.analyst_name}</div><div class="av-house">${v.house}</div><div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;"><span class="av-date-small">${v.reference_date||''}</span>${v.snapshot_id===snap.id?'<span class="av-new-badge">NEW</span>':''}</div></div></div><div class="av-thesis">${v.thesis||'—'}</div></div>`}).join('')}</div>`;
  const rs=getRatingStyle(snap.consensus_rating),rLabel=snap.consensus_rating?.split('(')[0].trim()||'—';
  const html=`<div class="rp-content"><div class="rp-hero"><div class="rp-hero-top"><div><div class="rp-ticker-name">${co}</div><div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;"><div class="rp-big-ticker" style="margin:0;">${t}</div><div><div class="rp-consensus-badge" style="color:${rs.color};background:${rs.bg};border-color:${rs.border}">${rLabel}</div><div class="rp-analyst-sub" style="margin-top:4px;">애널리스트 ${ac}명 기준</div></div></div><div class="rp-company-row"><span class="rp-sector-pill">${sec}</span></div></div><div class="rp-hero-right"><div class="rp-date-tag">${snap.snapshot_date} · ${snap.week_key}</div></div></div><div class="rp-kpi-row"><div class="rp-kpi"><div class="rp-kpi-label">Avg Target</div><div class="rp-kpi-val" id="kpi-mean">—</div></div><div class="rp-kpi-divider"></div><div class="rp-kpi"><div class="rp-kpi-label">Upside</div><div class="rp-kpi-val ${up.cls==='pos'?'green':up.cls==='neg'?'red':''}">${up.text}</div></div><div class="rp-kpi-divider"></div><div class="rp-kpi"><div class="rp-kpi-label">High Target</div><div class="rp-kpi-val">${fmtPt(snap.pt_high)}</div></div><div class="rp-kpi-divider"></div><div class="rp-kpi"><div class="rp-kpi-label">Low Target</div><div class="rp-kpi-val">${fmtPt(snap.pt_low)}</div></div></div></div><div class="rp-body"><div class="rp-frame-section" style="padding-top:20px;"><div class="rp-section-label" style="color:var(--ez-blue);font-weight:800;letter-spacing:1.5px;">VALUATION FRAME</div><div class="rp-frame-pill"><span class="rp-frame-icon">⚖️</span><span>${snap.valuation_frame||'—'}</span></div></div><div class="rp-chart-section"><div class="rp-section-label">Price History</div><div id="analyst-price-chart"></div></div><div class="rp-pt-section"><div class="rp-section-label">Price Target Range</div><div class="rp-pt-range"><div class="rp-pt-track"><div class="rp-pt-fill" id="pt-fill" style="left:0;right:0;"></div><div class="rp-pt-mean-marker" id="pt-mean-dot" style="left:50%;"></div><div class="rp-pt-current" title="컨센서스 평균" id="pt-mean-marker" style="left:50%;"></div></div><div class="rp-pt-labels"><div class="rp-pt-label"><div class="rp-pt-tag">Low · Bear</div><div class="rp-pt-num" style="color:var(--ez-red)">${fmtPt(snap.pt_low)}</div><div class="rp-pt-analyst">${snap.pt_low_analyst||''}</div></div><div class="rp-pt-label center"><div class="rp-pt-tag">Avg · Consensus</div><div class="rp-pt-num" style="color:var(--ez-blue)">${fmtPt(snap.pt_mean)}</div><div class="rp-pt-analyst">${ac}명 평균</div></div><div class="rp-pt-label right"><div class="rp-pt-tag">High · Bull</div><div class="rp-pt-num" style="color:var(--ez-green)">${fmtPt(snap.pt_high)}</div><div class="rp-pt-analyst">${snap.pt_high_analyst||''}</div></div></div></div></div><div class="rp-sentiment-section"><div class="rp-section-label">Analyst Sentiment · ${ac}명</div><div class="rp-sentiment-bars"><div class="rp-sent-row"><div class="rp-sent-label">Buy</div><div class="rp-sent-bar-bg"><div class="rp-sent-bar-fill buy" id="bar-buy" style="width:${buyP}%"></div></div><div class="rp-sent-pct">${buyN}명</div></div><div class="rp-sent-row"><div class="rp-sent-label">Hold</div><div class="rp-sent-bar-bg"><div class="rp-sent-bar-fill hold" id="bar-hold" style="width:${holdP}%"></div></div><div class="rp-sent-pct">${holdN}명</div></div><div class="rp-sent-row"><div class="rp-sent-label">Sell</div><div class="rp-sent-bar-bg"><div class="rp-sent-bar-fill sell" id="bar-sell" style="width:${sellP}%"></div></div><div class="rp-sent-pct">${sellN}명</div></div></div></div><div class="rp-summary-section"><div class="rp-section-label">Summary</div><div class="rp-summary-box">${snap.one_line_summary||'—'}</div></div>${tier1&&mdHtml?`<div class="rp-report-section"><div class="rp-section-label">Research Note</div><div class="markdown-body">${mdHtml}</div></div>`:''}<div class="rp-av-section"><div class="rp-section-label">Analyst Views</div>${avHtml}</div><div class="rp-source-note">${snap.source_note||''}</div></div></div>`;
  const el=document.getElementById('report-detail');el.innerHTML=html;
  setTimeout(()=>initPriceChart(t,snap),200);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    document.querySelectorAll('.rp-sent-bar-fill').forEach(b=>{const w=b.style.width;b.style.transform=`scaleX(${parseFloat(w)/100})`});
    const meanDot=document.getElementById('pt-mean-dot'),meanMk=document.getElementById('pt-mean-marker');
    if(meanDot){meanDot.style.left=meanPct+'%';meanMk.style.left=meanPct+'%'}
    animateCounter(document.getElementById('kpi-mean'),mean,v=>fmtPt(v));
  })});
}
function animateCounter(el,target,fmt,dur=600){if(!el||!target)return;const start=performance.now();function step(now){const p=Math.min(1,(now-start)/dur);const ease=1-Math.pow(1-p,3);el.textContent=fmt(target*ease);if(p<1)requestAnimationFrame(step);else el.textContent=fmt(target)}requestAnimationFrame(step)}
const TV_SYM={TSLA:'NASDAQ:TSLA',NVDA:'NASDAQ:NVDA',AAPL:'NASDAQ:AAPL',MSFT:'NASDAQ:MSFT',GOOGL:'NASDAQ:GOOGL',META:'NASDAQ:META',AMZN:'NASDAQ:AMZN',AMD:'NASDAQ:AMD',AVGO:'NASDAQ:AVGO',ASML:'NASDAQ:ASML',TSM:'NYSE:TSM',ARM:'NASDAQ:ARM',PLTR:'NASDAQ:PLTR',IONQ:'NYSE:IONQ',SMCI:'NASDAQ:SMCI',SHOP:'TSX:SHOP',CRWD:'NASDAQ:CRWD',ABNB:'NASDAQ:ABNB',NFLX:'NASDAQ:NFLX',COIN:'NASDAQ:COIN',HOOD:'NASDAQ:HOOD',MARA:'NASDAQ:MARA',RIOT:'NASDAQ:RIOT',SNOW:'NYSE:SNOW',INTU:'NASDAQ:INTU',KVYO:'NYSE:KVYO',CART:'NASDAQ:CART',KVUE:'NYSE:KVUE',CAVA:'NYSE:CAVA',AFRM:'NASDAQ:AFRM',CRCL:'NYSE:CRCL',BMNR:'NYSE:BMNR',SBET:'NASDAQ:SBET',GLBE:'NASDAQ:GLBE',NU:'NYSE:NU',DDOG:'NASDAQ:DDOG',CRWV:'NASDAQ:CRWV',IREN:'NASDAQ:IREN',ORCL:'NYSE:ORCL',MRVL:'NASDAQ:MRVL',MSTR:'NASDAQ:MSTR',TWLO:'NYSE:TWLO',DELL:'NYSE:DELL'};
function initPriceChart(ticker,snap){
  const container=document.getElementById('analyst-price-chart');if(!container)return;
  container.innerHTML='';
  const sym=TV_SYM[ticker]||'NASDAQ:'+ticker;
  const IS_DARK=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const wrapper=document.createElement('div');wrapper.className='tradingview-widget-container';wrapper.style.cssText='height:100%;width:100%;';
  const widgetDiv=document.createElement('div');widgetDiv.className='tradingview-widget-container__widget';widgetDiv.style.cssText='height:100%;width:100%;';
  wrapper.appendChild(widgetDiv);
  const cfg={symbol:sym,width:'100%',height:'100%',locale:'en',dateRange:'6M',colorTheme:IS_DARK?'dark':'light',isTransparent:true,autosize:true,noTimeScale:false,chartOnly:false};
  const script=document.createElement('script');script.type='text/javascript';script.async=true;
  script.src='https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js';
  script.textContent=JSON.stringify(cfg);
  wrapper.appendChild(script);container.appendChild(wrapper);
}
document.getElementById('search-input').addEventListener('input',renderList);
loadSnapshots();
</script>
