<script>
/* ── 모델 포트폴리오 렌더러 ─────────────────────────────────────────
   데이터는 전부 data/model-portfolio.json 한 곳에 있다. 이 파일은 그리기만 한다.
   시세·주간 RSI는 매주 일요일 파이프라인(model-portfolio.yml)이 갱신하고,
   비중·편입/편출·조정 권고 같은 판단은 월 1회 사람이 갱신한다.
   두 갱신이 같은 파일을 쓰므로 화면과 숫자가 어긋날 자리가 없다. */
(function () {
  'use strict';
  var D = null;

  function esc(s) { return String(s == null ? '' : s); }
  var S = function (i) { return 'var(--mp-s' + i + ')'; };

  function fmtPx(h) {
    return h.c === '₩' ? '₩' + h.px.toLocaleString()
      : '$' + h.px.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function pxInt(h) { return (h.c === '₩' ? '₩' : '$') + Math.round(h.px).toLocaleString(); }
  function dd(h) { return (h.px / h.hi - 1) * 100; }
  function band(h) { return (h.px - h.lo) / (h.hi - h.lo) * 100; }

  /* 판정 — 주간 RSI(14)가 있으면 RSI 기준, 없으면 52주 밴드 위치로 폴백.
     종목별로 섞여 있어도 안전하다. 화면 세 곳이 모두 이 함수 하나를 쓴다. */
  function signal(h) {
    var useRsi = D.meta.signalSource === 'rsi' && h.rsiW != null;
    var v = useRsi ? h.rsiW : band(h);
    var cut = useRsi ? [20, 30, 70, 80] : [20, 35, 75, 90];
    if (v >= cut[3]) return { k: '초과매수권', c: 'sig-ob' };
    if (v >= cut[2]) return { k: '과매수권', c: 'sig-b' };
    if (v >= cut[1]) return { k: '적정권', c: 'sig-n' };
    if (v >= cut[0]) return { k: '과매도권', c: 'sig-s' };
    return { k: '초과매도권', c: 'sig-os' };
  }
  /* 주간 RSI 는 판정 기준이 무엇이든 항상 함께 보여준다. 판정은 구간을,
     RSI 는 그 안에서의 위치와 방향을 말해준다 — 둘은 대체가 아니라 보완이다. */
  function rsiNote(h) {
    return h.rsiW != null ? ' · 주간 RSI ' + h.rsiW.toFixed(1) : '';
  }

      }).join('') + '</div>' +
      '<p class="note">권고 반영 후 합계는 그대로 100%다. 조정은 한 번에 하지 않고 <b>3회 분할</b>로 집행한다.</p></section>';

          '<span class="mv" style="color:var(--sig-s)">' + esc(x.w) + '</span></div>' +
          '<div class="why">' + x.why + '</div></div>';
      }).join('') +
      '<div class="rb"><div class="top"><span class="tag" style="background:var(--ez-text3)">검토했으나 보류</span>' +
      '<h3>후보 4종목</h3></div><div class="why"><b>편입 후보 선정 원칙</b> — SOXX가 이미 담고 있는 34종목' +
      '(어플라이드머티어리얼즈·KLA·램리서치·텍사스인스트루먼트·퀄컴·아나로그디바이스 등)은 개별 편입 후보에서 제외한다. ' +
      '이미 5% 비중으로 갖고 있기 때문이다. 아래는 SOXX 밖에 있는 종목만 검토한 결과다.</div>' +
      D.watchNew.map(function (w) {
        return '<div class="why"><b>' + esc(w.nm) + ' (' + esc(w.tk) + ')</b> — ' + esc(w.why) + '</div>';
      }).join('') + '</div></div></section>';

    /* 운용 규칙 */
    out += '<section><h2>운용 규칙</h2><div class="rules">' +
      D.rules.map(function (r) {
        return '<div class="rule"><div class="k">' + esc(r[0]) + '</div><div class="v">' + esc(r[1]) +
          '</div><div class="d">' + esc(r[2]) + '</div></div>';
      }).join('') + '</div></section>';

    /* 일정 */
    out += '<section><h2>주요 일정 · 핵심 20종목 한정</h2>' +
      '<p class="h2sub">비중이 작거나 시장 영향이 제한적인 종목의 일정은 싣지 않는다.</p>' +
      '<div class="card"><ul class="cal">' +
      D.calendar.map(function (c) {
        return '<li' + (c.hot ? ' class="hot"' : '') + '><span class="dt">' + esc(c.d) + '</span>' +
          '<span class="tx">' + esc(c.t) + '</span></li>';

      '<p class="note">날짜는 미국 동부시간(ET) 기준. 한국 시간으로는 대부분 다음 날 새벽이다. ' +
      '10월 이후 일정은 통상 패턴 기반 추정이며 확정 공시가 아니다.</p></div></section>';

    /* 전체 종목 데이터 */
    out += '<section><h2>전체 종목 데이터</h2><div class="card">' +
      '<p class="tblhint">표를 좌우로 밀면 밴드·PER·Fwd 까지 볼 수 있다.</p>' +
      '<div class="tblwrap"><table>' +
      '<thead><tr><th>종목</th><th>티커</th><th>비중</th><th>종가</th><th>판정</th>' +
      '<th>고점대비</th><th>밴드</th><th>PER</th><th>Fwd</th></tr></thead><tbody>' +
      H.slice().sort(function (a, b) { return b.w - a.w; }).map(function (h) {
        var s = signal(h);
        var rnd = function (v) { return (v === '—' || v == null) ? '—' : Math.round(parseFloat(v)); };
        return '<tr><td>' + esc(h.nm) + '</td><td>' + esc(h.tk) + '</td><td>' + h.w.toFixed(1) + '%</td>' +
          '<td>' + pxInt(h) + '</td><td class="sigt ' + s.c + '">' + s.k + '</td>' +
          '<td>' + dd(h).toFixed(0) + '%</td><td>' + band(h).toFixed(0) + '%</td>' +
          '<td>' + rnd(h.pe) + '</td><td>' + rnd(h.fpe) + '</td></tr>';
      }).join('') + '</tbody></table></div></div></section>';

    return { html: out, t20: t20 };
  }

  function posMap(h) {
    var b = Math.max(0, Math.min(100, band(h)));
    var zones = [[0, 20, 'os'], [20, 35, 's'], [35, 75, 'n'], [75, 90, 'b'], [90, 100, 'ob']];
    var fills = { os: 'var(--zn-os)', s: 'var(--zn-s)', n: 'var(--zn-n)', b: 'var(--zn-b)', ob: 'var(--zn-ob)' };
    var seg = zones.map(function (z) {
      return '<div style="position:absolute;left:' + z[0] + '%;width:' + (z[1] - z[0]) +
        '%;top:0;bottom:0;background:' + fills[z[2]] + '"></div>';
    }).join('');
    var s = signal(h);
    return '<div class="posmap"><div class="pmhead"><span class="pmnm">' + esc(h.nm) + '</span>' +
      '<span class="pmtk">' + esc(h.tk) + ' · 비중 ' + h.w.toFixed(1) + '%</span>' +
      '<span class="sig ' + s.c + '">' + s.k + '</span>' +
      '<span class="pmpx">' + fmtPx(h) + '</span></div>' +
      '<div style="position:relative;height:30px;border-radius:var(--ez-r-xs);overflow:visible;background:var(--ez-card2)">' +
      '<div style="position:absolute;inset:0;border-radius:var(--ez-r-xs);overflow:hidden">' + seg + '</div>' +
      '<div style="position:absolute;left:calc(' + b.toFixed(1) + '% - 3px);top:-5px;bottom:-5px;' +
      'width:6px;border-radius:3px;background:var(--ez-text);box-shadow:0 0 0 3px var(--ez-card)"></div></div>' +
      '<div class="pmscale"><span>52주 저점 ' + h.c + h.lo.toLocaleString() + '</span>' +
      '<span class="mid">초과매도권 · 과매도권 · 적정권 · 과매수권 · 초과매수권</span>' +
      '<span>52주 고점 ' + h.c + h.hi.toLocaleString() + '</span></div>' +
      '<p class="note">52주 고점 대비 <b>' + dd(h).toFixed(1) + '%</b> · 저점 대비 <b>+' +
      ((h.px / h.lo - 1) * 100).toFixed(1) + '%</b> · PER ' + esc(h.pe) + ' · Fwd PER ' + esc(h.fpe) +
      rsiNote(h) + '<br>' + esc(h.d) + '</p></div>';
  }

  var aiProbe = {};   // 티커 → AI 차트분석 파일 실재 여부(세션 캐시)

  /* AI 차트분석이 쓰는 심볼 표기 — 한국 종목은 거래소 접미사가 붙는다.
     차트분석 쪽 색인 키가 '000660.KS' 라서 '000660' 으로 보내면 해시가
     아무 종목도 못 찾고 기본 화면(QQQ)이 열린다. */
  function aiSymbol(h) { return h.c === '₩' ? h.tk + '.KS' : h.tk; }
  function aiFile(h) { return 'analysis-' + aiSymbol(h).replace(/[.\-]/g, '_') + '.json'; }

  function setChartLink(link, h, useAI) {
    if (useAI) {
      link.href = '/chart-analysis.html#' + encodeURIComponent(aiSymbol(h));
      link.removeAttribute('target'); link.removeAttribute('rel');
      link.textContent = 'AI 차트분석에서 보기';
    } else {
      link.href = 'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(h.sym) + '&interval=W';
      link.target = '_blank'; link.rel = 'noopener';
      link.textContent = '주간 차트 열기';
    }
  }

  function boot(data) {
    D = data;
    document.getElementById('stamp').innerHTML =
      '기준일 <b>' + esc(D.meta.asOfLabel) + '</b> · 주식 100% · ' + D.meta.holdings + '종목 · ' +
      esc(D.meta.version) + '<br>시세·주간 RSI는 매주 일요일 갱신 · 최종 갱신 ' + esc(D.meta.updatedKST);
    document.getElementById('lede').innerHTML = D.lede;

    var built = sectionsHTML();
    document.getElementById('app').innerHTML = built.html;
    document.getElementById('risk').innerHTML = '<p><b>리스크 고지</b></p>' +
      D.disclaimer.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') +
      '<p style="margin-top:14px">데이터 출처 ' + esc(D.meta.priceSource) + ' · 기준일 ' +
      esc(D.meta.asOf) + ' 종가 · ' + esc(D.meta.version) + '</p>';

    /* 종목 선택 */
    var sel = document.getElementById('symSel');
    var list = built.t20.slice().sort(function (a, b) { return b.w - a.w; });
    var soxx = D.holdings.filter(function (h) { return h.tk === 'SOXX'; })[0];
    if (soxx) list = list.concat([soxx]);
    sel.innerHTML = list.map(function (h) {
      return '<option value="' + esc(h.tk) + '">' + esc(h.nm) + ' (' + esc(h.tk) + ') · ' + h.w.toFixed(1) + '%</option>';
    }).join('');

    function draw() {
      var h = D.holdings.filter(function (x) { return x.tk === sel.value; })[0];
      if (!h) return;
      document.getElementById('posmap').innerHTML = posMap(h);
      /* 우리 차트 코너로 보낸다. 한국 종목은 AI 차트분석 대상이 아니라
         그때만 TradingView 로 내보낸다(앱에서는 ez-nav.js 가 기기 브라우저로 연다). */
      /* AI 차트분석은 **해시**로 종목을 받는다(?symbol= 이 아니다).
         chart-analysis.html 이 location.hash 를 읽어 해당 종목을 선택하고,
         hashchange 도 처리한다. 쿼리스트링으로 보내면 조용히 무시되고
         기본 종목(QQQ)이 열린다 — 링크가 헛도는 걸 눈치채기 어렵다.

         그리고 우리 26종목이 전부 AI 차트분석 대상인 건 아니다. h.ai 는
         주간 파이프라인이 data/analysis-{티커}.json 실재 여부로 채운다.
         없는 종목까지 그 링크를 걸면 엉뚱한 종목 화면이 열린다. */
      var link = document.getElementById('chartLink');
      setChartLink(link, h, h.ai);

      /* h.ai 는 주 1회(일요일) 파이프라인이 채운다. 그 사이에 차트분석이 새
         종목을 굽기 시작하면 최대 일주일 동안 플래그가 거짓으로 남는다.
         플래그가 꺼져 있을 때만 실제 파일을 한 번 두드려 본다 — 200이면
         바로 AI 링크로 승격한다. 켜져 있는 종목은 확인하지 않으므로
         평소엔 추가 요청이 0이다. */
      if (!h.ai && !aiProbe.hasOwnProperty(h.tk)) {
        fetch('/data/' + aiFile(h), { method: 'HEAD' })
          .then(function (r) {
            aiProbe[h.tk] = r.ok;
            if (r.ok && sel.value === h.tk) setChartLink(link, h, true);
          })
          .catch(function () { aiProbe[h.tk] = false; });
      } else if (aiProbe[h.tk]) {
        setChartLink(link, h, true);
      }
    }
    sel.addEventListener('change', draw);
    draw();
  }

  fetch('/data/model-portfolio.json?t=' + Math.floor(Date.now() / 3600000))
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(boot)
    .catch(function () {
      document.getElementById('app').innerHTML =
        '<div class="loading">데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
    });
})();
</script>
</body>
