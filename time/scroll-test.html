<!DOCTYPE html>
<html lang="ko">
<head>
<!-- =====================================================================
  FlipZen 스크롤 버그 격리 실험 페이지 (2026-07-18, Fable / ver.1.2.9와 함께 배포)

  앱의 CSS(styles.css)·JS(app.js) 없이, 앱과 동일한 viewport 메타만 가진
  초미니멀 페이지. 화면 전체가 "내부 스크롤 영역"(position:fixed +
  overflow-y:auto)이고, 상단 HUD에 스크롤 위치가 실시간 표시된다.

  - 기본:   ezlong.com/time/scroll-test.html        (문서 스크롤 없음)
  - 변형:   ezlong.com/time/scroll-test.html?long=1 (문서를 300vh로 늘림)

  판정: 화면을 문지를 때 상단의 큰 숫자가 올라가면 성공, 0에 머물면 실패.
  진단이 끝나면 이 파일은 제거 예정.
===================================================================== -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>scroll test</title>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="hud" style="position:fixed;top:0;left:0;right:0;z-index:99999;pointer-events:none;
  background:rgba(0,0,0,0.75);color:#fff;text-align:center;
  padding:max(50px, env(safe-area-inset-top)) 10px 12px;font-weight:800;">
  <div id="mode" style="font-size:15px;margin-bottom:4px;">…</div>
  <div style="font-size:15px;">내부 스크롤: <span id="inner" style="font-size:34px;color:#5dff9d;">0</span>px</div>
  <div style="font-size:15px;">문서 스크롤: <span id="doc" style="font-size:34px;color:#7bc4ff;">0</span>px · 터치 <span id="tm">0</span>회 · PD <span id="pd">0</span></div>
</div>

<div id="scroller" style="position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;background:#0d1f33;">
  <div id="content" style="height:4000px;color:#fff;text-align:center;padding-top:240px;font-size:18px;font-weight:700;
    background:repeating-linear-gradient(#16324f, #16324f 120px, #1d436b 120px, #1d436b 240px);">
    이 화면을 위아래로 문지르세요<br>위의 초록 숫자가 올라가면 성공
  </div>
</div>

<script>
(function () {
  var long = /[?&]long=1/.test(location.search);
  document.getElementById("mode").textContent = long
    ? "실험 B — 문서 스크롤 있음(300vh)" : "실험 A — 문서 스크롤 없음";
  if (long) {
    // 문서 자체를 스크롤 가능하게: fixed 스크롤러 뒤에 300vh 스페이서
    var sp = document.createElement("div");
    sp.style.cssText = "height:300vh;";
    document.body.appendChild(sp);
  }
  var sc = document.getElementById("scroller");
  var innerEl = document.getElementById("inner");
  var docEl = document.getElementById("doc");
  var tmEl = document.getElementById("tm");
  var pdEl = document.getElementById("pd");
  var tm = 0, pd = 0;
  document.addEventListener("touchmove", function (e) {
    tm++; if (e.defaultPrevented) pd++;
  }, { passive: true });
  setInterval(function () {
    innerEl.textContent = Math.round(sc.scrollTop);
    var d = Math.max(window.scrollY || 0, (window.visualViewport && visualViewport.pageTop) || 0);
    docEl.textContent = Math.round(d);
    tmEl.textContent = tm;
    pdEl.textContent = pd;
  }, 120);
})();
</script>
</body>
</html>
