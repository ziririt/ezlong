<script>
var DATA_URL = '/data/market-scorecard-data.json';
var MAX_SHOW = 10;

function loadData() {
  document.getElementById('mv-updated-at').textContent = '데이터 로딩 중...';

  fetch(DATA_URL + '?t=' + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      renderStack(data);
    })
    .catch(function(e) {
      document.getElementById('mv-stack').innerHTML =
        '<div class="mv-error">데이터를 불러오지 못했습니다.<br>' + e.message + '</div>';
      document.getElementById('mv-updated-at').textContent = '불러오기 실패';
    });
}

function renderStack(data) {
  var entries = data.entries || [];
  var maxEntries = data.max_entries || MAX_SHOW;

  // 최신순 정렬 (id 내림차순)
  entries = entries.slice().sort(function(a, b) {
    return (b.id || '').localeCompare(a.id || '');
  });

  // 최대 10개
  entries = entries.slice(0, maxEntries);

  // updated_at 표시
  var updatedEl = document.getElementById('mv-updated-at');
  if (data.updated_at) {
    var d = new Date(data.updated_at);
    var kst = new Date(d.getTime() + 9 * 3600 * 1000);
    var mm = kst.getUTCMonth() + 1;
    var dd = kst.getUTCDate();
    var hh = String(kst.getUTCHours()).padStart(2, '0');
    var mi = String(kst.getUTCMinutes()).padStart(2, '0');
    updatedEl.textContent = '최종 업데이트: ' + mm + '/' + dd + ' ' + hh + ':' + mi + ' KST · 총 ' + entries.length + '개';
  }

  var stack = document.getElementById('mv-stack');

  if (!entries.length) {
    stack.innerHTML = '<div class="mv-empty">아직 분석 데이터가 없습니다.<br>매일 5회 자동 업데이트됩니다.</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < entries.length; i++) {
    html += '<div class="mv-entry">' + renderEntry(entries[i], i === 0) + '</div>';
    if (i < entries.length - 1) {
      html +=
        '<div class="mv-connector">' +
          '<div class="mv-connector-arrow"></div>' +
          '<div class="mv-connector-line"></div>' +
        '</div>';
    }
  }
  stack.innerHTML = html;
}

function renderEntry(e, isLatest) {
  var pos = e.positive_total || 0;
  var neg = e.negative_total || 0;
  var kev = e.key_event || {};

  // 긍정 요인
  var posFactors = '';
  var pf = e.positive_factors || [];
  for (var i = 0; i < pf.length; i++) {
    if (i > 0) posFactors += '<div class="mv-factor-divider"></div>';
    posFactors +=
      '<div class="mv-factor-item">' +
        '<div class="mv-factor-score pos">' + pf[i].score + '</div>' +
        '<div class="mv-factor-name">' + escHtml(pf[i].name) + '</div>' +
        '<div class="mv-factor-desc">' + escHtml(pf[i].desc) + '</div>' +
      '</div>';
  }

  // 부정 요인
  var negFactors = '';
  var nf = e.negative_factors || [];
  for (var j = 0; j < nf.length; j++) {
    if (j > 0) negFactors += '<div class="mv-factor-divider"></div>';
    negFactors +=
      '<div class="mv-factor-item">' +
        '<div class="mv-factor-score neg">' + nf[j].score + '</div>' +
        '<div class="mv-factor-name">' + escHtml(nf[j].name) + '</div>' +
        '<div class="mv-factor-desc">' + escHtml(nf[j].desc) + '</div>' +
      '</div>';
  }

  // 혼조·양면 재료 (2026-07-03 신설) — 없으면 섹션 자체를 렌더링하지 않음
  var mixedHtml = '';
  var mf = e.mixed_factors || [];
  if (mf.length) {
    var mixedItems = '';
    for (var k = 0; k < mf.length; k++) {
      if (k > 0) mixedItems += '<div class="mv-factor-divider"></div>';
      mixedItems +=
        '<div class="mv-mixed-item">' +
          '<div class="mv-mixed-name">' + escHtml(mf[k].name) + '</div>' +
          '<div class="mv-mixed-desc">' + escHtml(mf[k].desc) + '</div>' +
        '</div>';
    }
    mixedHtml =
      '<div class="mv-mixed">' +
        '<div class="mv-mixed-title">혼조 · 해석 엇갈림</div>' +
        mixedItems +
      '</div>';
  }

  var latestClass = isLatest ? ' mv-ts-latest' : '';
  var latestBadge = isLatest
    ? ' &nbsp;<span style="font-size:16px;font-weight:700;background:rgba(255,255,255,0.25);padding:2px 8px;border-radius:20px;">최신</span>'
    : ' &nbsp;<span style="font-size:16px;font-weight:500;color:rgba(255,255,255,0.45);">이전 분석</span>';
  var cardClass = isLatest ? 'mv-card' : 'mv-card mv-card-past';

  return (
    '<div class="' + cardClass + '">' +

      /* 타임스탬프 — 크게 강조 */
      '<div class="mv-ts' + latestClass + '">' +
        '<div class="mv-ts-icon"></div>' +
        '<div class="mv-ts-text">' + escHtml(e.timestamp_kst || '') + latestBadge + '</div>' +
      '</div>' +

      /* 핵심 이벤트 */
      '<div class="mv-event">' +
        '<div class="mv-event-label">향후 핵심 이슈<span class="mv-event-label-time">(최근 6시간, 향후 12시간 감안)</span></div>' +
        '<div class="mv-event-name">' + escHtml(kev.name || '-') + '</div>' +
        '<div class="mv-event-why">' + escHtml(kev.why || '') + '</div>' +
      '</div>' +

      /* 점수 구도 */
      '<div class="mv-score-section">' +
        '<div class="mv-score-row">' +
          '<div class="mv-score-side left">' +
            '<div class="mv-score-label pos">긍정</div>' +
            '<div class="mv-score-num pos">' + pos + '</div>' +
          '</div>' +
          '<div class="mv-score-vs">VS</div>' +
          '<div class="mv-score-side right">' +
            '<div class="mv-score-label neg">부정</div>' +
            '<div class="mv-score-num neg">' + neg + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="mv-bar">' +
          '<div class="mv-bar-pos" style="width:' + pos + '%">' + pos + '</div>' +
          '<div class="mv-bar-neg" style="width:' + neg + '%">' + neg + '</div>' +
        '</div>' +
        '<div class="mv-summary">' + escHtml(e.summary || '') + '</div>' +
      '</div>' +

      /* 혼조·양면 재료 (있을 때만) — 점수 구도 바로 아래, 요인 2열 위 (2026-07-03 상단 이동) */
      mixedHtml +

      /* 2열 요인 */
      '<div class="mv-factors">' +
        '<div class="mv-factor-col left">' +
          '<div class="mv-factor-col-title pos">긍정 합계 ' + pos + '</div>' +
          posFactors +
        '</div>' +
        '<div class="mv-factor-col">' +
          '<div class="mv-factor-col-title neg">부정 합계 ' + neg + '</div>' +
          negFactors +
        '</div>' +
      '</div>' +

    '</div>'
  );
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

loadData();
</script>

</body>
</html>
