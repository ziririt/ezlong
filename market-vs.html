.mv-factors {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border-top: 1px solid var(--ez-border2);
}

.mv-factor-col { padding: 12px 14px; }
.mv-factor-col.left { border-right: 1px solid var(--ez-border2); }

.mv-factor-col-title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.1px;
  margin-bottom: 10px;
}
.mv-factor-col-title.pos { color: #1D7A3E; }
.mv-factor-col-title.neg { color: #C0392B; }

.mv-factor-item { margin-bottom: 10px; }
.mv-factor-item:last-child { margin-bottom: 0; }

.mv-factor-score {
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.5px;
}
.mv-factor-score.pos { color: #1D7A3E; }
.mv-factor-score.neg { color: #C0392B; }

.mv-factor-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--ez-text);
  line-height: 1.3;
  margin-top: 1px;
}

.mv-factor-desc {
  font-size: 16px;
  font-weight: 500;
  color: var(--ez-text2);
  line-height: 1.35;
  margin-top: 1px;
}

.mv-factor-divider {
  height: 1px;
  background: var(--ez-border2);
  margin: 7px 0;
}

/* ── 혼조·양면 재료 (2026-07-03 신설, 같은 날 요인 2열 위로 이동) ── */
.mv-mixed {
  border-top: 1px solid var(--ez-border2);
  padding: 12px 14px;
  /* border-bottom 없음 — 바로 아래 .mv-factors의 border-top이 구분선 역할 (이중선 방지) */
}

.mv-mixed-title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.1px;
  margin-bottom: 10px;
  color: #92400E; /* 라이트모드 앰버 규칙 준수 — 노랑 금지 */
}

.mv-mixed-item { margin-bottom: 10px; }
.mv-mixed-item:last-child { margin-bottom: 0; }

.mv-mixed-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--ez-text);
  line-height: 1.3;
}

.mv-mixed-desc {
  font-size: 16px;
  font-weight: 500;
  color: var(--ez-text2);
  line-height: 1.35;
  margin-top: 1px;
}

@media (prefers-color-scheme: dark) {
  .mv-mixed-title { color: #FFD60A; }
}

/* ── 로딩/에러 상태 ── */
.mv-loading, .mv-error {
  text-align: center;
  padding: 60px 20px;
  color: var(--ez-text3);
  font-size: 16px;
}

.mv-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--ez-text3);
  font-size: 16px;
  line-height: 1.6;
}

/* ── 하단 안내 ── */
.mv-footer-note {
  text-align: center;
  font-size: 16px;
  color: var(--ez-text3);
  padding: 16px 20px 0;
  line-height: 1.6;
}

/* ── 라이트모드 — 과거 타임스탬프 색 ── */
@media (prefers-color-scheme: light) {
  .mv-ts { background: #5A5A5E; }
  .mv-ts-latest { background: #1D7A3E; }
  .mv-card-past { background: #F2F2F7; }
  .mv-connector-line { background: #C8C8CA; }
  .mv-connector-arrow { border-bottom-color: #C8C8CA; }
}

/* ── 다크모드 ── */
@media (prefers-color-scheme: dark) {
  .mv-ts { background: #2C2C2E; }
  .mv-ts-latest { background: #0D4A22; }
  .mv-card-past { background: #1C1C1E; }
}
</style>
<script src="/ez-app-banner.js"></script><!-- 앱 설치 배너 · 앱 웹뷰에서는 뜨지 않는다 (71항).
     head 맨 끝에 둔다 — 페이지가 이미 선언한 apple-itunes-app 을 보고 판단하므로
     그 메타보다 뒤에서 실행돼야 한다. -->
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0">미국 주식 시장 긍정 vs 부정 몇대몇 — AI 시황 분석</h1><!-- 화면 낭독기·검색엔진용 페이지 제목 (2026-08-26 SEO 점검: h1 부재 보강) -->
<script src="/lang-banner.js"></script>

<script src="/ez-nav.js"></script>

<div class="mv-page">

  <div class="mv-header">
    <div class="mv-header-main">
      <span class="mv-header-pos">긍정</span>
      <span class="mv-header-vs">VS</span>
      <span class="mv-header-neg">부정</span>
      <span class="mv-header-super">몇대몇</span>
    </div>
    <div class="mv-header-sub">최근 6시간 + 향후 12시간 기준 · 수시 업데이트</div>
  </div>

  <div class="mv-updated-bar" id="mv-updated-at">데이터 로딩 중...</div>

  <div class="mv-stack" id="mv-stack">
    <div class="mv-loading">분석 데이터 불러오는 중...</div>
  </div>

  <div class="mv-footer-note">
    AI 자동 분석 · 개인 참고용 · 투자 판단은 본인 책임
  </div>

</div>

<script src="/ez-footer.js"></script>

<script>
var DATA_URL = '/data/market-scorecard-data.json';
var MAX_SHOW = 10;

function loadData() {
  document.getElementById('mv-updated-at').textContent = '데이터 로딩 중...';

  fetch(DATA_URL + '?t=' + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      renderStack(data);
    })
    .catch(function(e) {
      document.getElementById('mv-stack').innerHTML =
        '<div class="mv-error">데이터를 불러오지 못했습니다.<br>' + e.message + '</div>';
      document.getElementById('mv-updated-at').textContent = '불러오기 실패';
    });
}

function renderStack(data) {
  var entries = data.entries || [];
  var maxEntries = data.max_entries || MAX_SHOW;

  // 최신순 정렬 (id 내림차순)
  entries = entries.slice().sort(function(a, b) {
    return (b.id || '').localeCompare(a.id || '');
  });

  // 최대 10개
  entries = entries.slice(0, maxEntries);

  // updated_at 표시
  var updatedEl = document.getElementById('mv-updated-at');
  if (data.updated_at) {
    var d = new Date(data.updated_at);
    var kst = new Date(d.getTime() + 9 * 3600 * 1000);
    var mm = kst.getUTCMonth() + 1;
    var dd = kst.getUTCDate();
    var hh = String(kst.getUTCHours()).padStart(2, '0');
    var mi = String(kst.getUTCMinutes()).padStart(2, '0');
    updatedEl.textContent = '최종 업데이트: ' + mm + '/' + dd + ' ' + hh + ':' + mi + ' KST · 총 ' + entries.length + '개';
  }

  var stack = document.getElementById('mv-stack');

  if (!entries.length) {
    stack.innerHTML = '<div class="mv-empty">아직 분석 데이터가 없습니다.<br>매일 5회 자동 업데이트됩니다.</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < entries.length; i++) {
    html += '<div class="mv-entry">' + renderEntry(entries[i], i === 0) + '</div>';
    if (i < entries.length - 1) {
      html +=
        '<div class="mv-connector">' +
          '<div class="mv-connector-arrow"></div>' +
          '<div class="mv-connector-line"></div>' +
        '</div>';
    }
  }
  stack.innerHTML = html;
}

function renderEntry(e, isLatest) {
  var pos = e.positive_total || 0;
  var neg = e.negative_total || 0;
  var kev = e.key_event || {};

  // 긍정 요인
  var posFactors = '';
  var pf = e.positive_factors || [];
  for (var i = 0; i < pf.length; i++) {
    if (i > 0) posFactors += '<div class="mv-factor-divider"></div>';
    posFactors +=
      '<div class="mv-factor-item">' +
        '<div class="mv-factor-score pos">' + pf[i].score + '</div>' +
        '<div class="mv-factor-name">' + escHtml(pf[i].name) + '</div>' +
        '<div class="mv-factor-desc">' + escHtml(pf[i].desc) + '</div>' +
      '</div>';
  }

  // 부정 요인
  var negFactors = '';
  var nf = e.negative_factors || [];
  for (var j = 0; j < nf.length; j++) {
    if (j > 0) negFactors += '<div class="mv-factor-divider"></div>';
    negFactors +=
      '<div class="mv-factor-item">' +
        '<div class="mv-factor-score neg">' + nf[j].score + '</div>' +
        '<div class="mv-factor-name">' + escHtml(nf[j].name) + '</div>' +
        '<div class="mv-factor-desc">' + escHtml(nf[j].desc) + '</div>' +
      '</div>';
  }

  // 혼조·양면 재료 (2026-07-03 신설) — 없으면 섹션 자체를 렌더링하지 않음
  var mixedHtml = '';
  var mf = e.mixed_factors || [];
  if (mf.length) {
    var mixedItems = '';
    for (var k = 0; k < mf.length; k++) {
      if (k > 0) mixedItems += '<div class="mv-factor-divider"></div>';
      mixedItems +=
        '<div class="mv-mixed-item">' +
          '<div class="mv-mixed-name">' + escHtml(mf[k].name) + '</div>' +
          '<div class="mv-mixed-desc">' + escHtml(mf[k].desc) + '</div>' +
        '</div>';
    }
    mixedHtml =
      '<div class="mv-mixed">' +
        '<div class="mv-mixed-title">혼조 · 해석 엇갈림</div>' +
        mixedItems +
      '</div>';
  }

  var latestClass = isLatest ? ' mv-ts-latest' : '';
  var latestBadge = isLatest
    ? ' &nbsp;<span style="font-size:16px;font-weight:700;background:rgba(255,255,255,0.25);padding:2px 8px;border-radius:20px;">최신</span>'
    : ' &nbsp;<span style="font-size:16px;font-weight:500;color:rgba(255,255,255,0.45);">이전 분석</span>';
  var cardClass = isLatest ? 'mv-card' : 'mv-card mv-card-past';

  return (
    '<div class="' + cardClass + '">' +

      /* 타임스탬프 — 크게 강조 */
      '<div class="mv-ts' + latestClass + '">' +
        '<div class="mv-ts-icon"></div>' +
        '<div class="mv-ts-text">' + escHtml(e.timestamp_kst || '') + latestBadge + '</div>' +
      '</div>' +

      /* 핵심 이벤트 */
      '<div class="mv-event">' +
        '<div class="mv-event-label">향후 핵심 이슈<span class="mv-event-label-time">(최근 6시간, 향후 12시간 감안)</span></div>' +
        '<div class="mv-event-name">' + escHtml(kev.name || '-') + '</div>' +
        '<div class="mv-event-why">' + escHtml(kev.why || '') + '</div>' +
      '</div>' +

      /* 점수 구도 */
      '<div class="mv-score-section">' +
        '<div class="mv-score-row">' +
          '<div class="mv-score-side left">' +
            '<div class="mv-score-label pos">긍정</div>' +
            '<div class="mv-score-num pos">' + pos + '</div>' +
          '</div>' +
          '<div class="mv-score-vs">VS</div>' +
          '<div class="mv-score-side right">' +
            '<div class="mv-score-label neg">부정</div>' +
            '<div class="mv-score-num neg">' + neg + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="mv-bar">' +
          '<div class="mv-bar-pos" style="width:' + pos + '%">' + pos + '</div>' +
          '<div class="mv-bar-neg" style="width:' + neg + '%">' + neg + '</div>' +
        '</div>' +
        '<div class="mv-summary">' + escHtml(e.summary || '') + '</div>' +
      '</div>' +

      /* 혼조·양면 재료 (있을 때만) — 점수 구도 바로 아래, 요인 2열 위 (2026-07-03 상단 이동) */
      mixedHtml +

      /* 2열 요인 */
      '<div class="mv-factors">' +
        '<div class="mv-factor-col left">' +
          '<div class="mv-factor-col-title pos">긍정 합계 ' + pos + '</div>' +
          posFactors +
        '</div>' +
        '<div class="mv-factor-col">' +
          '<div class="mv-factor-col-title neg">부정 합계 ' + neg + '</div>' +
          negFactors +
        '</div>' +
      '</div>' +

      /* 심층 보고서 (66항) — report 필드가 있을 때만 */
      renderReport(e) +

    '</div>'
  );
}

/* 카드 요약이 너무 압축돼 "무슨 말인지 모르겠다" 싶을 때 펼쳐 보는 A4 한 장.
   report 필드는 파이프라인이 카드 확정 후 별도 생성한다 — 없으면 버튼도 없다. */
var REPORT_SECTIONS = [
  ['overview', '현재 판 정리', 'plain'],
  ['positive', '호재', ''],
  ['negative', '악재', 'neg'],
  ['mixed', '혼조 · 경계', 'plain'],
  ['watch', '앞으로 12시간 체크포인트', 'plain']
];

function renderReport(e) {
  var r = e.report;
  if (!r) return '';
  var body = '';
  for (var i = 0; i < REPORT_SECTIONS.length; i++) {
    var key = REPORT_SECTIONS[i][0], title = REPORT_SECTIONS[i][1], cls = REPORT_SECTIONS[i][2];
    var txt = (r[key] || '').trim();
    if (!txt) continue;
    var lines = txt.split(/\n+/);
    var isBullets = lines.length > 0 && lines.every(function (t) {
      return /^\s*[-\u00b7\u2022]\s*/.test(t);
    });
    var inner;
    if (isBullets) {
      /* 개조식(67항 이후 표준) — "핵심어: 내용" 꼴이면 핵심어를 볼드로 */
      inner = '<ul>' + lines.map(function (t) {
        var c = t.replace(/^\s*[-\u00b7\u2022]\s*/, '');
        var ci = c.indexOf(':');
        if (ci > 0 && ci <= 24) {
          return '<li><b>' + escHtml(c.slice(0, ci)) + '</b>:' + escHtml(c.slice(ci + 1)) + '</li>';
        }
        return '<li>' + escHtml(c) + '</li>';
      }).join('') + '</ul>';
    } else {
      /* 구형 서술형 보고서 호환 */
      inner = lines.map(function (t) { return '<p>' + escHtml(t) + '</p>'; }).join('');
    }
    body += '<div class="mv-report-h' + (cls ? ' ' + cls : '') + '">' + title + '</div>' + inner;
  }
  if (!body) return '';
  var rid = 'rp-' + (e.id || Math.abs((e.timestamp_kst || '').length)) ;

  /* 복사용 평문 — 다른 곳에 붙여도 안 깨지게 제목+본문 평문으로 (48항: 표 금지 원칙과 동일) */
  var plain = '[긍정 ' + (e.positive_total || 0) + ' vs 부정 ' + (e.negative_total || 0) + '] ' +
              (e.timestamp_kst || '') + ' · ezlong.com 긍정vs부정\n\n';
  for (var q = 0; q < REPORT_SECTIONS.length; q++) {
    var k2 = REPORT_SECTIONS[q][0], t2 = REPORT_SECTIONS[q][1];
    var v2 = (r[k2] || '').trim();
    if (v2) plain += '■ ' + t2 + '\n' + v2 + '\n\n';
  }
  window._mvReports = window._mvReports || {};
  window._mvReports[rid] = plain.trim();

  return (
    '<button type="button" class="mv-report-toggle" aria-expanded="false"' +
      ' onclick="toggleReport(this, \'' + rid + '\')">' +
      '<span class="arrow">&#9656;</span>보고서 형식으로 보기</button>' +
    '<div class="mv-report" id="' + escHtml(rid) + '">' + body +
      '<div class="mv-report-meta">' +
        '<button type="button" class="mv-report-copy" onclick="copyReport(this, \'' + rid + '\')">복사</button>' +
        (e.report_at ? '<span>보고서 작성 ' + escHtml(e.report_at) + '</span>' : '') +
      '</div>' +
    '</div>'
  );
}

/* 보고서 평문 복사. 클립보드 API가 막힌 환경(일부 웹뷰)은 textarea 폴백. */
function copyReport(btn, rid) {
  var txt = (window._mvReports || {})[rid] || '';
  if (!txt) return;
  function ok() {
    btn.classList.add('done');
    btn.textContent = '복사됨';
    setTimeout(function () { btn.classList.remove('done'); btn.textContent = '복사'; }, 1800);
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); ok(); } catch (err) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(ok, fallback);
  } else {
    fallback();
  }
}

function toggleReport(btn, rid) {
  var el = document.getElementById(rid);
  if (!el) return;
  var open = !el.classList.contains('open');
  el.classList.toggle('open', open);
  btn.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.childNodes[1].nodeValue = open ? '보고서 접기' : '보고서 형식으로 보기';
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

loadData();
</script>
