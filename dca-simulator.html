/* ═══════════════════════════════════════════
   CORE ALGORITHM — 제미나이 이관, 원형 유지
   순서: 투자 투입 → 인출 → 복리 적용 (월 단위)
═══════════════════════════════════════════ */
function sN(v, fb=0){ const n=Number(v); return isNaN(n)||!isFinite(n)?fb:n; }

function calcDCA(startUSD, monthlyUSD, annualRate, accumYears, totalYears, exRate, ret){
  const mr=sN(annualRate)/100/12, ex=sN(exRate,1430);
  let val=sN(startUSD), inv=sN(startUSD), prev=sN(startUSD), first=0, nextX=2, wdAcc=0;
  const rows=[];
  for(let m=1;m<=sN(totalYears)*12;m++){
    const yr=m/12;
    const mInv=yr<=sN(accumYears)?sN(monthlyUSD):0;
    const mWd=ret?.isEnabled&&yr>sN(ret.year)?Math.min(val+mInv,sN(ret.withdrawalUSD)):0;
    wdAcc+=mWd;
    val=(val+mInv-mWd)*(1+mr);
    inv+=mInv;
    if(m%12===0){
      const year=m/12;
      const tv=Math.max(0,Math.round(sN(val)*ex));
      const ti=Math.round(sN(inv)*ex);
      const ii=Math.round(sN(startUSD)*ex);
      const di=Math.round(sN(inv-startUSD)*ex);
      const pr=Math.max(0,tv-ti);
      const yw=Math.round(sN(wdAcc)*ex);
      const mw=Math.round(sN(wdAcc/12)*ex);
      const dUSD=sN(val)-prev;
      const base=prev>0?prev:(sN(inv)>0?sN(inv):1);
      const gPct=base>0?(dUSD/base)*100:0;
      if(year===1)first=sN(val);
      let dp; if(year>1&&first>0&&sN(val)>=first*nextX){dp=nextX;nextX*=2;}
      rows.push({year,totalValue:tv,totalInvested:ti,initialInvested:ii,
        dcaInvested:di,profit:pr,yearlyIncrease:Math.round(dUSD*ex),
        yearlyGrowthRate:sN(gPct),doublePoint:dp,yearlyWithdrawal:yw,monthlyWithdrawal:mw});
      prev=sN(val);wdAcc=0;
    }
  }
  return rows;
}

  const n=Number(v); if(isNaN(n)||!isFinite(n)||n===0)return '0원';

  return `${s}${Math.floor(a/1e4).toLocaleString()}만원`;
}

/* ═══════════════════════════════════════════
   SVG BAR CHART — 순수 SVG, 외부 라이브러리 불필요
═══════════════════════════════════════════ */
function SVGBarChart({data, isCmp}){
  const wrapRef=useRef(null);
  const [W,setW]=useState(0);
  const [tip,setTip]=useState(null);
  const [mxy,setMxy]=useState({x:0,y:0});

  useEffect(()=>{
    const el=wrapRef.current; if(!el)return;
    const obs=new ResizeObserver(([e])=>setW(e.contentRect.width||e.target.offsetWidth));
    obs.observe(el);
    // 즉시 읽기 — ResizeObserver 콜백 전에 한 번 더 확인
    const initial=el.getBoundingClientRect().width||el.offsetWidth||el.clientWidth;
    if(initial>0)setW(initial);
    return ()=>obs.disconnect();
  },[]);

  const H=W<500?390:720, mg=W<500?{t:36,r:8,b:34,l:52}:{t:55,r:18,b:40,l:68};
  const cW=W-mg.l-mg.r, cH=H-mg.t-mg.b;
  const n=data.length;
  const maxV=Math.max(...data.map(d=>Math.max(d.totalValue||0,isCmp?(d.totalValue2||0):0)),1);

  // nice Y ticks
  const rawStep=maxV/5;
  const mag=Math.pow(10,Math.floor(Math.log10(rawStep)));
  const niceStep=Math.ceil(rawStep/mag)*mag;
  const niceMax=Math.ceil(maxV/niceStep)*niceStep;
  const ticks=[]; for(let i=0;i<=5;i++) ticks.push(niceStep*i);

  const yPx=v=>cH-(v/niceMax)*cH;
  const hPx=v=>(v/niceMax)*cH;

  // bar sizing
  const grpW=cW/n;
  const bW=isCmp?Math.max(3,grpW*0.35):Math.max(4,grpW*0.65);
  const gap=isCmp?Math.max(1,grpW*0.04):0;

  // label skip — show every N-th
  const skip=Math.ceil(n/25);

  const fTick=v=>v>=1e8?`${(v/1e8).toFixed(0)}억`:v>=1e4?`${(v/1e4).toFixed(0)}만`:'0';
  const fLbl=v=>v>=1e8?`${(v/1e8).toFixed(1)}억`:v>=1e4?`${Math.floor(v/1e4)}만`:'';

  const onMove=e=>{
    const r=wrapRef.current.getBoundingClientRect();
    setMxy({x:e.clientX-r.left,y:e.clientY-r.top});
  };

  // W가 결정되기 전에는 빈 컨테이너만 표시 — 모바일 가로 overflow 방지
  if(!W) return <div ref={wrapRef} style={{width:'100%',height:300,background:'var(--inp-bg2)',borderRadius:8}}/>;

  return (
    <div ref={wrapRef} style={{position:'relative',width:'100%',height:H,touchAction:'none',overflow:'hidden'}} onMouseMove={onMove} onMouseLeave={()=>setTip(null)}>
      <svg width={W} height={H} style={{display:'block',maxWidth:'100%'}}>
        <g transform={`translate(${mg.l},${mg.t})`}>
          {/* Grid + Y axis labels */}
          {ticks.map((t,i)=>(
            <g key={i}>
              <line x1={0} y1={yPx(t)} x2={cW} y2={yPx(t)} stroke="var(--chart-grid)" strokeWidth={1}/>
              <text x={-8} y={yPx(t)+4} textAnchor="end" fontSize={11} fill="var(--t3)" fontFamily="var(--mono)">{fTick(t)}</text>
            </g>
          ))}

          {/* Bars */}
          {data.map((d,i)=>{
            const grpX=i*grpW;
            const totalGrpW=isCmp?bW*2+gap:bW;
            const x1=grpX+(grpW-totalGrpW)/2;
            const x2=x1+bW+gap;

            const h1i=hPx(d.initialInvested||0), h1d=hPx(d.dcaInvested||0), h1p=hPx(d.profit||0);
            const tot1=h1i+h1d+h1p;
            const h2i=hPx(d.initialInvested2||0), h2d=hPx(d.dcaInvested2||0), h2p=hPx(d.profit2||0);
            const tot2=h2i+h2d+h2p;

            const showXLbl=i%skip===0||i===n-1;
            const showLbl1=i%skip===0||i===n-1;
            const showLbl2=i%skip===0||i===n-1;

            return (
              <g key={d.year} style={{cursor:'default'}}
                onMouseEnter={()=>setTip(d)}
                onMouseLeave={()=>setTip(null)}>

                {/* Sim 1 stacked bar */}
                {h1i>0&&<rect x={x1} y={cH-h1i} width={bW} height={h1i} fill="#FF6B6B"/>}
                {h1d>0&&<rect x={x1} y={cH-h1i-h1d} width={bW} height={h1d} fill="#FFB347"/>}
                {h1p>0&&<rect x={x1} y={cH-tot1} width={bW} height={h1p} fill="#34C759" rx={2} ry={2}/>}

                {/* Sim 1 top label */}
                {showLbl1&&d.totalValue>0&&tot1>10&&(
                  <text x={x1+bW/2} y={cH-tot1-6}
                    textAnchor="end" dominantBaseline="middle"
                    transform={`rotate(90,${x1+bW/2},${cH-tot1-6})`}
                    fontSize={10} fontWeight={700} fill="var(--t1)" fontFamily="var(--mono)">
                    {fLbl(d.totalValue)}
                  </text>
                )}

                {/* Sim 2 stacked bar */}
                {isCmp&&<>
                  {h2i>0&&<rect x={x2} y={cH-h2i} width={bW} height={h2i} fill="#93C5FD"/>}
                  {h2d>0&&<rect x={x2} y={cH-h2i-h2d} width={bW} height={h2d} fill="#60A5FA"/>}
                  {h2p>0&&<rect x={x2} y={cH-tot2} width={bW} height={h2p} fill="#007AFF" rx={2} ry={2}/>}
                  {showLbl2&&(d.totalValue2||0)>0&&tot2>10&&(
                    <text x={x2+bW/2} y={cH-tot2-6}
                      textAnchor="end" dominantBaseline="middle"
                      transform={`rotate(90,${x2+bW/2},${cH-tot2-6})`}
                      fontSize={10} fontWeight={700} fill="var(--t1)" fontFamily="var(--mono)">
                      {fLbl(d.totalValue2||0)}
                    </text>
                  )}
                </>}

                {/* X axis label */}
                {showXLbl&&(
                  <text x={grpX+grpW/2} y={cH+16} textAnchor="middle" fontSize={11} fill="var(--t3)">{d.year}</text>
                )}
              </g>
            );
          })}

          {/* X axis base */}
          <line x1={0} y1={cH} x2={cW} y2={cH} stroke="var(--chart-xax)" strokeWidth={1}/>
          <text x={cW/2} y={cH+32} textAnchor="middle" fontSize={12} fill="#AEAEB2">경과 년수</text>
        </g>
      </svg>

      {/* Tooltip */}
      {tip&&(
        <div style={{
          position:'absolute',
          left:Math.min(mxy.x+14,W-260),
          top:Math.max(mxy.y-120,8),
          pointerEvents:'none',zIndex:20
        }}>
          <ChartTooltip d={tip} isCmp={isCmp}/>
        </div>
      )}
    </div>
  );
}

const EX_RATE = 1380; // 원/달러 환율 (2026년 5월 기준 참고치 — 설정 불필요)

function App(){
  // Sim 1
  const [ticker,setTicker]=useState('QQQ');

  const [isCmp,setIsCmp]=useState(false);
  const [ticker2,setTicker2]=useState('SPY');
  const [mm2,setMm2]=useState(100);
  const [yrs2,setYrs2]=useState(10);
  const [init2,setInit2]=useState(0);
  const [isRet2,setIsRet2]=useState(false);
  const [wd2,setWd2]=useState(200);
  // Common
  // Results
  const [results,setResults]=useState([]);
  const [r1,setR1]=useState(null);
  const [r2,setR2]=useState(null);
  const [loading,setLoading]=useState(false);
  // UI
  const [showD1,setShowD1]=useState(false);
  const [showD2,setShowD2]=useState(false);
  const [verTxt,setVerTxt]=useState('');
  const [showVer,setShowVer]=useState(false);
  const resRef=useRef(null);
  const autoCalcRef=useRef(null);

  // 빠른 조절 슬라이더 변경 시 자동 재계산 (300ms 디바운스)
  useEffect(()=>{
    if(!results.length)return;
    clearTimeout(autoCalcRef.current);
    autoCalcRef.current=setTimeout(()=>{
      const a1=CAGR[ticker.toUpperCase()]||10;
      const a2=isCmp?CAGR[ticker2.toUpperCase()]||10:0;
      setR1(a1);setR2(a2);
      const ex=EX_RATE;
      const maxY=isCmp?Math.max(yrs,yrs2):yrs;
      const totY=maxY+30;
      const s1=calcDCA((init*1e4)/ex,(mm*1e4)/ex,a1,yrs,totY,ex,
        {isEnabled:isRet,year:yrs,withdrawalUSD:(wd*1e4)/ex});
      let merged=s1;
      if(isCmp){
        const s2=calcDCA((init2*1e4)/ex,(mm2*1e4)/ex,a2,yrs2,totY,ex,
          {isEnabled:isRet2,year:yrs2,withdrawalUSD:(wd2*1e4)/ex});
        merged=s1.map((row,i)=>({...row,
          totalValue2:sN(s2[i]?.totalValue),totalInvested2:sN(s2[i]?.totalInvested),
          initialInvested2:sN(s2[i]?.initialInvested),dcaInvested2:sN(s2[i]?.dcaInvested),
          profit2:sN(s2[i]?.profit),yearlyIncrease2:sN(s2[i]?.yearlyIncrease),
          yearlyGrowthRate2:sN(s2[i]?.yearlyGrowthRate),doublePoint2:s2[i]?.doublePoint,
          yearlyWithdrawal2:sN(s2[i]?.yearlyWithdrawal),monthlyWithdrawal2:sN(s2[i]?.monthlyWithdrawal),
        }));
      }
      setResults(merged);
    },300);
    return ()=>clearTimeout(autoCalcRef.current);
  },[mm,init,wd,mm2,init2,wd2]);

  const maxYrs=isCmp?Math.max(yrs,yrs2):yrs;
  const totYrs=maxYrs+30;
  const chartData=results.slice(0,maxYrs);
  const finalRow=results.length>0?results[Math.min(results.length-1,maxYrs-1)]:null;
  const lastRow=results.length>0?results[results.length-1]:null;

  const handleSim=useCallback((e)=>{
    if(e)e.preventDefault(); if(loading)return;
    setLoading(true);setResults([]);setShowVer(false);
    setTimeout(()=>{
      const a1=CAGR[ticker.toUpperCase()]||10;
      const a2=isCmp?CAGR[ticker2.toUpperCase()]||10:0;
      setR1(a1);setR2(a2);
      const ex=EX_RATE;
      const s1=calcDCA((init*1e4)/ex,(mm*1e4)/ex,a1,yrs,totYrs,ex,
        {isEnabled:isRet,year:yrs,withdrawalUSD:(wd*1e4)/ex});
      let merged=s1;
      if(isCmp){
        const s2=calcDCA((init2*1e4)/ex,(mm2*1e4)/ex,a2,yrs2,totYrs,ex,
          {isEnabled:isRet2,year:yrs2,withdrawalUSD:(wd2*1e4)/ex});
        merged=s1.map((row,i)=>({...row,
          totalValue2:sN(s2[i]?.totalValue),totalInvested2:sN(s2[i]?.totalInvested),
          initialInvested2:sN(s2[i]?.initialInvested),dcaInvested2:sN(s2[i]?.dcaInvested),
          profit2:sN(s2[i]?.profit),yearlyIncrease2:sN(s2[i]?.yearlyIncrease),
          yearlyGrowthRate2:sN(s2[i]?.yearlyGrowthRate),doublePoint2:s2[i]?.doublePoint,
          yearlyWithdrawal2:sN(s2[i]?.yearlyWithdrawal),monthlyWithdrawal2:sN(s2[i]?.monthlyWithdrawal),
        }));
      }
      setResults(merged);setLoading(false);
      setTimeout(()=>resRef.current?.scrollIntoView({behavior:'smooth',block:'start'}),80);
    },550);
  },[loading,ticker,ticker2,mm,mm2,yrs,yrs2,init,init2,isRet,isRet2,wd,wd2,isCmp,totYrs]);

  const handleCSV=()=>{
    if(!results.length)return;
    let c='﻿경과년수,평가액1,원금1,수익금1,인출액1';
    if(isCmp)c+=',평가액2,원금2,수익금2,인출액2';
    c+='\n';
    results.forEach(r=>{
      c+=`${r.year},${r.totalValue},${r.totalInvested},${r.profit},${r.yearlyWithdrawal||0}`;
      if(isCmp)c+=`,${r.totalValue2||0},${r.totalInvested2||0},${r.profit2||0},${r.yearlyWithdrawal2||0}`;
      c+='\n';
    });
    const a=document.createElement('a');
    a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(c);
    a.download=`DCA_${ticker}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };

  const handleVerify=()=>{
    if(!finalRow||!r1)return;
    const mult=(finalRow.totalValue/(finalRow.totalInvested||1)).toFixed(1);
    setVerTxt([
      `수학적 검증 결과`,``,
      `${yrs}년간 매월 ${mm}만원을 ${ticker}(연 ${r1}%)에 투자한 시뮬레이션입니다.`,``,
      `핵심 수치`,
      `· 월 적용 수익률: ${(r1/12).toFixed(3)}% (연 ${r1}% ÷ 12)`,
      `· 총 투자 원금: ${fKRW(finalRow.totalInvested)}`,
      `· 최종 평가액: ${fKRW(finalRow.totalValue)}`,
      `· 원금 대비: ${mult}배`,``,
      `왜 이렇게 커지나요?`,
      `복리는 "이자에 이자가 붙는" 구조입니다. 초기엔 천천히, 후반으로 갈수록 기하급수적으로 불어납니다. 특히 투자 후반 10년이 전체 수익의 60~70%를 만들어냅니다.`,
      ...(isRet&&finalRow.yearlyWithdrawal>0
        ?[``,`은퇴 인출 분석`,`매월 ${wd}만원을 인출해도, 남은 자산의 복리 수익이 인출액보다 크면 원금은 계속 불어납니다. 수학적으로 완전히 정상적인 현상입니다.`]
        :[]),
      ``,`*과거 수익률은 미래를 보장하지 않으며, 실제 투자에는 세금·수수료·환율 변동이 적용됩니다.*`
    ].join('\n'));
    setShowVer(true);
  };

  const mkdn=(txt)=>txt.split('\n').map((line,i)=>{
    if(!line)return <div key={i} style={{height:4}}/>;
    if(line.startsWith('*')&&line.endsWith('*'))return <div key={i} style={{fontStyle:'italic',color:'var(--t3)',fontSize:12,marginTop:10}}>{line.slice(1,-1)}</div>;
    if(line.startsWith('·'))return <div key={i} style={{paddingLeft:12,lineHeight:1.65,color:'var(--t2)',marginTop:2}}>{line}</div>;
    const isBold=i===0||['핵심 수치','왜 이렇게 커지나요?','은퇴 인출 분석'].includes(line);
    return <div key={i} style={{lineHeight:1.65,marginTop:isBold?6:2,fontWeight:isBold?700:400}}>{line}</div>;
  });

  /* ── RENDER ── */
  return (
    <div style={{minHeight:'100vh',background:'var(--bg)',fontFamily:'var(--font)'}}>

      {/* HEADER */}
      <header style={{background:'var(--hdr-bg)',backdropFilter:'blur(20px)',
        WebkitBackdropFilter:'blur(20px)',borderBottom:'1px solid var(--bd)',
        position:'sticky',top:48,zIndex:100}}>
        <div className="r-hdr" style={{maxWidth:1180,margin:'0 auto',padding:'0 24px',height:54,
          display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:32,height:32,borderRadius:9,background:'linear-gradient(135deg,var(--bl),var(--bl-dk))',
              display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 2px 8px rgba(0,113,227,.35)'}}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
              </svg>
            </div>
            <div>
              <div style={{fontSize:15,fontWeight:800,letterSpacing:'-.02em'}}>DCA 복리 시뮬레이터</div>
              <a href="#dca-guide" onClick={e=>{e.preventDefault();document.getElementById('dca-guide').scrollIntoView({behavior:'smooth'});}}
                style={{fontSize:11,color:'var(--bl)',marginTop:2,display:'inline-flex',alignItems:'center',gap:3,textDecoration:'none',fontWeight:600,cursor:'pointer',letterSpacing:'-.01em'}}>
                DCA란 무엇? ↓
              </a>
            </div>
          </div>
          <span style={{fontSize:12,color:'var(--t3)',fontWeight:500}}>Compound Interest Calculator</span>
        </div>
      </header>

      {/* GRID */}
      <main className="r-layout" style={{maxWidth:1180,margin:'0 auto',padding:'28px 24px 80px',
        display:'grid',gridTemplateColumns:'370px 1fr',gap:24,alignItems:'start'}}>

        {/* ── LEFT PANEL */}
        <div className="r-sticky" style={{position:'sticky',top:114,display:'flex',flexDirection:'column',gap:16}}>
          <Card style={{padding:22}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
              <span style={{fontSize:15,fontWeight:700}}>투자 설정</span>
              <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',userSelect:'none'}}>
                <input type="checkbox" className="blue" checked={isCmp} onChange={e=>{const c=e.target.checked;if(c){setTicker2(ticker);setMm2(mm);setYrs2(yrs);setInit2(init);setIsRet2(isRet);setWd2(wd);}setIsCmp(c);}}/>
                <span style={{fontSize:12,fontWeight:600,color:'var(--t2)'}}>2개 비교</span>
              </label>
            </div>
            <form onSubmit={handleSim} style={{display:'flex',flexDirection:'column',gap:14}}>
              <SimInputSection simNum={1} isCmpMode={isCmp}
                ticker={ticker} setTicker={setTicker} monthlyMan={mm} setMonthlyMan={setMm}
                years={yrs} setYears={setYrs} initMan={init} setInitMan={setInit}
                isRet={isRet} setIsRet={setIsRet} wdMan={wd} setWdMan={setWd}/>
              {isCmp&&(
                <div className="fadeUp">
                  <SimInputSection simNum={2} isCmpMode={isCmp}
                    ticker={ticker2} setTicker={setTicker2} monthlyMan={mm2} setMonthlyMan={setMm2}
                    years={yrs2} setYears={setYrs2} initMan={init2} setInitMan={setInit2}
                    isRet={isRet2} setIsRet={setIsRet2} wdMan={wd2} setWdMan={setWd2}/>
                </div>
              )}
              <div style={{height:1,background:'var(--bd)'}}/>
              {/* CTA */}
              <Btn type="submit" disabled={loading} variant="primary" style={{width:'100%',padding:'13px',fontSize:15}}>
                {loading
                  ?<><svg className="spin" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>{' '}계산 중...</>
                  :<>시뮬레이션 시작{' '}<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></>
                }
              </Btn>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <Btn variant="ghost" disabled={!results.length} onClick={handleVerify} style={{fontSize:13,padding:'10px 14px'}}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 12l2 2 4-4"/><path d="M12 2l2 2h4l2 2v4l2 2v4l-2 2v4l-2 2h-4l-2 2-2-2H6l-2-2v-4l-2-2v-4l2-2V6l2-2h4z"/></svg>
                  검증하기
                </Btn>
                <Btn variant="outline" disabled={!results.length} onClick={handleCSV} style={{fontSize:13,padding:'10px 14px'}}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  CSV 저장
                </Btn>
              </div>
            </form>
          </Card>
          <div style={{fontSize:14,color:'var(--t2)',lineHeight:1.7,textAlign:'center',padding:'0 4px'}}>
            과거 수익률은 미래 수익을 보장하지 않습니다.<br/>투자 시 원금 손실의 위험이 있습니다.
          </div>
        </div>

        {/* ── RIGHT PANEL */}
        <div ref={resRef} style={{display:'flex',flexDirection:'column',gap:22}}>

          {/* LOADING */}
          {loading&&(
            <Card className="fadeUp r-cpad" style={{padding:'72px 40px',display:'flex',flexDirection:'column',
              alignItems:'center',justifyContent:'center',textAlign:'center',gap:22}}>
              <div style={{position:'relative',width:76,height:76}}>
                <div style={{position:'absolute',inset:0,borderRadius:'50%',border:'4px solid var(--gr-s)'}}/>
                <div style={{position:'absolute',inset:0,borderRadius:'50%',border:'4px solid var(--gr)',borderTopColor:'transparent',animation:'spin .85s linear infinite'}}/>
                <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--gr)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
                  </svg>
                </div>
              </div>
              <div>
                <div style={{fontSize:19,fontWeight:700,marginBottom:8}}>복리 마법을 계산하는 중...</div>
                <div style={{fontSize:13,color:'var(--t2)',lineHeight:1.65}}>월 단위 시뮬레이션으로 정밀하게 계산합니다</div>
              </div>
              <div style={{display:'flex',gap:8}}>
                {[0,1,2].map(i=><div key={i} className={`bob${i}`} style={{width:8,height:8,borderRadius:'50%',background:'var(--gr)'}}/>)}
              </div>
            </Card>
          )}

          {/* EMPTY */}
          {!loading&&!results.length&&(
            <Card className="r-cpad" style={{padding:'72px 40px',display:'flex',flexDirection:'column',
              alignItems:'center',justifyContent:'center',textAlign:'center',gap:18}}>
              <div style={{width:68,height:68,borderRadius:'50%',background:'var(--bg)',
                display:'flex',alignItems:'center',justifyContent:'center',border:'2px dashed var(--bd)'}}>
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
              </div>
              <div>
                <div style={{fontSize:17,fontWeight:700,marginBottom:8}}>시뮬레이션 결과가 여기에 표시됩니다</div>
                <div style={{fontSize:13,color:'var(--t2)',lineHeight:1.7}}>
                  좌측에서 티커와 투자 조건을 설정하고<br/><strong>시뮬레이션 시작</strong>을 눌러주세요
                </div>
              </div>
              <div style={{fontSize:12,color:'var(--t3)',padding:'10px 18px',background:'var(--bg)',borderRadius:9,border:'1px solid var(--bd)'}}>
                모든 계산은 USD 기준 수행 후 원화 변환
              </div>
            </Card>
          )}

          {/* RESULTS */}
          {!loading&&results.length>0&&(
            <div style={{display:'flex',flexDirection:'column',gap:22}} className="fadeUp">

              {/* ── SUMMARY */}
              {finalRow&&(
                <Card style={{padding:22}}>
                  <div className="r-sim-title" style={{fontSize:15,fontWeight:700,marginBottom:18,display:'flex',alignItems:'center',gap:8}}>
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--gr)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    시뮬레이션 요약{isCmp?' (비교)':''}
                  </div>

                  {/* 4 key metrics */}
                  <div className="r-2col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:18}}>
                    {[
                      [`투자 종료 시점 자산 (${maxYrs}년차)`,fKRW(finalRow.totalValue),fKRW(finalRow.totalValue2||0),true,true],
                      ['총 투자 원금',fKRW(finalRow.totalInvested),fKRW(finalRow.totalInvested2||0),false,false],
                      ['원금 대비 배수',`${f1(finalRow.totalValue/(finalRow.totalInvested||1),1)}배`,`${f1((finalRow.totalValue2||0)/((finalRow.totalInvested2||1)),1)}배`,false,false],
                      [`추가 30년 후 (${totYrs}년차)`,lastRow?fKRW(lastRow.totalValue):'-',lastRow?fKRW(lastRow.totalValue2||0):'-',false,false],
                    ].map(([lbl,v1,v2,hl,big])=>(
                      <div key={lbl} style={{background:hl?'var(--gr-s)':'var(--inp-bg2)',borderRadius:'var(--r-sm)',
                        padding:'13px 15px',border:hl?'1px solid var(--gr-m)':'1px solid var(--bd)'}}>
                        <div style={{fontSize:12,color:'var(--t2)',fontWeight:600,marginBottom:7}}>{lbl}</div>
                        <div style={{display:'flex',gap:14,flexWrap:'wrap',alignItems:'baseline'}}>
                          <span className={big?'r-big-val':''} style={{fontSize:big?20:15,fontWeight:800,color:'var(--gr-dk)',fontFamily:'var(--mono)',lineHeight:1.2}}>{v1}</span>
                          {isCmp&&<span className={big?'r-big-val':''} style={{fontSize:big?20:15,fontWeight:800,color:'var(--bl-dk)',fontFamily:'var(--mono)',lineHeight:1.2}}>{v2}</span>}
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Ticker info */}
                  <div className="r-2col" style={{display:'grid',gridTemplateColumns:isCmp?'1fr 1fr':'1fr',gap:12}}>
                    {[[ticker,r1,yrs,mm,'green'],
                      ...(isCmp?[[ticker2,r2,yrs2,mm2,'blue']]:[])
                    ].map(([tk,rt,yr,m,col],idx)=>(
                      <div key={idx} style={{padding:'11px 13px',borderRadius:'var(--r-sm)',
                        background:col==='blue'?'var(--bl-s)':'var(--gr-s)',
                        border:col==='blue'?'1px solid var(--bl-m)':'1px solid var(--gr-m)'}}>
                        <div style={{fontSize:11,color:'var(--t3)',marginBottom:4}}>시뮬레이션 {idx+1}</div>
                        <div style={{fontSize:17,fontWeight:800}}>{tk}</div>
                        <div style={{display:'flex',gap:7,marginTop:5,flexWrap:'wrap'}}>
                          <Badge color={col}>연 {rt}% CAGR</Badge>
                          <span style={{fontSize:11,color:'var(--t2)'}}>{yr}년 · 월 {m}만원</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Description toggles */}
                  {[[ticker,showD1,()=>setShowD1(v=>!v),'green'],
                    ...(isCmp?[[ticker2,showD2,()=>setShowD2(v=>!v),'blue']]:[])]
                    .filter(([tk])=>DESC[tk]).map(([tk,show,tog,col],i)=>(
                    <div key={i} style={{marginTop:12}}>
                      <button onClick={tog} style={{background:'none',border:'none',cursor:'pointer',
                        fontSize:12,color:col==='blue'?'var(--bl)':'var(--gr)',fontWeight:600,
                        display:'flex',alignItems:'center',gap:5,fontFamily:'var(--font)'}}>
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                          style={{transform:show?'rotate(180deg)':'none',transition:'transform .2s'}}>
                          <polyline points="6 9 12 15 18 9"/>
                        </svg>
                        {tk} 종목 설명 {show?'닫기':'보기'}
                      </button>
                      {show&&<div className="popIn" style={{marginTop:7,padding:'11px 13px',background:'var(--inp-bg2)',
                        borderRadius:'var(--r-sm)',fontSize:12,color:'var(--t2)',lineHeight:1.7,border:'1px solid var(--bd)'}}>
                        {DESC[tk]}
                      </div>}
                    </div>
                  ))}

                  {/* Verification */}
                  {showVer&&verTxt&&(
                    <div className="popIn" style={{marginTop:16,padding:16,background:'var(--bl-s)',borderRadius:12,border:'1px solid var(--bl-m)'}}>
                      <div style={{fontSize:12,fontWeight:700,color:'var(--bl)',marginBottom:10,display:'flex',alignItems:'center',gap:6}}>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 12l2 2 4-4"/><path d="M12 2l2 2h4l2 2v4l2 2v4l-2 2v4l-2 2h-4l-2 2-2-2H6l-2-2v-4l-2-2v-4l2-2V6l2-2h4z"/></svg>
                        수학적 검증 결과
                        <button onClick={()=>setShowVer(false)} style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'var(--t3)',fontSize:16,lineHeight:1}}>×</button>
                      </div>
                      <div style={{fontSize:13,color:'var(--t1)'}}>{mkdn(verTxt)}</div>
                    </div>
                  )}
                </Card>
              )}

              {/* ── CHART */}
              <Card style={{padding:22}}>
                <div className="r-card-hdr" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:18,flexWrap:'wrap',gap:10}}>
                  <div>
                    <div style={{fontSize:15,fontWeight:700}}>자산 성장 추이</div>
                    <div style={{fontSize:12,color:'var(--t3)',marginTop:2}}>투자 기간 {maxYrs}년 기준 · 인출기 제외</div>
                  </div>
                  <div className="r-chart-legend" style={{display:'flex',gap:14,fontSize:12,color:'var(--t2)',flexWrap:'wrap'}}>
                    {[['#FF6B6B','초기투자금'],['#FFB347','월DCA 누계'],['#34C759','복리 수익']].map(([c,l])=>(
                      <span key={l} style={{display:'flex',alignItems:'center',gap:5}}>
                        <span style={{width:9,height:9,borderRadius:3,background:c,display:'inline-block'}}/>{l}
                      </span>
                    ))}
                    {isCmp&&[['#93C5FD','초기(2)'],['#60A5FA','DCA(2)'],['#007AFF','수익(2)']].map(([c,l])=>(
                      <span key={l} style={{display:'flex',alignItems:'center',gap:5}}>
                        <span style={{width:9,height:9,borderRadius:3,background:c,display:'inline-block'}}/>{l}
                      </span>
                    ))}
                  </div>
                </div>
                <SVGBarChart data={chartData} isCmp={isCmp}/>
              </Card>

              {/* ── QUICK CONTROLS */}
              <Card style={{padding:22}}>
                <div style={{fontSize:14,fontWeight:700,marginBottom:18,display:'flex',alignItems:'center',gap:7}}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--gr)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M5.34 18.66l-1.41 1.41M22 12h-2M4 12H2M19.07 19.07l-1.41-1.41M5.34 5.34L3.93 3.93"/></svg>
                  빠른 조절 <span style={{fontSize:12,fontWeight:400,color:'var(--t3)'}}>— 슬라이더 조절 시 바로 반영</span>
                </div>
                <div className="r-3col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:22}}>
                  {[
                    ['투자 기간',yrs,v=>{setYrs(v);if(isCmp)setYrs2(v);},1,50,1,'blue',v=>`${v}년`,false],
                    ['월 DCA 금액',mm,v=>{setMm(v);if(isCmp)setMm2(v);},0,500,10,'green',v=>v===0?'없음':fKRW(v*1e4),false],
                    ['초기 투자금',init,v=>{setInit(v);if(isCmp)setInit2(v);},0,100000,500,'green',v=>v===0?'없음':fKRW(v*1e4),true],
                  ].map(([lbl,val,setter,min,max,step,col,fmt,full])=>(
                    <div key={lbl} style={full?{gridColumn:'1 / -1'}:{}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:9}}>
                        <span style={{fontSize:12,fontWeight:600,color:'var(--t2)'}}>{lbl}</span>
                        <span style={{fontSize:16,fontWeight:800,color:col==='blue'?'var(--bl)':'var(--gr)',fontFamily:'var(--mono)'}}>{fmt(val)}</span>
                      </div>
                      <input type="range" min={min} max={max} step={step}
                        value={val} onChange={e=>setter(Number(e.target.value))} className={col}/>
                    </div>
                  ))}
                </div>
              </Card>

              {/* ── DETAIL TABLE */}
              <Card style={{overflow:'hidden'}}>
                <div style={{padding:'18px 22px',borderBottom:'1px solid var(--bd)',
                  display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
                  <div>
                    <div style={{fontSize:15,fontWeight:700}}>연도별 상세 데이터</div>
                    <div style={{fontSize:12,color:'var(--t3)',marginTop:2}}>투자 기간 + 은퇴 후 30년 전체</div>
                  </div>
                  <div style={{fontSize:11,color:'#7D5900',padding:'5px 11px',borderRadius:7,background:'var(--yl-s)',border:'1px solid rgba(255,214,10,.3)'}}>
                    2배·4배 돌파 시점 확인
                  </div>
                </div>
                <div style={{overflowX:'auto'}}>
                  <table className="r-table" style={{fontSize:13}}>
                    <thead>
                      <tr style={{background:'var(--inp-bg2)'}}>
                        <th style={{padding:'11px 18px',fontWeight:700,whiteSpace:'nowrap',color:'var(--t2)'}}>경과 년수</th>
                        <th style={{padding:'11px 16px',fontWeight:700,whiteSpace:'nowrap',color:'var(--gr-dk)'}}>평가액 1 (전년대비)</th>
                        {isCmp&&<th style={{padding:'11px 16px',fontWeight:700,whiteSpace:'nowrap',color:'var(--bl-dk)'}}>평가액 2 (전년대비)</th>}
                        <th style={{padding:'11px 16px',fontWeight:700,whiteSpace:'nowrap',color:'var(--t2)',textAlign:'center'}}>수익률 1</th>
                        {isCmp&&<th style={{padding:'11px 16px',fontWeight:700,whiteSpace:'nowrap',color:'var(--t2)',textAlign:'center'}}>수익률 2</th>}
                        {(isRet||isRet2)&&<th style={{padding:'11px 18px',fontWeight:700,whiteSpace:'nowrap',color:'var(--rd)',textAlign:'right'}}>연간 인출액</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {results.map(row=>{
                        const isPost=row.year>maxYrs;
                        const isRetActive=isRet||isRet2;
                        const isRetRow=isPost&&isRetActive;
                        const isHL=row.doublePoint||row.doublePoint2;
                        return (
                          <tr key={row.year}
                            style={{background:isRetRow?'var(--row-ret)':isPost?'var(--row-post)':isHL?'var(--yl-s)':'var(--row-bg)',borderTop:'1px solid var(--bd)'}}
                            onMouseEnter={e=>e.currentTarget.style.background='var(--inp-bg)'}
                            onMouseLeave={e=>e.currentTarget.style.background=isRetRow?'var(--row-ret)':isPost?'var(--row-post)':isHL?'var(--yl-s)':'var(--row-bg)'}>
                            <td style={{padding:'11px 18px',whiteSpace:'nowrap'}}>
                              <div style={{display:'flex',alignItems:'center',flexWrap:'wrap',gap:6}}>
                                <span style={{fontWeight:700,fontFamily:'var(--mono)',fontSize:13}}>{row.year}년</span>
                                {isRetRow&&<Badge color="red">은퇴인출기</Badge>}
                                {row.doublePoint&&<Badge color="yellow">{row.doublePoint}배!</Badge>}
                                {isCmp&&row.doublePoint2&&!row.doublePoint&&<Badge color="blue">(2) {row.doublePoint2}배!</Badge>}
                              </div>
                            </td>
                            <td style={{padding:'11px 16px',whiteSpace:'nowrap'}}>
                              <div style={{fontWeight:800,color:'var(--gr-dk)',fontFamily:'var(--mono)',fontSize:14}}>{fKRW(row.totalValue)}</div>
                              <div style={{fontSize:11,color:row.yearlyIncrease>=0?'var(--gr)':'var(--rd)',marginTop:2,fontWeight:600}}>
                                {row.yearlyIncrease>0?'+':''}{fKRW(row.yearlyIncrease)} ({row.yearlyIncrease>0?'+':''}{f1(row.yearlyGrowthRate,1)}%)
                              </div>
                            </td>
                            {isCmp&&(
                              <td style={{padding:'11px 16px',whiteSpace:'nowrap'}}>
                                <div style={{fontWeight:800,color:'var(--bl-dk)',fontFamily:'var(--mono)',fontSize:14}}>{fKRW(row.totalValue2||0)}</div>
                                <div style={{fontSize:11,color:(row.yearlyIncrease2||0)>=0?'var(--bl)':'var(--rd)',marginTop:2,fontWeight:600}}>
                                  {(row.yearlyIncrease2||0)>0?'+':''}{fKRW(row.yearlyIncrease2||0)} ({(row.yearlyIncrease2||0)>0?'+':''}{f1(row.yearlyGrowthRate2||0,1)}%)
                                </div>
                              </td>
                            )}
                            <td style={{padding:'11px 16px',textAlign:'center',whiteSpace:'nowrap'}}>
                              <span style={{background:'var(--gr-s)',color:'var(--gr-dk)',border:'1px solid var(--gr-m)',fontSize:12,fontWeight:700,padding:'2px 8px',borderRadius:6,display:'inline-block'}}>
                                {f1(((row.profit||0)/(row.totalInvested||1))*100,1)}%
                              </span>
                            </td>
                            {isCmp&&(
                              <td style={{padding:'11px 16px',textAlign:'center',whiteSpace:'nowrap'}}>
                                <span style={{background:'var(--bl-s)',color:'var(--bl-dk)',border:'1px solid var(--bl-m)',fontSize:12,fontWeight:700,padding:'2px 8px',borderRadius:6,display:'inline-block'}}>
                                  {f1(((row.profit2||0)/((row.totalInvested2||1)))*100,1)}%
                                </span>
                              </td>
                            )}
                            {(isRet||isRet2)&&(
                            <td style={{padding:'11px 18px',textAlign:'right',whiteSpace:'nowrap'}}>
                              {(row.yearlyWithdrawal||0)>0?(
                                <div>
                                  <div style={{fontWeight:700,color:'var(--rd)',fontFamily:'var(--mono)',fontSize:13}}>-{fKRW(row.yearlyWithdrawal)}</div>
                                  <div style={{fontSize:11,color:'rgba(255,59,48,.65)',marginTop:1}}>월 {fKRW(row.monthlyWithdrawal)}</div>
                                  {isCmp&&(row.yearlyWithdrawal2||0)>0&&(
                                    <div style={{marginTop:4,paddingTop:4,borderTop:'1px solid rgba(255,59,48,.12)'}}>
                                      <div style={{fontSize:12,color:'var(--rd)',opacity:.7}}>-{fKRW(row.yearlyWithdrawal2)} (2)</div>
                                    </div>
                                  )}
                                </div>
                              ):<span style={{color:'var(--t3)'}}>—</span>}
                            </td>
                            )}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </Card>

            </div>
          )}
        </div>
      </main>

      {/* DCA GUIDE SECTION */}
      <section id="dca-guide" style={{maxWidth:1180,margin:'32px auto 0',padding:'0 16px 40px'}}>
        <div style={{background:'var(--card)',border:'1px solid var(--bd)',borderRadius:'var(--r)',overflow:'hidden'}}>

          {/* 헤더 */}
          <div style={{
            background:'var(--bl-s)',
            padding:'20px 24px',
            borderBottom:'1px solid var(--bd)',
            display:'flex',alignItems:'center',gap:14
          }}>
            <div style={{flexShrink:0,width:40,height:40,borderRadius:12,background:'var(--bl)',
              display:'flex',alignItems:'center',justifyContent:'center',
              boxShadow:'0 4px 12px rgba(0,122,255,.35)'}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
              </svg>
            </div>
            <div>
              <h2 style={{fontSize:17,fontWeight:800,color:'var(--t1)',margin:'0 0 4px',letterSpacing:'-0.3px'}}>
                DCA란 무엇인가?
              </h2>
              <p style={{fontSize:14,color:'var(--t2)',margin:0,lineHeight:1.5}}>
                Dollar Cost Averaging — 정액 분할 매수의 원리와 장점을 알아봅니다
              </p>
            </div>
          </div>

          {/* 본문 — auto-fit grid로 모바일 자동 1칸 */}
          <div style={{
            padding:'22px 24px 0',
            display:'grid',
            gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',
            gap:24
          }}>
            <div>
              <h3 style={{fontSize:14,fontWeight:700,color:'var(--t1)',margin:'0 0 11px',display:'flex',alignItems:'center',gap:8}}>
                <span style={{width:3,height:16,background:'var(--bl)',borderRadius:2,display:'inline-block',flexShrink:0}}></span>
                DCA란?
              </h3>
              <p style={{fontSize:14.5,color:'var(--t2)',lineHeight:1.85,margin:0}}>
                DCA는 <strong style={{color:'var(--t1)'}}>Dollar Cost Averaging</strong>의 줄임말입니다.
                우리말로 하면 '정액 분할 매수'. 어렵게 들리는데, 사실 별거 없습니다.
                매달 같은 날, 같은 금액을 꾸준히 사는 것. 그게 전부입니다.
              </p>
              <p style={{fontSize:14.5,color:'var(--t2)',lineHeight:1.85,margin:'11px 0 0'}}>
                시장이 오를 때도, 내릴 때도. 뉴스에서 공포를 쏟아낼 때도, 모두가 환호할 때도.
                그냥 삽니다. 생각 없이. 어쩌면 생각 없는 게 장점입니다.
              </p>
            </div>
            <div>
              <h3 style={{fontSize:14,fontWeight:700,color:'var(--t1)',margin:'0 0 11px',display:'flex',alignItems:'center',gap:8}}>
                <span style={{width:3,height:16,background:'var(--bl)',borderRadius:2,display:'inline-block',flexShrink:0}}></span>
                왜 DCA인가
              </h3>
              <p style={{fontSize:14.5,color:'var(--t2)',lineHeight:1.85,margin:0}}>
                주식 투자를 어렵게 만드는 건 <strong style={{color:'var(--t1)'}}>'언제 살까'</strong>는 질문입니다.
                수십 년의 데이터는 반복해서 같은 말을 합니다.
                타이밍을 맞추려 할수록, 오히려 수익률이 낮아집니다.
              </p>
              <p style={{fontSize:14.5,color:'var(--t2)',lineHeight:1.85,margin:'11px 0 0'}}>
                DCA는 그 질문 자체를 지웁니다. 비쌀 때는 조금 사고, 쌀 때는 더 많이 사게 됩니다.
                자연스럽게. 의도하지 않아도. 평균 매입 단가가 낮아지는 건
                <strong style={{color:'var(--t1)'}}> 수학적으로 자동</strong>으로 일어납니다.
              </p>
            </div>
          </div>

          {/* 인용구 */}
          <div style={{padding:'18px 24px 24px'}}>
            <div style={{borderTop:'1px solid var(--bd)',paddingTop:16,display:'flex',flexDirection:'column',gap:13}}>
              <blockquote style={{margin:0,padding:'14px 18px',
                background:'var(--tip-bg)',borderLeft:'3px solid var(--bl)',borderRadius:'0 10px 10px 0'}}>
                <p style={{fontSize:14,color:'var(--t1)',lineHeight:1.88,margin:0,fontStyle:'italic'}}>
                  "꾸준한 분할매수(DCA)는 감정을 비우는 루틴이다. 시장이 환호할 때나 공포에 떨 때나,
                  기계적으로 같은 금액을 투입하는 행위. 이것은 시장을 '안다'고 주장하는 대신,
                  시장이 장기적으로 성장할 것임을 '믿는다'는 태도다.
                  그리고 믿음은, 지식보다 훨씬 더 질긴 인내심을 요구한다."
                </p>
                <cite style={{display:'block',marginTop:9,fontSize:14,color:'var(--bl)',fontWeight:700,fontStyle:'normal'}}>
                  — 《절대 실패하지 않는 미국 주식 ETF 투자》 중에서
                </cite>
              </blockquote>
              <blockquote style={{margin:0,padding:'14px 18px',
                background:'var(--tip-bg)',borderLeft:'3px solid var(--bl)',borderRadius:'0 10px 10px 0'}}>
                <p style={{fontSize:14,color:'var(--t1)',lineHeight:1.88,margin:0,fontStyle:'italic'}}>
                  "이것이야말로 가장 급진적인 단순함이다. 지식의 포기가 아니라, 불필요한 복잡성의 거부.
                  우리는 똑똑해지려고 애쓰는 대신, 시스템의 힘을 빌리기로 선택한 것이다."
                </p>
                <cite style={{display:'block',marginTop:9,fontSize:14,color:'var(--bl)',fontWeight:700,fontStyle:'normal'}}>
                  — 《절대 실패하지 않는 미국 주식 ETF 투자》 중에서
                </cite>
              </blockquote>
            </div>
          </div>

        </div>
      </section>

      {/* FOOTER */}
      <footer className="r-footer" style={{borderTop:'1px solid var(--bd)',padding:'20px 24px',maxWidth:1180,margin:'0 auto',
        display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
        <span style={{fontSize:14,fontWeight:600,color:'var(--t2)',display:'flex',alignItems:'center',gap:6}}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
          DCA Compound Simulator — ezlong.com
        </span>
        <div style={{fontSize:14,color:'var(--t2)',display:'flex',gap:20,flexWrap:'wrap'}}>
          <span>과거 수익률은 미래 수익을 보장하지 않습니다</span>
          <span>투자 시 원금 손실의 위험이 있습니다</span>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
<script src="/ez-footer.js"></script>

</div><!-- /overflow-x wrapper (2026-07-04) -->

</body>
</html>
