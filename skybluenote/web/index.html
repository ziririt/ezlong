<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/skybluenote/web/">

  <meta charset="UTF-8">
  <!-- 2026-09-15: 구글 검색 목록에서 뺀다(한시).
       증상: 애드센스가 ezlong.com 을 '가치가 별로 없는 콘텐츠'로 두 번째 거절.
       실측: 이 페이지는 Flutter 웹 빌드라 화면을 캔버스로 그린다 - 크롤러가 받는
       글자 수가 렌더 후에도 **0자**다. 색인돼 봐야 빈 페이지 한 장이고, 그 한 장이
       도메인 전체 심사를 끌어내린다. 검색 유입이 필요한 페이지도 아니다.
       앱 저장소 관할 파일이지만(9절) 색인 표시만 바꾸고 앱 동작은 건드리지 않았다.
       되돌릴 때: 이 줄과 robots.txt Disallow, sitemap 항목을 함께 되살린다. -->
  <meta name="robots" content="noindex,follow">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI 답변을 붙여넣고 한 번 누르면 깔끔해지는 노트. 표까지 다시 세웁니다.">
  <meta name="theme-color" content="#4FC3F7">
  <meta property="og:title" content="Skyblue Note">
  <meta property="og:description" content="AI 답변을 붙여넣고 한 번 누르면 깔끔해지는 노트.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Skyblue Note">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <!-- ?v= 는 캐시 깨기다. 브라우저는 파비콘을 지독하게 오래 붙들고
       있어서, 파일만 바꾸면 몇 주씩 옛 아이콘이 남는다. -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=2"/>

  <title>Skyblue Note</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-itunes-app" content="app-id=6802185169">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
