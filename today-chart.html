<script>
var DATA_URL = '/data/today-chart-data.json';
var SYMBOL_ORDER = ['SOXX', 'QQQ', 'SOXL', 'TQQQ', 'TSLA', 'NVDA'];
var allEntries = [];
var currentFilter = '전체';

function escHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtPct(v) {
  if (v === null || v === undefined) return 'N/A';
  var sign = v >= 0 ? '+' : '';
  return sign + v.toFixed(2) + '%';
}

function loadData() {
  fetch(DATA_URL + '?t=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      allEntries = (data.entries || []).slice().sort(function (a, b) {
        return (b.id || '').localeCompare(a.id || '');
      });
      renderUpdatedAt(data);
      renderFilters();
      renderList();
    })
    .catch(function (e) {
      document.getElementById('tc-list').innerHTML =
        '<div class="tc-state">데이터를 불러오지 못했습니다.<br>' + escHtml(e.message) + '</div>';
      document.getElementById('tc-updated-at').textContent = '불러오기 실패';
    });
}

function renderUpdatedAt(data) {
  var el = document.getElementById('tc-updated-at');
  if (!data.updated_at) { el.textContent = ''; return; }
  var d = new Date(data.updated_at);
  var kst = new Date(d.getTime() + 9 * 3600 * 1000);
  var mm = kst.getUTCMonth() + 1;
  var dd = kst.getUTCDate();
  var hh = String(kst.getUTCHours()).padStart(2, '0');
  var mi = String(kst.getUTCMinutes()).padStart(2, '0');
  el.textContent = '최종 업데이트: ' + mm + '/' + dd + ' ' + hh + ':' + mi + ' KST · 총 ' + allEntries.length + '개';
}

function renderFilters() {
  var present = {};
  allEntries.forEach(function (e) { present[e.symbol] = true; });
  var syms = SYMBOL_ORDER.filter(function (s) { return present[s]; });
  var html = '<button class="tc-chip active" data-f="전체">전체</button>';
  syms.forEach(function (s) {
    html += '<button class="tc-chip" data-f="' + s + '">' + s + '</button>';
  });
  var container = document.getElementById('tc-filters');
  container.innerHTML = html;
  container.querySelectorAll('.tc-chip').forEach(function (btn) {
    btn.addEventListener('click', function () {
      container.querySelectorAll('.tc-chip').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-f');
      renderList();
    });
  });
}

function renderList() {
  var list = document.getElementById('tc-list');
  var entries = allEntries;
  if (currentFilter !== '전체') {
    entries = entries.filter(function (e) { return e.symbol === currentFilter; });
  }
  if (!entries.length) {
    list.innerHTML = '<div class="tc-state">아직 분석 데이터가 없습니다.<br>매일 2회(06:30 · 22:35 KST) 자동 업데이트됩니다.</div>';
    return;
  }
  list.innerHTML = entries.map(renderCard).join('');
}

function renderCard(e) {
  var changeClass = (e.change_pct || 0) >= 0 ? 'up' : 'down';
  var paragraphs = (e.paragraphs || []).map(function (p) {
    return '<p>' + escHtml(p) + '</p>';
  }).join('');
  var tags = (e.tags || []).map(function (t) {
    return '<span class="tc-tag">' + escHtml(t) + '</span>';
  }).join('');

  var indParts = [];
  if (e.ema5 != null) indParts.push('5일선(EMA) ' + e.ema5);
  if (e.ema20 != null) indParts.push('20일선(EMA) ' + e.ema20);
  if (e.ema50 != null) indParts.push('50일선(EMA) ' + e.ema50);
  if (e.ema200 != null) indParts.push('200일선(EMA) ' + e.ema200);
  if (e.rsi14 != null) indParts.push('RSI(14) ' + e.rsi14);
  if (e.bb_upper != null) indParts.push('볼린저 ' + e.bb_lower + '~' + e.bb_upper);
  if (e.adx14 != null) indParts.push('ADX(14) ' + e.adx14);
  if (e.stoch_k != null) indParts.push('스토캐스틱 %K ' + e.stoch_k + (e.stoch_is_approx ? '(근사)' : ''));
  if (e.high52 != null) indParts.push('52주 고가 ' + e.high52 + '(' + e.high52_date + ')');
  if (e.low52 != null) indParts.push('52주 저가 ' + e.low52 + '(' + e.low52_date + ')');
  var r = e.returns || {};
  var retParts = [];
  if (r['1w'] != null) retParts.push('1주 ' + fmtPct(r['1w']));
  if (r['1m'] != null) retParts.push('1개월 ' + fmtPct(r['1m']));
  if (r['3m'] != null) retParts.push('3개월 ' + fmtPct(r['3m']));
  if (r['6m'] != null) retParts.push('6개월 ' + fmtPct(r['6m']));
  if (r['ytd'] != null) retParts.push('연초대비 ' + fmtPct(r['ytd']));

  return (
    '<div class="tc-card">' +
      '<div class="tc-card-top">' +
        '<span class="tc-symbol-badge">' + escHtml(e.symbol) + '</span>' +
        '<span class="tc-change-badge ' + changeClass + '">' + fmtPct(e.change_pct) + '</span>' +
        '<span class="tc-timestamp">' + escHtml(e.timestamp_kst) + '</span>' +
      '</div>' +
      '<h2 class="tc-headline">' + escHtml(e.headline) + '</h2>' +
      '<div class="tc-price-row">' + (e.price != null ? e.price.toFixed(2) : '-') + ' USD</div>' +
      (e.chart_path ? '<div class="tc-chart-wrap"><img src="' + escHtml(e.chart_path) + '" alt="' + escHtml(e.symbol) + ' 차트 — 이동평균선·RSI" loading="lazy"></div>' : '') +
      '<div class="tc-indicators">' + escHtml(indParts.join(' · ')) + (retParts.length ? '<br>기간 수익률 — ' + escHtml(retParts.join(' · ')) : '') + '</div>' +
      '<div class="tc-body">' + paragraphs + '</div>' +
      (tags ? '<div class="tc-tags">' + tags + '</div>' : '') +
    '</div>'
  );
}

loadData();
</script>
